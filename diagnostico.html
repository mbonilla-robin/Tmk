<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnóstico - PullToRefresh</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
    }
    .success { color: #22c55e; font-weight: bold; }
    .error { color: #ef4444; font-weight: bold; }
    .warning { color: #f59e0b; font-weight: bold; }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px 5px;
    }
    button:hover { background: #2563eb; }
    button:active { background: #1d4ed8; }
    pre {
      background: #f3f4f6;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
    }
    .section {
      border: 1px solid #e5e7eb;
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>🔧 Diagnóstico de PullToRefresh</h1>
  
  <div class="section">
    <h2>Estado del Sistema</h2>
    <div id="diagnostico-resultado"></div>
  </div>

  <div class="section">
    <h2>Acciones de Reparación</h2>
    <button onclick="limpiarServiceWorker()">🗑️ Eliminar Service Worker</button>
    <button onclick="limpiarCache()">🧹 Limpiar Todo el Cache</button>
    <button onclick="recargarPagina()">🔄 Recargar Página</button>
    <button onclick="abrirAppPrincipal()">🏠 Abrir App Principal</button>
  </div>

  <div class="section">
    <h2>Log de Acciones</h2>
    <div id="log"></div>
  </div>

  <script>
    function log(mensaje, tipo = 'info') {
      const logDiv = document.getElementById('log');
      const timestamp = new Date().toLocaleTimeString();
      const classMap = { success: 'success', error: 'error', warning: 'warning' };
      logDiv.innerHTML += `<div class="${classMap[tipo] || ''}">[${timestamp}] ${mensaje}</div>`;
    }

    async function diagnosticar() {
      const resultado = document.getElementById('diagnostico-resultado');
      let html = '';

      // 1. Check Service Worker
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        html += `<p><strong>Service Workers registrados:</strong> ${registrations.length}</p>`;
        registrations.forEach((reg, i) => {
          html += `<p class="warning">SW ${i + 1}: ${reg.scope} (Estado: ${reg.active ? 'activo' : 'inactivo'})</p>`;
        });
      }

      // 2. Check PullToRefresh
      html += `<p><strong>PullToRefresh está definido:</strong> `;
      if (typeof PullToRefresh !== 'undefined') {
        html += `<span class="success">✓ SÍ</span></p>`;
      } else {
        html += `<span class="error">✗ NO (Este es el problema)</span></p>`;
      }

      // 3. Check React hooks
      html += `<p><strong>React hooks disponibles:</strong> `;
      const hooks = ['useState', 'useEffect', 'useRef'];
      const missingHooks = hooks.filter(h => typeof window[h] === 'undefined');
      if (missingHooks.length === 0) {
        html += `<span class="success">✓ Todos disponibles</span></p>`;
      } else {
        html += `<span class="error">✗ Faltan: ${missingHooks.join(', ')}</span></p>`;
      }

      // 4. Check cache storage
      if ('caches' in window) {
        const cacheNames = await caches.keys();
        html += `<p><strong>Caches almacenados:</strong> ${cacheNames.length}</p>`;
        cacheNames.forEach(name => {
          html += `<p class="warning">Cache: ${name}</p>`;
        });
      }

      resultado.innerHTML = html;
    }

    async function limpiarServiceWorker() {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        let count = 0;
        for (const reg of registrations) {
          await reg.unregister();
          count++;
        }
        log(`✓ ${count} Service Worker(s) eliminado(s)`, 'success');
        diagnosticar();
      } else {
        log('Service Worker no soportado en este navegador', 'warning');
      }
    }

    async function limpiarCache() {
      if ('caches' in window) {
        const cacheNames = await caches.keys();
        let count = 0;
        for (const name of cacheNames) {
          await caches.delete(name);
          count++;
        }
        log(`✓ ${count} cache(s) eliminado(s)`, 'success');
        diagnosticar();
      }
      
      // También limpiar localStorage y sessionStorage
      localStorage.clear();
      sessionStorage.clear();
      log('✓ LocalStorage y SessionStorage limpiados', 'success');
    }

    function recargarPagina() {
      log('Recargando página...', 'info');
      setTimeout(() => {
        window.location.reload(true);
      }, 500);
    }

    function abrirAppPrincipal() {
      log('Abriendo app principal...', 'info');
      setTimeout(() => {
        window.location.href = '/';
      }, 500);
    }

    // Ejecutar diagnóstico al cargar
    diagnosticar();
    log('Diagnóstico completado', 'success');
  </script>
</body>
</html>
