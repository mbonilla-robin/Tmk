  <script type="text/babel">
    
    // 🟢 Funciones auxiliares globales con sintaxis estándar para garantizar el hoisting en Babel
    function getLocalStorageItemSafe(key, fallback = null) {
      try {
        const val = localStorage.getItem(key);
        if (val === null || val === undefined || val === "null" || val === "undefined" || val === "") {
          return fallback;
        }
        return val;
      } catch (e) {
        return fallback;
      }
    }

    function getEffectiveApiUrl(url) {
      if (!url) return "";
      let clean = url.trim();
      if (clean.includes("/a/macros/")) {
        clean = clean.replace(/\/a\/macros\/[^\/]+\/s\//, "/macros/s/");
      }
      return clean;
    }

    function getInicialUsuario() {
      const u = getLocalStorageItemSafe("robin_usuario_actual", null);
      if (u === "null" || u === "undefined" || u === "") return null;
      return u;
    }

    function cleanIdTarea(id) {
      if (!id) return "";
      const idStr = String(id).trim();
      if (idStr.includes("GMT") || (idStr.includes("2026") && idStr.length > 15) || idStr.includes("Venezuela") || idStr.startsWith("STB-")) {
        return "";
      }
      return idStr;
    }

    function stripEmoji(str) {
      if (!str) return "";
      return String(str)
        .replace(/[\u2600-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF]/g, '')
        .trim();
    }

    function cleanEstado(val) {
      if (!val) return "";
      return String(val)
        .replace(/[\u2600-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF]/g, '')
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }

    function cleanPrioridad(val) {
      if (!val) return "media";
      return String(val)
        .replace(/[\u2600-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF]/g, '')
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }

    function formatearFecha(fechaStr) {
      if (!fechaStr) return "";
      const partes = fechaStr.split("-");
      if (partes.length === 3) {
        return `${partes[2]}/${partes[1]}`;
      }
      return fechaStr.split("T")[0];
    }

    function obtenerTiempoFecha(val) {
      if (!val) return Infinity;
      if (val instanceof Date) {
        return new Date(val.getFullYear(), val.getMonth(), val.getDate()).getTime();
      }
      var str = String(val).trim();
      
      if (str.includes("GMT") || str.includes("Venezuela") || str.includes(":") || (isNaN(str[0]) && isNaN(parseInt(str, 10)))) {
        var parsedDate = new Date(str);
        if (!isNaN(parsedDate.getTime())) {
          return new Date(parsedDate.getFullYear(), parsedDate.getMonth(), parsedDate.getDate()).getTime();
        }
      }

      str = str.split(/[ T]/)[0].trim();
      var partes = str.split(/[-/]/);
      if (partes.length === 3) {
        var dia, mes, anio;
        if (partes[0].length === 4) {
          anio = parseInt(partes[0], 10); 
          mes = parseInt(partes[1], 10) - 1; 
          dia = parseInt(partes[2], 10);
        } else {
          dia = parseInt(partes[0], 10); 
          mes = parseInt(partes[1], 10) - 1; 
          anio = parseInt(partes[2], 10);
          if (anio < 100) anio += 2000;
        }
        var d = new Date(anio, mes, dia);
        return isNaN(d.getTime()) ? Infinity : d.getTime();
      }
      return Infinity;
    }

    function sonMismasFechas(d1, d2) {
      if (!d1 || !d2) return false;
      const t1 = obtenerTiempoFecha(d1);
      const t2 = obtenerTiempoFecha(d2);
      return t1 !== Infinity && t2 !== Infinity && t1 === t2;
    }

    function isValidIdTarea(id) {
      if (!id) return false;
      const idStr = String(id).trim().toUpperCase();
      if (idStr.length === 0) return false;
      if (idStr.includes("GMT") || idStr.includes("VENEZUELA") || idStr.includes(":")) return false;
      if (idStr === "PENDIENTE" || idStr === "EN PROGRESO" || idStr === "SEGUIMIENTO" || idStr === "EN REVISION" || idStr === "EN PAUSA" || idStr === "COMPLETADA") return false;
      if (/^\d{2}[/-]\d{2}[/-]\d{4}$/.test(idStr) || /^\d{4}[/-]\d{2}[/-]\d{2}$/.test(idStr)) return false;
      return true;
    }

    function getPriorityWeight(priText) {
      const clean = cleanPrioridad(priText);
      if (clean === "alta") return 3;
      if (clean === "baja") return 1;
      return 2;
    }

    function parseDetalles(detallesRaw) {
      const text = detallesRaw || "";
      const lines = text.split('\n');
      const notasLines = [];
      const subtareas = [];
      const historial = [];

      lines.forEach(line => {
        const trimmed = line.trim();
        if (trimmed.startsWith("•") || trimmed.startsWith("• [")) {
          historial.push(trimmed);
        } else if (trimmed.startsWith("- [ ]") || trimmed.startsWith("- [x]") || trimmed.startsWith("* [ ]") || trimmed.startsWith("* [x]")) {
          const completed = trimmed.includes("[x]");
          const taskText = trimmed.replace(/^[-*]\s*\[[ x]\]\s*/, "");
          subtareas.push({ text: taskText, completed });
        } else if (trimmed !== "") {
          notasLines.push(line);
        }
      });

      return {
        notas: notasLines.join('\n'),
        subtareas,
        historial
      };
    }

    function serializeDetalles(notas, subtareas, historial) {
      let text = (notas || "").trim();
      
      if (subtareas && subtareas.length > 0) {
        const subtasksText = subtareas.map(s => `- [${s.completed ? 'x' : ' '}] ${s.text}`).join('\n');
        text = text ? `${text}\n\n${subtasksText}` : subtasksText;
      }

      if (historial && historial.length > 0) {
        const historialText = historial.join('\n');
        text = text ? `${text}\n\n${historialText}` : historialText;
      }

      return text;
    }

    function convertirFechaAInput(fechaStr) {
      if (!fechaStr) return "";
      if (/^\d{4}-\d{2}-\d{2}$/.test(fechaStr)) return fechaStr;
      const partes = fechaStr.split(/[-/]/);
      if (partes.length === 3) {
        if (partes[0].length === 4) {
          return `${partes[0]}-${String(partes[1]).padStart(2, '0')}-${String(partes[2]).padStart(2, '0')}`;
        } else {
          const dia = String(partes[0]).padStart(2, '0');
          const mes = String(partes[1]).padStart(2, '0');
          let anio = partes[2];
          if (anio.length === 2) anio = "20" + anio;
          return `${anio}-${mes}-${dia}`;
        }
      }
      const d = new Date(fechaStr);
      if (!isNaN(d.getTime())) {
        return d.toISOString().split('T')[0];
      }
      return "";
    }

    function generateBrandId(marca) {
      const prefix = String(marca || "TSK").substring(0, 3).toUpperCase().replace(/[^A-Z]/g, "X");
      const rand = Math.floor(10000 + Math.random() * 90000);
      return `STB-${prefix}-${rand}`;
    }

    // =========================================================================
    // 📋 COMPONENTE: LAYOUT DE TABLA AGRUPADA
    // =========================================================================
    function LayoutTablaAgrupada({ tareas, onUpdateField, onSelectTask, onDeleteTask, getMarcaStyle, filtroTiempo, currentTheme }) {
      
      const tareasAgrupadasPorMarca = useMemo(() => {
        const agrupamiento = {};
        
        tareas.forEach(t => {
          const marcaKey = t.marca || "Otros";
          if (!agrupamiento[marcaKey]) {
            agrupamiento[marcaKey] = [];
          }
          agrupamiento[marcaKey].push(t);
        });

        const PRIORIDADES_ESTADOS = {
          "pendiente": 1,
          "en progreso": 2,
          "seguimiento": 3,
          "en revision": 4,
          "en pausa": 5,
          "completada": 99
        };

        Object.keys(agrupamiento).forEach(marca => {
          agrupamiento[marca].sort((a, b) => {
            const pesoA = getPriorityWeight(a.prioridad);
            const pesoB = getPriorityWeight(b.prioridad);
            if (pesoA !== pesoB) {
              return pesoB - pesoA;
            }
            
            const estA = cleanEstado(a.estado);
            const estB = cleanEstado(b.estado);
            return (PRIORIDADES_ESTADOS[estA] || 50) - (PRIORIDADES_ESTADOS[estB] || 50);
          });
        });

        return agrupamiento;
      }, [tareas]);

      const totalTareas = tareas.length;

      return (
        <div className={`border ${currentTheme.border} rounded-xl shadow-sm overflow-hidden animate-slide-in ${currentTheme.cardBg} w-full max-w-full`}>

            <table className="w-full text-left border-collapse min-w-[900px]">

                <tr className="bg-zinc-50/50 border-b border-zinc-200/65 text-xs font-bold text-zinc-400 uppercase tracking-wider">

                  <th className="py-3.5 px-5 w-24 text-center">Prioridad</th>
                  <th className="py-3.5 px-5 w-28">Categoría</th>
                  <th className="py-3.5 px-5">Entregable</th>
                  <th className="py-3.5 px-5 w-32 text-center">Estado</th>
                  <th className="py-3.5 px-5 w-28 text-center">Fecha Límite</th>
                  <th className="py-3.5 px-5 w-28">Asignado</th>
                  <th className="py-3.5 px-5 text-center w-16">Acciones</th>
                </tr>
              </thead>
              <tbody className="text-sm divide-y divide-zinc-150/40">
                {totalTareas === 0 ? (
                  <tr>
                    <td colSpan="8" className="py-16 text-center text-zinc-500 bg-zinc-50/5">
                      <div className="flex flex-col items-center justify-center gap-2 py-6">
                        <i className="fa-regular fa-folder-open text-zinc-300 text-3xl"></i>
                        <p className="font-extrabold text-sm">Sin entregables en esta pestaña</p>
                        <p className="text-xs text-zinc-400 leading-relaxed px-4">
                          Cambia tus filtros o crea un nuevo entregable.
                        </p>
                      </div>
                    </td>
                  </tr>

                  Object.keys(tareasAgrupadasPorMarca).map(marca => {
                    const tareasDeMarca = tareasAgrupadasPorMarca[marca];
                    const badgeMarcaStyle = getMarcaStyle(marca);

                    return (
                      <React.Fragment key={marca}>
                        <tr className="bg-zinc-100/50 border-y border-zinc-200/30">
                          <td colSpan="8" className="py-3 px-5">
                            <div className="flex items-center gap-3">
                              <span className={`text-[10px] font-black px-2.5 py-1 rounded-md border uppercase tracking-wider ${badgeMarcaStyle.bg} ${badgeMarcaStyle.text} ${badgeMarcaStyle.border}`}>
                                {marca}

                              <span className="text-xs text-zinc-400 font-extrabold uppercase tracking-wider">
                                — {tareasDeMarca.length} {tareasDeMarca.length === 1 ? 'Entregable' : 'Entregables'}

                            </div>
                          </td>
                        </tr>

                        {tareasDeMarca.map(t => {
                          const cEstado = ESTADOS_MAPA.find(e => cleanEstado(e.id) === cleanEstado(t.estado)) || { color: "text-zinc-700", dot: "bg-zinc-300" };

                                  <span className={`w-2 h-2 rounded-full ${cEstado.dot}`}></span>
                                  <select

                                    className="text-xs font-bold py-1 bg-transparent border-0 cursor-pointer focus:outline-none focus:ring-0 text-zinc-800 font-sans"
                                  >
                                    {LISTA_ESTADOS_VALIDOS.map(opt => (

                                        {stripEmoji(opt)}
                                      </option>
                                    ))}
                                  </select>
                                </div>
                              </td>

                              <td className="py-4 px-5 text-center" onClick={(e) => e.stopPropagation()}>
                                <input
                                  type="date"
                                  value={convertirFechaAInput(t.deadline)}
                                  onChange={(e) => {
                                    const val = e.target.value;
                                    if (val && val.length === 10) {
                                      onUpdateField(t, "deadline", val);

            </table>

      );
    }

    // =========================================================================
    // 🗂️ COMPONENTE: LAYOUT KANBAN (SIN EMOJIS EN RENDERING)
    // =========================================================================
    function LayoutKanban({ tareas, onUpdateField, onSelectTask, onDeleteTask, getMarcaStyle, currentTheme }) {
      const [dragOverCol, setDragOverColumn] = useState(null);

      const handleDragStart = (e, task) => {
        e.dataTransfer.setData("taskId", task.idTarea || "");
        e.dataTransfer.setData("taskInfo", task.info || "");
        e.dataTransfer.effectAllowed = "move";
      };

      const handleDrop = (e, targetEstado) => {
        e.preventDefault();
        setDragOverColumn(null);
        const taskId = e.dataTransfer.getData("taskId");
        const taskInfo = e.dataTransfer.getData("taskInfo");

        const taskMatched = tareas.find(t => (t.idTarea === taskId && taskId) || t.info === taskInfo);
        if (taskMatched && cleanEstado(taskMatched.estado) !== cleanEstado(targetEstado)) {
          onUpdateField(taskMatched, "estado", targetEstado);
        }
      };

      const ordenarTareasPorPrioridad = (tareasList) => {
        return [...tareasList].sort((a, b) => getPriorityWeight(b.prioridad) - getPriorityWeight(a.prioridad));
      };

      return (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4 items-start h-full animate-slide-in">
          {ESTADOS_MAPA.map(col => {
            const tareasColumnaRaw = tareas.filter(t => cleanEstado(t.estado) === cleanEstado(col.id));
            const tareasColumna = ordenarTareasPorPrioridad(tareasColumnaRaw);
            const isOverThis = dragOverCol === col.id;
            
            return (
              <div 
                key={col.id} 
                onDragOver={(e) => { e.preventDefault(); setDragOverColumn(col.id); }}
                onDragLeave={() => setDragOverColumn(null)}
                onDrop={(e) => handleDrop(e, col.id)}
                className={`border p-3 rounded-xl flex flex-col gap-3 min-h-[300px] md:min-h-[500px] transition-all ${
                  isOverThis ? 'border-dashed border-zinc-400 bg-zinc-100/30' : currentTheme.border
                } ${currentTheme.cardBg}`}
              >
                <div className="flex items-center justify-between pb-2 border-b border-zinc-200/60">
                  <span className="text-xs font-black text-zinc-400 uppercase tracking-wider flex items-center gap-2">
                    <span className={`w-2.5 h-2.5 rounded-full ${col.dot}`}></span>
                    {stripEmoji(col.id)}
                  </span>
                  <span className="text-xs px-2 py-0.5 rounded-full bg-zinc-200/60 text-zinc-655 font-bold">{tareasColumna.length}</span>
                </div>

                <div className="flex flex-col gap-2.5 overflow-y-auto max-h-[520px]">
                  {tareasColumna.length === 0 ? (
                    <div className="text-center py-8 text-zinc-400 text-xs font-semibold">
                      Sin entregables
                    </div>
                  ) : (
                    tareasColumna.map(t => {
                      const cMarca = getMarcaStyle(t.marca);
                      const cPrioridad = PRIORIDADES_MAPA.find(p => cleanPrioridad(p.id) === cleanPrioridad(t.prioridad)) || PRIORIDADES_MAPA[1];
                      
                      const avanzarEstado = (e) => {
                        e.stopPropagation();
                        const index = ESTADOS_MAPA.findIndex(e => cleanEstado(e.id) === cleanEstado(t.estado));
                        const nextIndex = (index + 1) % ESTADOS_MAPA.length;
                        onUpdateField(t, "estado", ESTADOS_MAPA[nextIndex].id);
                      };

                      return (
                        <div 
                          key={t.idTarea + t.info}
                          draggable={true}
                          onDragStart={(e) => handleDragStart(e, t)}
                          onClick={() => onSelectTask(t)}
                          className={`${currentTheme.bg} p-4 rounded-xl border ${currentTheme.border} shadow-sm hover:shadow-md hover:border-zinc-400 cursor-grab active:cursor-grabbing transition-all flex flex-col gap-2 animate-zoom-in`}
                        >
                          <div className="flex items-center justify-between">
                            <span className={`text-[9px] font-black px-1.5 py-0.5 rounded uppercase tracking-wider border ${cMarca.bg} ${cMarca.text} ${cMarca.border}`}>
                              {t.marca || "Otros"}
                            </span>
                            <span className={`text-[8px] font-black px-1.5 py-0.5 rounded-full border uppercase ${cPrioridad.color}`}>
                              {stripEmoji(cPrioridad.label)}
                            </span>
                          </div>

                          <h4 className="text-sm font-bold leading-snug line-clamp-3">{t.info}</h4>

                          <div className="border-t border-zinc-200/50 pt-2 flex items-center justify-between text-xs font-bold text-zinc-400">
                            <span className="truncate max-w-[100px]">{t.personas || "Sin asignar"}</span>
                            <span className="font-semibold">{t.deadline ? formatearFecha(t.deadline) : "--/--"}</span>
                          </div>

                          <div className="flex items-center gap-1.5 mt-1 pt-1.5 border-t border-zinc-200/50">
                            <button 
                              onClick={avanzarEstado}
                              className="flex-1 text-center py-1 bg-zinc-100 hover:bg-zinc-200/80 text-zinc-655 font-bold text-[9px] rounded-lg border border-zinc-200/50 uppercase tracking-wider transition-all"
                            >
                              Siguiente
                            </button>
                            <button
                              onClick={(e) => { e.stopPropagation(); onDeleteTask(t); }}
                              title="Eliminar entregable"
                              className="p-1 text-zinc-400 hover:text-red-500 rounded-lg hover:bg-red-50/40 transition-all text-xs"
                            >
                              <i className="fa-regular fa-trash-can"></i>
                            </button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>

              </div>
            );
          })}
        </div>
      );
    }

    // =========================================================================
    // 👤 COMPONENTE: SELECTOR DE PERSONAS CHIPS
    // =========================================================================
    function SelectorPersonasChips({ personasSeleccionadas, onChange, listaGlobal, registrarNuevaPersona }) {
      const [buscar, setBuscar] = useState("");
      const [dropdownOpen, setDropdownOpen] = useState(false);
      const containerRef = useRef(null);

      const seleccionadasArray = useMemo(() => {
        if (!personasSeleccionadas) return [];
        return personasSeleccionadas.split(",").map(p => p.trim()).filter(Boolean);
      }, [personasSeleccionadas]);

      const handleTogglePersona = (p) => {
        let nuevas;
        if (seleccionadasArray.includes(p)) {
          nuevas = seleccionadasArray.filter(item => item !== p);
        } else {
          nuevas = [...seleccionadasArray, p];
        }
        onChange(nuevas.join(", "));
      };

      const handleAddCustom = (e) => {
        if (e.key === 'Enter' || e.type === 'click') {
          e.preventDefault();
          let val = buscar.trim();
          if (!val) return;
          if (!val.startsWith("@")) val = "@" + val;
          
          registrarNuevaPersona(val);
          if (!seleccionadasArray.includes(val)) {
            onChange([...seleccionadasArray, val].join(", "));
          }
          setBuscar("");
        }
      };

      useEffect(() => {
        const handleClickOutside = (event) => {
          if (containerRef.current && !containerRef.current.contains(event.target)) {
            setDropdownOpen(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      return (
        <div ref={containerRef} className="relative w-full">
          <div 
            onClick={() => setDropdownOpen(true)}
            className="min-h-[42px] w-full bg-zinc-50 border border-zinc-200 rounded-xl p-2 flex flex-wrap gap-1.5 items-center cursor-pointer hover:border-zinc-300 transition-all"
          >
            {seleccionadasArray.length === 0 ? (
              <span className="text-xs text-zinc-400 font-semibold px-2">Selecciona miembros del equipo...</span>
            ) : (
              seleccionadasArray.map(p => (
                <span key={p} className="inline-flex items-center gap-1 bg-zinc-100 border text-zinc-800 text-[11px] font-bold px-2 py-0.5 rounded-lg">
                  {p}
                  <button 
                    type="button"
                    onClick={(e) => { e.stopPropagation(); handleTogglePersona(p); }}
                    className="text-zinc-400 hover:text-red-500 font-bold ml-0.5 animate-pulse"
                  >
                    &times;
                  </button>
                </span>
              ))
            )}
          </div>

          {dropdownOpen && (
            <div className="absolute z-50 left-0 right-0 mt-1 bg-white border border-zinc-200 rounded-xl shadow-xl p-3 flex flex-col gap-2 max-h-60 overflow-y-auto animate-zoom-in">
              <div className="flex gap-1.5">
                <input 
                  type="text"
                  placeholder="Buscar o escribir miembro..."
                  value={buscar}
                  onChange={(e) => setBuscar(e.target.value)}
                  onKeyDown={handleAddCustom}
                  className="flex-1 bg-zinc-50 border border-zinc-200 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none font-bold"
                />
                <button 
                  type="button"
                  onClick={handleAddCustom}
                  className="bg-zinc-900 hover:bg-zinc-800 text-white text-xs font-bold px-3 py-1.5 rounded-lg"
                >
                  Añadir
                </button>
              </div>
              <div className="flex flex-col gap-1 mt-1">
                {listaGlobal
                  .filter(p => p.toLowerCase().includes(buscar.toLowerCase()))
                  .map(p => {
                    const isSel = seleccionadasArray.includes(p);
                    return (
                      <div 
                        key={p}
                        onClick={() => handleTogglePersona(p)}
                        className={`flex items-center justify-between px-2.5 py-1.5 rounded-lg text-xs font-bold cursor-pointer transition-all ${
                          isSel ? 'bg-zinc-100 text-zinc-900' : 'hover:bg-zinc-50 text-zinc-600'
                        }`}
                      >
                        <span>{p}</span>
                        {isSel && <i className="fa-solid fa-check text-emerald-500"></i>}
                      </div>
                    );
                  })}
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 🏠 COMPONENTE: LAYOUT DE HOME (DASHBOARD INICIO)
    // =========================================================================
    function LayoutHome({ tareas, nombreUsuario, username, onSelectTask, onUpdateField, widgets, onAddWidget, onDeleteWidget, currentTheme, getMarcaStyle, cleanIdTarea }) {
      const [widgetTitulo, setWidgetTitulo] = useState("");
      const [widgetLink, setWidgetLink] = useState("");
      const [widgetIcon, setWidgetIcon] = useState("link");
      const [widgetColor, setWidgetColor] = useState("bg-blue-50 text-blue-700");
      const [showAddWidgetModal, setShowAddWidgetModal] = useState(false);

      const stats = useMemo(() => {
        const total = tareas.length;
        const completadas = tareas.filter(t => cleanEstado(t.estado) === "completada").length;
        const enProgreso = tareas.filter(t => cleanEstado(t.estado) === "en progreso").length;
        
        // retrasados
        const hoy = new Date();
        const tHoy = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()).getTime();
        const atrasadas = tareas.filter(t => {
          const tDeadline = obtenerTiempoFecha(t.deadline);
          return tDeadline !== Infinity && tDeadline < tHoy && cleanEstado(t.estado) !== "completada";
        }).length;

        return { total, completadas, enProgreso, atrasadas };
      }, [tareas]);

      const highPriorityTasks = useMemo(() => {
        return tareas
          .filter(t => cleanPrioridad(t.prioridad) === "alta" && cleanEstado(t.estado) !== "completada")
          .slice(0, 5);
      }, [tareas]);

      const handleCreateWidget = (e) => {
        e.preventDefault();
        if (!widgetTitulo.trim() || !widgetLink.trim()) return;
        const nuevo = {
          id: "WID-" + Date.now(),
          titulo: widgetTitulo.trim(),
          link: widgetLink.trim(),
          icon: widgetIcon,
          color: widgetColor
        };
        onAddWidget(nuevo);
        setWidgetTitulo("");
        setWidgetLink("");
        setShowAddWidgetModal(false);
      };

      return (
        <div className="flex flex-col gap-6 animate-slide-in">
          {/* Bienvenida */}
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl border border-zinc-200/60 shadow-sm">
            <div>

        return marcasMetadata[selectedBrand] || { logoUrl: "", ejecutivo: "", disenador: "", content: "" };

        if (currentMeta) {
          setLogoUrl(currentMeta.logoUrl || "");
          setEjecutivo(currentMeta.ejecutivo || "");

          setContent(currentMeta.content || "");

          logoUrl: "",

    // =========================================================================
    // 📝 COMPONENTE: MODAL DE EDICIÓN DE ENTREGABLE (COMPLETO)
    // =========================================================================
    function ModalEdicionTarea({ tarea, onClose, onSave, listaPersonas, registrarNuevaPersona, marcasDisponibles, isSubmitting }) {
      const [info, setInfo] = useState(tarea.info || "");
      const [categoria, setCategoria] = useState(tarea.categoria || "");
      const [marca, setMarca] = useState(tarea.marca || "");
      const [prioridad, setPrioridad] = useState(tarea.prioridad || "🟡 Media");
      const [estado, setEstado] = useState(tarea.estado || "⚪ Pendiente");
      const [deadline, setDeadline] = useState(tarea.deadline || "");
      const [personas, setPersonas] = useState(tarea.personas || "");
      const [rawDetalles, setRawDetalles] = useState(tarea.detalles || "");

      const parsed = useMemo(() => parseDetalles(rawDetalles), [rawDetalles]);
      
      const [notes, setNotes] = useState(parsed.notas);
      const [subtareas, setSubtareas] = useState(parsed.subtareas);
      const [nuevoSubtareaText, setNuevoSubtareaText] = useState("");

      const handleAddSubtarea = (e) => {
        e.preventDefault();
        if (!nuevoSubtareaText.trim()) return;
        const nuevas = [...subtareas, { text: nuevoSubtareaText.trim(), completed: false }];
        setSubtareas(nuevas);
        setNuevoSubtareaText("");
        setRawDetalles(serializeDetalles(notes, nuevas, parsed.historial));
      };

      const handleToggleSubtarea = (index) => {
        const nuevas = [...subtareas];
        nuevas[index].completed = !nuevas[index].completed;
        setSubtareas(nuevas);
        setRawDetalles(serializeDetalles(notes, nuevas, parsed.historial));
      };

      const handleDeleteSubtarea = (index) => {
        const nuevas = subtareas.filter((_, i) => i !== index);
        setSubtareas(nuevas);
        setRawDetalles(serializeDetalles(notes, nuevas, parsed.historial));
      };

      const handleNotasChange = (newNotas) => {
        setNotes(newNotas);
        setRawDetalles(serializeDetalles(newNotas, subtareas, parsed.historial));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const tFinal = serializeDetalles(notes, subtareas, parsed.historial);
        onSave({
          ...tarea,
          info: info.trim(),
          categoria: categoria.trim(),
          marca,
          prioridad,
          estado,
          deadline,
          personas,
          detalles: tFinal
        });
      };

      return (
        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-[150] flex items-center justify-center p-4">
          <div className="bg-white p-6 rounded-2xl border border-zinc-200 shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto animate-zoom-in">
            <div className="flex items-center justify-between border-b pb-3 mb-4">
              <div className="flex items-center gap-2">
                <span className="text-xs font-bold font-mono text-zinc-400 bg-zinc-100 px-2 py-0.5 rounded">
                  {cleanIdTarea(tarea.idTarea) || "ID AUTOGENERADO"}
                </span>
                <h4 className="text-sm font-black text-zinc-900 uppercase tracking-wider">Detalles del Entregable</h4>
              </div>
              <button 
                onClick={onClose}
                className="text-zinc-400 hover:text-zinc-855 text-xl font-bold font-sans"
              >
                &times;
              </button>
            </div>

            <form onSubmit={handleSubmit} className="flex flex-col gap-4">

      const [activeTask, setActiveTask] = useState(null);

      const [nuevoUsuarioInput, setNuevoUsuarioInput] = useState("");

      const [marcasMetadata, setMarcasMetadata] = useState({});

      // 🟢 Estados de Firebase cargados asíncronamente
      const [firebaseLib, setFirebaseLib] = useState(null);
      const [usuariosConectados, setUsuariosConectados] = useState([]);

      const [listaPersonas, setListaPersonas] = useState(() => {
        const guardadas = localStorage.getItem("robin_personas_v2");
        if (guardadas) return JSON.parse(guardadas);
        return ["@fcolmenares", "@ralvarez", "@dsalavarria", "@mbonilla", "@gnebrus", "@sgiucastro"];
      });

      const [nuevaTarea, setNuevaTarea] = useState({
        marca: "La Santé", categoria: "", info: "", personas: "", detalles: "", estado: "⚪ Pendiente", deadline: "", prioridad: "🟡 Media"
      });

      // 🟢 Sondeo activo (polling) para esperar la carga asíncrona del script module de Firebase
      useEffect(() => {
        if (window.FirebaseLib) {
          setFirebaseLib(window.FirebaseLib);
          return;
        }
        const interval = setInterval(() => {
          if (window.FirebaseLib) {
            setFirebaseLib(window.FirebaseLib);
            clearInterval(interval);
          }
        }, 100);
        return () => clearInterval(interval);
      }, []);

      // 🟢 Inicialización de Presencia en Vivo vía Firestore (BLINDADO de re-inicialización)
      useEffect(() => {
        if (!usuario || !firebaseLib) return;
        const FirebaseLib = firebaseLib;

        let firebaseConfig = null;
        try {
          if (typeof __firebase_config !== 'undefined' && __firebase_config) {
            firebaseConfig = JSON.parse(__firebase_config);
          }
        } catch (e) {
          console.error("Firebase config parsing error", e);
        }

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'robin-trade-shopper-mkt';
        if (!firebaseConfig) return;

        let heartbeatInterval = null;
        let unsubscribe = null;

        const initPresence = async () => {
          try {
            const app = FirebaseLib.getApps().length === 0 
              ? FirebaseLib.initializeApp(firebaseConfig) 
              : FirebaseLib.getApp();
              
            const auth = FirebaseLib.getAuth(app);
            const db = FirebaseLib.getFirestore(app);

            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await FirebaseLib.signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await FirebaseLib.signInAnonymously(auth);
            }

            const currentUser = auth.currentUser;
            if (!currentUser) return;

            const presenceRef = FirebaseLib.doc(db, 'artifacts', appId, 'public', 'data', 'presencia', currentUser.uid);
            
            const writeHeartbeat = async () => {
              try {
                await FirebaseLib.setDoc(presenceRef, {
                  uid: currentUser.uid,
                  username: usuario,
                  nombre: nombreCompleto || `@${usuario}`,
                  lastSeen: new Date().getTime()
                }, { merge: true });
              } catch (e) {
                console.warn("Heartbeat error", e);
              }
            };

            await writeHeartbeat();
            heartbeatInterval = setInterval(writeHeartbeat, 20000);

            const presenceCollection = FirebaseLib.collection(db, 'artifacts', appId, 'public', 'data', 'presencia');
            unsubscribe = FirebaseLib.onSnapshot(presenceCollection, (snapshot) => {
              const activeUsers = [];
              const now = new Date().getTime();
              snapshot.forEach((doc) => {
                const data = doc.data();
                if (data.lastSeen && (now - data.lastSeen) < 60000) {
                  activeUsers.push(data);
                }
              });
              setUsuariosConectados(activeUsers);
            }, (err) => {
              console.warn("Presence listener warning: ", err);
            });

          } catch (e) {
            console.warn("Firebase Auth / Connection failed", e);
          }
        };

        initPresence();

        return () => {
          if (heartbeatInterval) clearInterval(heartbeatInterval);
          if (unsubscribe) unsubscribe();
        };
      }, [usuario, nombreCompleto, firebaseLib]);

      useEffect(() => {
        const u = localStorage.getItem("robin_usuario_actual");
        if (u === "null" || u === "undefined") {
          localStorage.removeItem("robin_usuario_actual");
          setUsuario(null);
        }
        const n = localStorage.getItem("robin_nombre_completo");
        if (n === "null" || n === "undefined") {
          localStorage.removeItem("robin_nombre_completo");
          setNombreCompleto("");
        }
      }, []);

      useEffect(() => {
        if (usuario) {
          fetchData(false);
        }
      }, [usuario]);

      useEffect(() => {
        if (!usuario) return;

        const autoRefreshInterval = setInterval(() => {
          if (!syncing && !loading && !isSubmitting) {
            fetchData(true); 
          }
        }, 30 * 1000); 
        
        return () => clearInterval(autoRefreshInterval);
      }, [usuario, syncing, loading, isSubmitting]);

      useEffect(() => {
        if (tareas.length > 0) {
          const detectadas = new Set();
          tareas.forEach(t => {
            if (t.personas) {
              const nombres = t.personas.split(/[\s,]+/);
              nombres.forEach(n => {
                const limpio = n.trim();
                if (limpio.length > 1) {
                  const conArroba = limpio.startsWith("@") ? limpio : "@" + limpio;
                  detectadas.add(conArroba);
                }
              });
            }
          });
          if (detectadas.size > 0) {
            const combinadas = Array.from(new Set([...listaPersonas, ...detectadas]));
            localStorage.setItem("robin_personas_v2", JSON.stringify(combinadas));
            setListaPersonas(combinadas);
          }
        }
      }, [tareas]);

      const showToast = (msg, type = "success") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      };

      const navegarA = (pagina, extraFn = null) => {
        setPaginaActiva(pagina);
        if (extraFn) extraFn();
        setSidebarOpen(false);
      };

      const handleAddWidget = async (nuevoWidget) => {
        setWidgets([...widgets, nuevoWidget]);
        showToast("Registrando acceso rápido...", "info");

        const effectiveUrl = getEffectiveApiUrl(apiUrl);
        if (!effectiveUrl || apiError) {
          showToast("Widget de área añadido localmente", "success");
          return;
        }

        setSyncing(true);
        try {
          await fetch(effectiveUrl, {
            method: "POST", mode: "cors", redirect: "follow",
            headers: { "Content-Type": "text/plain; charset=utf-8" },
            body: JSON.stringify({
              marca: "Config_Marcas",
              idTarea: nuevoWidget.id,
              info: nuevoWidget.titulo,
              detalles: nuevoWidget.link,
              categoria: nuevoWidget.icon,
              personas: nuevoWidget.color,
              campo: "todo"
            })
          });
          showToast("Acceso rápido sincronizado", "success");
          fetchData(true);
        } catch (e) {
          showToast("Error al guardar widget online", "error");
        } finally {
          setSyncing(false);
        }
      };

      const handleDeleteWidget = async (id, titulo) => {
        setWidgets(prev => prev.filter(w => w.id !== id));
        showToast("Borrando acceso rápido...", "info");

        const effectiveUrl = getEffectiveApiUrl(apiUrl);
        if (!effectiveUrl || apiError) {
          showToast("Widget eliminado localmente", "info");
          return;
        }

        setSyncing(true);
        try {
          await fetch(effectiveUrl, {
            method: "POST", mode: "cors", redirect: "follow",
            headers: { "Content-Type": "text/plain; charset=utf-8" },
            body: JSON.stringify({
              marca: "Config_Marcas",
              idTarea: id,
              info: titulo,
              campo: "eliminar"
            })
          });
          showToast("Widget eliminado correctamente", "success");
          fetchData(true);
        } catch (e) {
          showToast("Error al eliminar widget online", "error");
        } finally {
          setSyncing(false);
        }
      };

      const handleSaveNombreCompleto = (e) => {
        e.preventDefault();
        localStorage.setItem("robin_nombre_completo", nombreCompleto);
        showToast("Nombre completo configurado", "success");
      };

      const handleThemeChange = (newTheme) => {
        setTheme(newTheme);
        localStorage.setItem("robin_theme", newTheme);
        showToast(`Estilo cambiado`, "success");
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const userClean = e.target.username.value.trim().toLowerCase();
        if (!listaUsuarios.includes(userClean)) {
          setLoginError("Usuario no autorizado.");

        localStorage.setItem("robin_usuario_actual", userClean);

      const handleLogout = () => {

          localStorage.removeItem("robin_nombre_completo");
          localStorage.clear(); 
        } catch (e) {

        setNombreCompleto("");
        setClaveInput("");
        setPaginaActiva("home");

      const handleAddUser = (e) => {

        const nuevo = nuevoUsuarioInput.trim().toLowerCase();

        registrarNuevaPersonaGlobal("@" + nuevo);

        setNuevoUsuarioInput("");
        showToast("Usuario @nuevo autorizado", "success");
      };

      const generarIdDeterminista = (t) => {
        const contentSeed = `${t.marca || "GEN"}-${t.info || ""}-${t.deadline || ""}`;
        let hash = 0;
        for (let i = 0; i < contentSeed.length; i++) {
          hash = ((hash << 5) - hash) + contentSeed.charCodeAt(i);
          hash |= 0;
        }
        const prefix = String(t.marca || "TSK").substring(0, 3).toUpperCase().replace(/[^A-Z]/g, "X");
        return `STB-${prefix}-${Math.abs(hash) % 100000}`;
      };

      const fetchData = async (isBackground = false) => {
        if (!isBackground) setLoading(true);
        setSyncing(true);
        setApiError(null);
        
        const effectiveUrl = getEffectiveApiUrl(apiUrl);
        if (!effectiveUrl) {
          setTareas([]); 
          if (!isBackground) showToast("Base de datos no configurada", "info");
          setLoading(false);
          setSyncing(false);
          return;
        }

        try {
          const res = await fetch(effectiveUrl, { 
            method: "GET", mode: "cors", redirect: "follow"
          });
          const json = await res.json();
          if (json.success && json.data) {
            
            if (json.widgets) {
              setWidgets(json.widgets);
            }

            const tareasValidas = json.data.filter(t => {
              if (!t.info || t.info.toString().trim() === "") return false;
              if (!t.marca || t.marca.toString().trim() === "") return false;
              
              const cleanM = t.marca.toString().trim().toLowerCase();
              if (cleanM === "pendiente" || cleanM.includes("progreso") || cleanM.includes("seguimiento") || cleanM.includes("revision") || cleanM.includes("pausa") || cleanM.includes("completada") || cleanM === "config_marcas") {
                return false;
              }
              return true;
            });
            
            const deduplicadas = [];
            const seenKeys = new Set();

            tareasValidas.forEach(t => {
              const cleanId = t.idTarea ? String(t.idTarea).trim() : "";
              const hasRealId = isValidIdTarea(cleanId);
              
              const realId = hasRealId ? cleanId : generarIdDeterminista(t);
              const key = `${t.marca || ""}|${t.info || ""}|${t.deadline || ""}`.toLowerCase().replace(/\s+/g, " ").trim();
                
              if (!seenKeys.has(key)) {
                seenKeys.add(key);
                deduplicadas.push({
                  ...t,
                  idTarea: realId,
                  prioridad: t.prioridad || "🟡 Media"
                });
              }
            });

            setTareas(deduplicadas);
            
            if (json.marcasMetadata) {
              setMarcasMetadata(json.marcasMetadata);
            }
            if (!isBackground) {
              showToast("Sincronizado", "success");
            }

          } else {
            throw new Error(json.error || "No se recibieron datos.");
          }

          console.error("Error cargando Google Sheets: ", e);
          setApiError("Error de Conexión.");
          setTareas([]); 
          if (!isBackground) showToast("Error de conexión", "error");
        } finally {
          setLoading(false);
          setSyncing(false);
        }
      };

      const handleUpdateField = async (tarea, campo, nuevoValor) => {
        if (!nuevoValor && nuevoValor !== "") return;
        if (isSubmitting || syncing) return;

        const taskTargetId = tarea.idTarea || generateBrandId(tarea.marca);

        let detallesConHistorial = tarea.detalles || "";
        if (campo === "estado") {
          const hoy = new Date();
          const timestamp = `${hoy.getDate()}/${hoy.getMonth() + 1} ${hoy.getHours()}:${String(hoy.getMinutes()).padStart(2, '0')}`;
          const registro = `\n• [${timestamp}] Estado cambiado a "${nuevoValor}" por @${usuario}`;
          detallesConHistorial = detallesConHistorial + registro;
        }

        const temp = tareas.map(t => {
          if ((t.idTarea === tarea.idTarea && t.idTarea) || t.info === tarea.info) {
            return { 
              ...t, 
              idTarea: taskTargetId,
              [campo]: nuevoValor,
              detalles: campo === "estado" ? detallesConHistorial : t.detalles
            };
          }
          return t;
        });
        setTareas(temp);

        const effectiveUrl = getEffectiveApiUrl(apiUrl);
        if (!effectiveUrl || apiError) {
          showToast("Cambio guardado localmente", "success");
          return;
        }

        setSyncing(true);
        try {
          await fetch(effectiveUrl, {
            method: "POST", mode: "cors", redirect: "follow",
            headers: { "Content-Type": "text/plain; charset=utf-8" },
            body: JSON.stringify({

        const timestamp = `${hoy.getDate()}/${hoy.getMonth() + 1} ${hoy.getHours()}:${String(hoy.getMinutes()).padStart(2, '0')}`;

        const original = tareas[index];
        const cambios = [];
        if (original.info !== editedTask.info) cambios.push("título");
        if (original.categoria !== editedTask.categoria) cambios.push("categoría");
        if (original.personas !== editedTask.personas) cambios.push("asignados");
        if (original.estado !== editedTask.estado) cambios.push(`estado a "${editedTask.estado}"`);
        if (original.deadline !== editedTask.deadline) cambios.push("fecha límite");
        if (original.prioridad !== editedTask.prioridad) cambios.push("prioridad");

        if (cambios.length > 0) {
          detallesAudoria += `\n• [${timestamp}] Editado (${cambios.join(", ")}) por @${usuario}`;
        }

        const taskConHistorial = { ...editedTask, detalles: detallesAudoria };
        const copiaTareas = [...tareas];
        copiaTareas[index] = taskConHistorial;
        setTareas(copiaTareas);
        setIsEditing(false);
        setActiveTask(null);

          setIsSubmitting(false);
          return;

          const tDeadline = obtenerTiempoFecha(t.deadline);
          
          if (filtroTiempo === "HOY") {
            const tieneFechaReal = tDeadline !== Infinity;
            const esHoy = tieneFechaReal && tDeadline === tHoy;
            const esCompletada = cleanEstado(t.estado) === "completada";
            if (!esHoy || esCompletada) return false;
          } else if (filtroTiempo === "ATRASADAS") {
            const tieneFechaReal = tDeadline !== Infinity;
            const esAtrasada = tieneFechaReal && tDeadline < tHoy;
            const esCompletada = cleanEstado(t.estado) === "completada";
            if (!esAtrasada || esCompletada) return false;
          } else if (filtroTiempo === "FUTURAS") {
            const esFutura = tDeadline !== Infinity && tDeadline > tHoy;
            if (!esFutura) return false;
          }

          if (filtroMarca !== "TODAS" && (t.marca || "").toUpperCase() !== filtroMarca.toUpperCase()) return false;
          if (filtroEstado !== "TODOS" && cleanEstado(t.estado) !== cleanEstado(filtroEstado)) return false;
          if (filtroPrioridad !== "TODAS" && cleanPrioridad(t.prioridad) !== cleanPrioridad(filtroPrioridad)) return false;

          if (searchQuery.trim() !== "") {
            const q = searchQuery.toLowerCase();
            return (
              (t.info || "").toLowerCase().includes(q) ||
              (t.detalles && (t.detalles || "").toLowerCase().includes(q)) ||
              (t.personas && (t.personas || "").toLowerCase().includes(q)) ||
              (t.categoria && (t.categoria || "").toLowerCase().includes(q))

          }

          return true;
        });

          const tDeadline = obtenerTiempoFecha(t.deadline);
          return tDeadline !== Infinity && tDeadline === tHoy && cleanEstado(t.estado) !== "completada";
        }).length;

          const tDeadline = obtenerTiempoFecha(t.deadline);
          return tDeadline !== Infinity && tDeadline < tHoy && cleanEstado(t.estado) !== "completada";

          const tDeadline = obtenerTiempoFecha(t.deadline);

          {taskToDelete && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
              <div className="bg-white p-6 rounded-2xl border border-zinc-200 shadow-2xl w-full max-w-sm animate-zoom-in flex flex-col gap-4">
                <h4 className="text-sm font-black text-zinc-900 uppercase tracking-wider border-b pb-3">🚨 Confirmar Eliminación</h4>
                <p className="text-xs text-zinc-500 font-semibold leading-relaxed">
                  ¿Estás seguro de que deseas eliminar este entregable permanentemente del sistema?
                </p>
                <div className="p-3 bg-zinc-50 border rounded-xl font-mono text-[11px] text-zinc-500 truncate">
                  {taskToDelete.info}
                </div>
                <div className="flex gap-2 justify-end mt-2">
                  <button 
                    onClick={() => setTaskToDelete(null)}
                    className="px-4 py-2 text-xs font-bold text-zinc-500 hover:text-zinc-800"
                  >
                    Cancelar
                  </button>
                  <button 
                    onClick={() => handleDeleteTask(taskToDelete)}
                    disabled={isSubmitting}
                    className="px-4 py-2 bg-red-600 hover:bg-red-500 text-white text-xs font-bold rounded-xl"
                  >
                    Eliminar
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Renderizar la Aplicación
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
