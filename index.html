                    Calendario
                  </button>
                </div>
              )}

              {/* CONTROLES DE SINCRONIZACIÓN AUTOMÁTICA EN SEGUNDO PLANO */}
              <div className="flex items-center gap-3">
                
                {/* Indicador de Estado de Sincronización Estilo Notion */}
                <div className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-white border border-zinc-150 shadow-sm transition-all">
                  {syncing ? (
                    <>
                      <i className="fa-solid fa-cloud-arrow-up text-blue-500 animate-spin text-[11px]"></i>
                      <span className="text-zinc-500 text-[10px] font-black uppercase tracking-wider">Guardando...</span>
                    </>
                  ) : apiError ? (
                    <>
                      <i className="fa-solid fa-cloud-arrow-down text-amber-500 text-[11px]"></i>
                      <span className="text-zinc-500 text-[10px] font-black uppercase tracking-wider">Modo Local</span>
                    </>
                  ) : (
                    <>
                      <i className="fa-solid fa-cloud text-emerald-500 text-[11px]"></i>
                      <span className="text-zinc-400 text-[10px] font-black uppercase tracking-wider">Sincronizado</span>
                    </>
                  )}
                </div>

                <button 
                  onClick={() => fetchData(false)}
                  disabled={loading}
                  className="p-2 text-zinc-500 hover:text-zinc-900 bg-white hover:bg-zinc-50 border rounded-xl shadow-sm transition-all"
                  title="Forzar refresco completo de la base de datos"
                >
                  <i className={`fa-solid fa-arrows-rotate ${loading ? 'animate-spin' : ''}`}></i>
                </button>
              </div>
            </header>

            <div className="flex-1 overflow-y-auto p-4 md:p-6">
              
              {/* VISTA HOME */}
              {paginaActiva === "home" && (
                <LayoutHome 
                  tareas={tareas} 
                  nombreUsuario={nombreCompleto} 
                  username={usuario} 
                  onSelectTask={(t) => { setActiveTask(t); setIsEditing(true); }}
                  onUpdateField={handleUpdateField}
                  widgets={widgets}
                  onAddWidget={handleAddWidget}
                  onDeleteWidget={handleDeleteWidget}
                  currentTheme={currentTheme}
                  getMarcaStyle={getMarcaStyle}
                />
              )}

              {/* VISTA CREAR ENTREGABLE */}
              {paginaActiva === "agregar" && (
                <div className="max-w-2xl mx-auto bg-white p-6 md:p-8 rounded-2xl border shadow-sm animate-slide-in">
                  <h2 className="text-base font-black uppercase tracking-wider border-b pb-3 text-zinc-900">Crear Entregable en Base de Datos</h2>
                  
                  <form onSubmit={handleCreateTask} className="flex flex-col gap-4 mt-6">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold text-zinc-455 uppercase tracking-wider mb-1">Marca / Pestaña Sheets</label>
                        <select 
                          value={nuevaTarea.marca} 
                          onChange={(e) => setNuevaTarea({...nuevaTarea, marca: e.target.value})}
                          className="w-full bg-zinc-50 border p-2.5 text-xs rounded-xl focus:outline-none bg-white font-black"
                        >
                          {marcasDisponibles.map(m => (
                            <option key={m} value={m}>{m}</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-zinc-455 uppercase tracking-wider mb-1">Categoría</label>
                        <input 
                          type="text" 
                          placeholder="Ej: Material POP, Redes Sociales, etc..." 
                          value={nuevaTarea.categoria} 
                          onChange={(e) => setNuevaTarea({...nuevaTarea, categoria: e.target.value})}
                          className="w-full bg-zinc-50 border p-2 text-xs rounded-xl focus:outline-none font-bold" 
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-zinc-455 uppercase tracking-wider mb-1">Título del entregable / Tarea clave</label>
                      <input 
                        type="text" 
                        required 
                        placeholder="Describe el entregable principal aquí..." 
                        value={nuevaTarea.info} 
                        onChange={(e) => setNuevaTarea({...nuevaTarea, info: e.target.value})}
                        className="w-full bg-zinc-50 border p-2 text-xs rounded-xl focus:outline-none font-bold text-zinc-800" 
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-zinc-455 uppercase tracking-wider mb-1">Asignar miembros de área</label>
                      <SelectorPersonasChips 
                        personasSeleccionadas={nuevaTarea.personas}
                        onChange={(val) => setNuevaTarea({...nuevaTarea, personas: val})}
                        listaGlobal={listaPersonas}
                        registrarNuevaPersona={registrarNuevaPersonaGlobal}
                      />
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold text-zinc-455 uppercase tracking-wider mb-1">Estado Inicial</label>
                        <select 
                          value={nuevaTarea.estado} 
                          onChange={(e) => setNuevaTarea({...nuevaTarea, estado: e.target.value})}
                          className="w-full bg-zinc-50 border p-2.5 text-xs rounded-xl focus:outline-none bg-white font-black"
                        >
                          {LISTA_ESTADOS_VALIDOS.map(opt => (
                            <option key={opt} value={opt}>{opt}</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-zinc-455 uppercase tracking-wider mb-1">Fecha de Entrega (Deadline)</label>
                        <input 
                          type="date" 
                          required
                          value={convertirFechaAInput(nuevaTarea.deadline)} 
                          onChange={(e) => setNuevaTarea({...nuevaTarea, deadline: e.target.value})}
                          className="w-full bg-zinc-50 border p-2.5 text-xs rounded-xl focus:outline-none font-bold" 
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-zinc-455 uppercase tracking-wider mb-1">Instrucciones y Especificaciones</label>
                      <textarea 
                        rows="3" 
                        placeholder="Añade descripciones del entregable..." 
                        value={nuevaTarea.detalles} 
                        onChange={(e) => setNuevaTarea({...nuevaTarea, detalles: e.target.value})}
                        className="w-full bg-zinc-50 border p-2 text-xs rounded-xl focus:outline-none resize-none font-medium text-zinc-700"
                      ></textarea>
                    </div>

                    <div className="flex justify-end gap-2 border-t pt-4 mt-2">
                      <button 
                        type="button" 
                        onClick={() => setPaginaActiva("dashboard")} 
                        className="px-5 py-2 bg-zinc-100 hover:bg-zinc-200 text-zinc-700 font-bold text-xs rounded-xl transition-all"
                      >
                        Cancelar
                      </button>
                      <button 
                        type="submit" 
                        className="px-5 py-2 bg-zinc-900 hover:bg-black text-white font-bold text-xs rounded-xl shadow-sm transition-all"
                      >
                        Registrar Entregable
                      </button>
                    </div>
                  </form>
                </div>
              )}

              {/* VISTA GENERAL DASHBOARD (DASHBOARD) */}
              {paginaActiva === "dashboard" && (
                <div className="flex flex-col gap-4">
                  
                  {/* Barra de Filtros interactiva */}
                  <div className={`p-4 rounded-xl border flex flex-wrap gap-4 items-center justify-between ${currentTheme.cardBg} ${currentTheme.border}`}>
                    <div className="flex flex-wrap gap-3 items-center">
                      <div className="flex flex-col gap-1">
                        <span className="text-[9px] font-black text-zinc-400 uppercase tracking-widest">Filtrar por Marca</span>
                        <select 
                          value={filtroMarca} 
                          onChange={(e) => setFiltroMarca(e.target.value)}
                          className="bg-zinc-50 border border-zinc-200 rounded-lg p-1.5 text-xs font-bold text-zinc-700 focus:outline-none bg-white min-w-[120px]"
                        >
                          <option value="TODAS">TODAS LAS MARCAS</option>
                          {marcasDisponibles.map(m => (
                            <option key={m} value={m}>{m.toUpperCase()}</option>
                          ))}
                        </select>
                      </div>

                      <div className="flex flex-col gap-1">
                        <span className="text-[9px] font-black text-zinc-400 uppercase tracking-widest">Filtrar por Estado</span>
                        <select 
                          value={filtroEstado} 
                          onChange={(e) => setFiltroEstado(e.target.value)}
                          className="bg-zinc-50 border border-zinc-200 rounded-lg p-1.5 text-xs font-bold text-zinc-700 focus:outline-none bg-white min-w-[120px]"
                        >
                          <option value="TODOS">TODOS LOS ESTADOS</option>
                          {LISTA_ESTADOS_VALIDOS.map(opt => (
                            <option key={opt} value={opt}>{opt.substring(opt.indexOf(" ") + 1).toUpperCase()}</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div className="flex items-center gap-2 bg-zinc-50 border border-zinc-200 px-3 py-1.5 rounded-xl w-full sm:max-w-xs">
                      <i className="fa-solid fa-magnifying-glass text-zinc-400 text-xs"></i>
                      <input 
                        type="text" 
                        placeholder="Buscar entregables..." 
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="bg-transparent border-0 focus:ring-0 focus:outline-none text-xs w-full p-0 font-semibold"
                      />
                    </div>
                  </div>

                  {/* Renderizado condicional según vistaModo */}
                  {vistaModo === "TABLE" && (
                    <LayoutTablaAgrupada 
                      tareas={tareasFiltradas} 
                      onUpdateField={handleUpdateField}
                      onSelectTask={(t) => { setActiveTask(t); setIsEditing(true); }}
                      onDeleteTask={(t) => setTaskToDelete(t)}
                      getMarcaStyle={getMarcaStyle}
                      filtroTiempo={filtroTiempo}
                      cleanIdTarea={cleanIdTarea}
                      currentTheme={currentTheme}
                    />
                  )}

                  {vistaModo === "KANBAN" && (
                    <LayoutKanban 
                      tareas={tareasFiltradas} 
                      onUpdateField={handleUpdateField}
                      onSelectTask={(t) => { setActiveTask(t); setIsEditing(true); }}
                      onDeleteTask={(t) => setTaskToDelete(t)}
                      getMarcaStyle={getMarcaStyle}
                      cleanIdTarea={cleanIdTarea}
                      currentTheme={currentTheme}
                    />
                  )}

                  {vistaModo === "CALENDAR" && (
                    <LayoutCalendario 
                      tareas={tareasParaCalendario} 
                      onUpdateField={handleUpdateField}
                      onSelectTask={(t) => { setActiveTask(t); setIsEditing(true); }}
                      currentTheme={currentTheme}
                    />
                  )}

                </div>
              )}

              {/* VISTA DIRECTORIO DE CLIENTES */}
              {paginaActiva === "clientes" && (
                <LayoutClientes 
                  marcasMetadata={marcasMetadata}
                  onSelectBrand={(brand) => {
                    setFiltroMarca(brand);
                    setFiltroTiempo("TODAS");
                    setPaginaActiva("dashboard");
                  }}
                  currentTheme={currentTheme}
                  adminMode={usuario === "admin"}
                  onSaveMetadata={handleSaveBrandMetadata}
                  onCreateBrand={handleCreateBrand}
                  marcasDisponibles={marcasDisponibles}
                />
              )}

              {/* VISTA CONFIGURACION */}
              {paginaActiva === "configuracion" && (
                <div className="max-w-2xl mx-auto flex flex-col gap-6 animate-slide-in pb-12">
                  <div className="bg-white p-6 rounded-2xl border shadow-sm">
                    <h3 className="text-base font-black uppercase tracking-wider border-b pb-3 text-zinc-900">Ajustes Visuales</h3>
                    
                    <div className="mt-6 flex flex-col gap-4">
                      <div>
                        <span className="block text-xs font-bold text-zinc-455 uppercase tracking-wider mb-2">Tema y Estilo de Interfaz</span>
                        <div className="grid grid-cols-2 md:grid-cols-5 gap-2">
                          {Object.keys(TEMAS).map(tKey => (
                            <button
                              key={tKey}
                              onClick={() => handleThemeChange(tKey)}
                              className={`p-2 rounded-xl text-xs font-extrabold capitalize border transition-all ${
                                theme === tKey ? 'bg-zinc-900 text-white border-zinc-900 shadow' : 'bg-zinc-50 hover:bg-zinc-100'
                              }`}
                            >
                              {tKey}
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="bg-white p-6 rounded-2xl border shadow-sm">
                    <h3 className="text-base font-black uppercase tracking-wider border-b pb-3 text-zinc-900">Datos del Perfil</h3>
                    
                    <form onSubmit={handleSaveNombreCompleto} className="mt-6 flex flex-col gap-4">
                      <div>
                        <label className="block text-xs font-bold text-zinc-455 uppercase tracking-wider mb-1">Nombre Completo del Colaborador</label>
                        <input 
                          type="text" 
                          placeholder="Ej: Miguel Bonilla" 
                          value={nombreCompleto} 
                          onChange={(e) => setNombreCompleto(e.target.value)}
                          className="w-full bg-zinc-50 border p-2 text-xs rounded-xl focus:outline-none font-bold text-zinc-800" 
                        />
                      </div>
                      <button type="submit" className="bg-zinc-900 text-white font-bold text-xs py-2 px-4 rounded-xl self-end hover:bg-black transition-all">
                        Actualizar Perfil
                      </button>
                    </form>
                  </div>

                  {usuario === "admin" && (
                    <div className="bg-white p-6 rounded-2xl border shadow-sm">
                      <h3 className="text-base font-black uppercase tracking-wider border-b pb-3 text-red-650">Administración de Usuarios</h3>
                      
                      <form onSubmit={handleAddUser} className="mt-6 flex flex-col gap-4">
                        <div className="flex gap-2">
                          <input 
                            type="text" 
                            required 
                            placeholder="Nombre de usuario nuevo (ej: rrodriguez)..." 
                            value={nuevoUsuarioInput} 
                            onChange={(e) => setNuevoUsuarioInput(e.target.value)}
                            className="flex-1 bg-zinc-50 border p-2 text-xs rounded-xl focus:outline-none font-bold" 
                          />
                          <button type="submit" className="bg-red-50 hover:bg-red-100 text-red-655 font-bold text-xs py-2 px-4 rounded-xl transition-all border border-red-200">
                            Autorizar
                          </button>
                        </div>

                        <div className="border-t pt-3">
                          <span className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider block mb-2">Miembros del área autorizados</span>
                          <div className="flex flex-wrap gap-1.5">
                            {listaUsuarios.map(u => (
                              <span key={u} className="bg-zinc-100 text-zinc-700 text-xs font-extrabold px-2.5 py-1 rounded-lg border border-zinc-200">
                                @{u}
                              </span>
                            ))}
                          </div>
                        </div>
                      </form>
                    </div>
                  )}
                </div>
              )}

            </div>
          </main>

          {/* RENDERS COMPONENTES FLOTANTES */}
          {isEditing && activeTask && (
            <ModalEdicionTarea 
              task={activeTask}
              onClose={() => { setIsEditing(false); setActiveTask(null); }}
              onSave={handleSaveTaskModal}
              onDeleteClick={(t) => setTaskToDelete(t)}
              marcasDisponibles={marcasDisponibles}
              listaPersonas={listaPersonas}
              registrarNuevaPersona={registrarNuevaPersonaGlobal}
              cleanIdTarea={cleanIdTarea}
            />
          )}

          {/* MODAL ELIMINAR TAREA */}
          {taskToDelete && (
            <div className="fixed inset-0 bg-zinc-950/20 backdrop-blur-[2px] z-[150] flex items-center justify-center p-4">
              <div className="bg-white max-sm:w-full max-w-sm w-full p-6 rounded-2xl border border-zinc-200 shadow-2xl animate-zoom-in text-zinc-800 flex flex-col gap-4 text-center">
                <div className="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-lg mx-auto">
                  <i className="fa-solid fa-triangle-exclamation"></i>
                </div>
                <div>
                  <h3 className="font-extrabold text-sm text-zinc-900">¿Eliminar entregable?</h3>
                  <p className="text-xs text-zinc-455 mt-1">Esta acción no se puede deshacer y borrará permanentemente la fila de la pestaña de la marca en Google Sheets.</p>
                </div>
                <div className="flex gap-2">
                  <button 
                    type="button" 
                    onClick={() => setTaskToDelete(null)} 
                    className="flex-1 py-2 bg-zinc-100 hover:bg-zinc-200 text-zinc-700 font-bold text-xs rounded-xl"
                  >
                    Cerrar
                  </button>
                  <button 
                    type="button" 
                    onClick={() => handleDeleteTask(taskToDelete)}
                    className="flex-1 py-2 bg-red-650 hover:bg-red-700 text-white font-bold text-xs rounded-xl"
                  >
                    Eliminar
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
