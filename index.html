<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROBIN - Trade & Shopper</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #FAFAFA;
      color: #09090B;
      letter-spacing: -0.015em;
    }
    /* Scrollbars ultra finas estilo minimalista */
    ::-webkit-scrollbar {
      width: 3px;
      height: 3px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #E4E4E7;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #D4D4D8;
    }
  </style>
</head>
<body class="overflow-hidden">

  <div id="root" class="h-screen w-screen overflow-hidden"></div>

  <!-- Aplicación React -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // =========================================================================
    // ⚙️ URL API DE GOOGLE SHEETS
    // =========================================================================
    const AUTO_API_URL = "https://script.google.com/macros/s/AKfycbzv0CdwmXDTn0AoaoWguLs12Wuo_4mO1BPMZAFZN5IkxQHvlQeArr2X-nvjVN40QnbLLQ/exec"; 
    // =========================================================================

    // Función de utilidad para limpiar automáticamente redirecciones corporativas que causan fallas CORS
    const getEffectiveApiUrl = (url) => {
      if (!url) return "";
      let clean = url.trim();
      if (clean.includes("/a/macros/")) {
        clean = clean.replace(/\/a\/macros\/[^\/]+\/s\//, "/macros/s/");
      }
      return clean;
    };

    // Paleta monocromática sutil y elegante
    const MARCAS_COLORES = {
      "DIAGEO":      { bg: "bg-zinc-100", text: "text-zinc-800", border: "border-zinc-200" },
      "GAMA":        { bg: "bg-zinc-100", text: "text-zinc-800", border: "border-zinc-200" },
      "LA SANTE":    { bg: "bg-zinc-100", text: "text-zinc-800", border: "border-zinc-200" },
      "LA SANTE ":   { bg: "bg-zinc-100", text: "text-zinc-800", border: "border-zinc-200" },
      "ROBIN":       { bg: "bg-zinc-900", text: "text-white", border: "border-zinc-850" },
      "TMK":         { bg: "bg-zinc-100", text: "text-zinc-800", border: "border-zinc-200" }
    };

    const ESTADOS_MAPA = [
      { id: "⚪ Pendiente", label: "Pendiente", color: "bg-zinc-50 text-zinc-500 border-zinc-200", dot: "bg-zinc-300" },
      { id: "🔵 En progreso", label: "Progreso", color: "bg-zinc-100 text-zinc-800 border-zinc-300", dot: "bg-blue-500" },
      { id: "🟡 Seguimiento", label: "Seguimiento", color: "bg-zinc-100 text-zinc-800 border-zinc-300", dot: "bg-purple-500" },
      { id: "🟠 En revisión", label: "Revisión", color: "bg-orange-50 text-orange-700 border-orange-200", dot: "bg-orange-500" }, 
      { id: "🔴 En pausa", label: "Pausa", color: "bg-rose-50 text-rose-700 border-rose-200", dot: "bg-red-500" }, 
      { id: "🟢 Completada", label: "Completada", color: "bg-emerald-50 text-emerald-700 border-emerald-200", dot: "bg-emerald-500" }
    ];

    const LISTA_ESTADOS_VALIDOS = [
      "⚪ Pendiente", 
      "🔵 En progreso", 
      "🟡 Seguimiento", 
      "🟠 En revisión", 
      "🔴 En pausa", 
      "🟢 Completada"
    ];

    const TAREAS_DEMO = [
      { idTarea: "SAN-101", marca: "La Santé", categoria: "Reunión", fecha: "2026-06-11", info: "Finiquitar canal de difusión", personas: "@Miguel Bonilla", detalles: "Definir si se usará Whatsapp o Telegram.", estado: "🟠 En revisión", deadline: "2026-06-11" },
      { idTarea: "SAN-102", marca: "La Santé", categoria: "Arte, Proyecto", fecha: "2026-06-11", info: "Mesas de comedor La Santé", personas: "@Miguel Bonilla", detalles: "A la espera de solicitud por Dayccel.", estado: "🔴 En pausa", deadline: "" }
    ];

    function App() {
      const [tareas, setTareas] = useState([]);
      const [loading, setLoading] = useState(false);
      const [syncing, setSyncing] = useState(false);
      const [toast, setToast] = useState(null);
      const [apiError, setApiError] = useState(null);
      
      const [filtroTiempo, setFiltroTiempo] = useState("HOY"); 
      const [filtroMarca, setFiltroMarca] = useState("TODAS");
      const [filtroEstado, setFiltroEstado] = useState("TODOS");
      const [searchQuery, setSearchQuery] = useState("");
      
      const [paginaActiva, setPaginaActiva] = useState("dashboard"); 
      const [vistaModo, setVistaModo] = useState("TABLE"); 

      const [activeTask, setActiveTask] = useState(null);
      const [isEditing, setIsEditing] = useState(false);

      const [listaPersonas, setListaPersonas] = useState(() => {
        const guardadas = localStorage.getItem("robin_personas");
        return guardadas ? JSON.parse(guardadas) : ["@Miguel Bonilla", "@Ricardo", "@Daniela", "@Génesis", "@Andrés", "@María", "@Pedro"];
      });

      const [nuevaTarea, setNuevaTarea] = useState({
        marca: "La Santé",
        categoria: "",
        info: "",
        personas: "",
        detalles: "",
        estado: "⚪ Pendiente",
        deadline: ""
      });

      useEffect(() => {
        fetchData();
      }, []);

      useEffect(() => {
        if (tareas.length > 0) {
          const detectadas = new Set();
          tareas.forEach(t => {
            if (t.personas) {
              const nombres = t.personas.split(/[\s,]+/);
              nombres.forEach(n => {
                const limpio = n.trim();
                if (limpio.length > 1) {
                  const conArroba = limpio.startsWith("@") ? limpio : "@" + limpio;
                  detectadas.add(conArroba);
                }
              });
            }
          });
          if (detectadas.size > 0) {
            const combinadas = Array.from(new Set([...listaPersonas, ...detectadas]));
            localStorage.setItem("robin_personas", JSON.stringify(combinadas));
            setListaPersonas(combinadas);
          }
        }
      }, [tareas]);

      const showToast = (msg, type = "success") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      };

      const fetchData = async () => {
        setLoading(true);
        setApiError(null);
        
        const effectiveUrl = getEffectiveApiUrl(AUTO_API_URL);
        if (!effectiveUrl || effectiveUrl.includes("your_actual_url_here")) {
          setTareas(TAREAS_DEMO);
          showToast("Modo Demo Activo", "info");
          setLoading(false);
          return;
        }

        try {
          const res = await fetch(effectiveUrl, { 
            method: "GET",
            mode: "cors",
            redirect: "follow"
          });
          const json = await res.json();
          if (json.success) {
            // EXTREMADAMENTE IMPORTANTE: Filtrar filas que estén vacías (evita registros fantasmas en Sheets)
            const tareasValidas = json.data.filter(t => t.info && t.info.toString().trim() !== "");
            setTareas(tareasValidas);
            showToast("Sincronizado con Sheets", "success");
          } else {
            throw new Error(json.error || "No se recibieron datos válidos.");
          }
        } catch (e) {
          console.error("Error cargando Google Sheets: ", e);
          setApiError("Error de Conexión. Asegúrate de volver a publicar tu Apps Script con acceso a 'Cualquiera' (Anyone) y copiar el ID de enlace correcto.");
          setTareas(TAREAS_DEMO); 
          showToast("Utilizando datos locales de respaldo", "info");
        } finally {
          setLoading(false);
        }
      };

      const handleUpdateField = async (tarea, campo, nuevoValor) => {
        if (!nuevoValor && nuevoValor !== "") return;

        // Generar registro histórico automático si el campo modificado es el estado
        let detallesConHistorial = tarea.detalles || "";
        if (campo === "estado" && nuevoValor !== tarea.estado) {
          const hoy = new Date();
          const fechaStr = `${hoy.getDate()}/${hoy.getMonth() + 1}`;
          const estadoLimpio = nuevoValor.includes(" ") ? nuevoValor.substring(nuevoValor.indexOf(" ") + 1) : nuevoValor;
          const actualizacion = `• ${fechaStr}: Estado cambiado a ${estadoLimpio}`;
          detallesConHistorial = detallesConHistorial ? `${detallesConHistorial}\n${actualizacion}` : actualizacion;
        }

        // Actualizar el estado local en React
        const temp = tareas.map(t => {
          if (t.idTarea === tarea.idTarea && t.info === tarea.info) {
            if (campo === "estado") {
              return { ...t, estado: nuevoValor, detalles: detallesConHistorial };
            }
            return { ...t, [campo]: nuevoValor };
          }
          return t;
        });
        setTareas(temp);

        const effectiveUrl = getEffectiveApiUrl(AUTO_API_URL);
        if (!effectiveUrl || effectiveUrl.includes("your_actual_url_here") || apiError) {
          showToast("Cambio guardado localmente", "success");
          return;
        }

        const taskTargetId = tarea.idTarea || "";

        setSyncing(true);
        try {
          // POST a Google Sheets con la estructura corregida y llaves cerradas
          const res = await fetch(effectiveUrl, {
            method: "POST",
            mode: "cors",
            redirect: "follow",
            headers: {
              "Content-Type": "text/plain; charset=utf-8"
            },
            body: JSON.stringify({
              marca: tarea.marca,
              idTarea: taskTargetId,
              info: tarea.info,
              categoria: tarea.categoria,
              campo: campo === "estado" ? "todo" : campo, 
              valor: nuevoValor,
              personas: tarea.personas,
              detalles: detallesConHistorial,
              estado: campo === "estado" ? nuevoValor : tarea.estado
            }) // ¡Llave rizada añadida correctamente antes de cerrar el paréntesis!
          });
          const json = await res.json();
          if (json.success) {
            showToast("Guardado en Google Sheets", "success");
          } else {
            showToast("Fallo al sincronizar", "error");
            fetchData();
          }
        } catch (e) {
          console.error("Error al actualizar campo: ", e);
          showToast("Guardado local (Falla de red)", "error");
        } finally {
          setSyncing(false);
        }
      };

      const handleSaveTaskModal = async (editedTask) => {
        const index = tareas.findIndex(t => t.idTarea === editedTask.idTarea && t.info === editedTask.info);
        if (index === -1) return;

        const copiaTareas = [...tareas];
        copiaTareas[index] = editedTask;
        setTareas(copiaTareas);
        setIsEditing(false);
        setActiveTask(null);

        const effectiveUrl = getEffectiveApiUrl(AUTO_API_URL);
        if (!effectiveUrl || effectiveUrl.includes("your_actual_url_here") || apiError) {
          showToast("Guardado localmente", "success");
          return;
        }

        setSyncing(true);
        try {
          const res = await fetch(effectiveUrl, {
            method: "POST",
            mode: "cors",
            redirect: "follow",
            headers: {
              "Content-Type": "text/plain; charset=utf-8"
            },
            body: JSON.stringify({
              marca: editedTask.marca,
              idTarea: editedTask.idTarea,
              info: editedTask.info,
              categoria: editedTask.categoria,
              personas: editedTask.personas,
              detalles: editedTask.detalles,
              estado: editedTask.estado,
              deadline: editedTask.deadline,
              campo: "todo"
            })
          });
          const json = await res.json();
          if (json.success) {
            showToast("Sincronizado completamente", "success");
            fetchData();
          } else {
            showToast("Error al procesar servidor", "error");
            fetchData();
          }
        } catch (e) {
          console.error("Error en guardado completo modal: ", e);
          showToast("Guardado temporalmente local", "error");
        } finally {
          setSyncing(false);
        }
      };

      const handleCreateTask = async (e) => {
        e.preventDefault();
        if (!nuevaTarea.info.trim()) {
          showToast("Describe la tarea primero", "error");
          return;
        }

        const nuevaConId = {
          ...nuevaTarea,
          idTarea: `NUEVO-${Math.floor(100 + Math.random() * 900)}`,
          fecha: new Date().toISOString().split('T')[0]
        };

        setTareas([nuevaConId, ...tareas]);
        showToast("Registrando en el servidor...", "info");

        const effectiveUrl = getEffectiveApiUrl(AUTO_API_URL);
        if (!effectiveUrl || effectiveUrl.includes("your_actual_url_here") || apiError) {
          setNuevaTarea({
            marca: "La Santé",
            categoria: "",
            info: "",
            personas: "",
            detalles: "",
            estado: "⚪ Pendiente",
            deadline: ""
          });
          setPaginaActiva("dashboard");
          showToast("Registrado localmente", "success");
          return;
        }

        setSyncing(true);
        try {
          const res = await fetch(effectiveUrl, {
            method: "POST",
            mode: "cors",
            redirect: "follow",
            headers: {
              "Content-Type": "text/plain; charset=utf-8"
            },
            body: JSON.stringify({
              marca: nuevaTarea.marca,
              idTarea: "", 
              info: nuevaTarea.info,
              categoria: nuevaTarea.categoria,
              personas: nuevaTarea.personas,
              detalles: nuevaTarea.detalles,
              estado: nuevaTarea.estado,
              deadline: nuevaTarea.deadline,
              campo: "todo"
            })
          });
          const json = await res.json();
          if (json.success) {
            showToast("Registrado con éxito", "success");
            fetchData();
            setNuevaTarea({
              marca: "La Santé",
              categoria: "",
              info: "",
              personas: "",
              detalles: "",
              estado: "⚪ Pendiente",
              deadline: ""
            });
            setPaginaActiva("dashboard");
          } else {
            showToast("Fallo al guardar en Sheets", "error");
          }
        } catch (e) {
          console.error("Error al registrar tarea: ", e);
          showToast("Guardado localmente (Sin conexión)", "error");
        } finally {
          setSyncing(false);
        }
      };

      const registrarNuevaPersonaGlobal = (nombreCompleto) => {
        const formateado = nombreCompleto.startsWith("@") ? nombreCompleto.trim() : "@" + nombreCompleto.trim();
        if (formateado.length > 1 && !listaPersonas.includes(formateado)) {
          const actualizadas = [...listaPersonas, formateado];
          setListaPersonas(actualizadas);
          localStorage.setItem("robin_personas", JSON.stringify(actualizadas));
        }
      };

      const marcasDisponibles = useMemo(() => {
        const marcasUnicas = new Set(tareas.map(t => t.marca).filter(Boolean));
        const defaults = ["La Santé", "DIAGEO", "GAMA", "ROBIN", "TMK"];
        return Array.from(new Set([...defaults, ...marcasUnicas]));
      }, [tareas]);

      const tareasFiltradas = useMemo(() => {
        const hoy = new Date();
        const tHoy = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()).getTime();
        
        return tareas.filter(t => {
          const tDeadline = obtenerTiempoFecha(t.deadline);
          
          if (filtroTiempo === "HOY") {
            const tieneFechaReal = tDeadline !== Infinity;
            const esHoyOAtrasado = tieneFechaReal && tDeadline <= tHoy;
            const esCompletada = cleanEstado(t.estado) === "completada";
            if (!esHoyOAtrasado || esCompletada) return false;
          } else if (filtroTiempo === "FUTURAS") {
            const esFutura = tDeadline !== Infinity && tDeadline > tHoy;
            if (!esFutura) return false;
          }

          if (filtroMarca !== "TODAS" && t.marca.toUpperCase() !== filtroMarca.toUpperCase()) return false;
          if (filtroEstado !== "TODOS" && cleanEstado(t.estado) !== cleanEstado(filtroEstado)) return false;

          if (searchQuery.trim() !== "") {
            const q = searchQuery.toLowerCase();
            return (
              t.info.toLowerCase().includes(q) ||
              (t.detalles && t.detalles.toLowerCase().includes(q)) ||
              (t.personas && t.personas.toLowerCase().includes(q)) ||
              (t.categoria && t.categoria.toLowerCase().includes(q))
            );
          }

          return true;
        });
      }, [tareas, filtroTiempo, filtroMarca, filtroEstado, searchQuery]);

      const metricaCounters = useMemo(() => {
        const hoy = new Date();
        const tHoy = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()).getTime();

        const activasHoy = tareas.filter(t => {
          const tDeadline = obtenerTiempoFecha(t.deadline);
          return tDeadline !== Infinity && tDeadline <= tHoy && cleanEstado(t.estado) !== "completada";
        }).length;
        
        const futuras = tareas.filter(t => {
          const tDeadline = obtenerTiempoFecha(t.deadline);
          return tDeadline !== Infinity && tDeadline > tHoy;
        }).length;
        
        const completadasHoy = tareas.filter(t => cleanEstado(t.estado) === "completada").length;

        return { activasHoy, futuras, completadasHoy };
      }, [tareas]);

      const getMarcaStyle = (marcaName) => {
        if (!marcaName) return { bg: "bg-zinc-100", text: "text-zinc-600", border: "border-zinc-200" };
        const clean = marcaName.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
        return MARCAS_COLORES[clean] || { bg: "bg-zinc-100/60", text: "text-zinc-500", border: "border-zinc-200/50" };
      };

      return (
        <div className="flex h-screen w-screen overflow-hidden bg-white text-zinc-900 select-none">
          
          {toast && (
            <div className="fixed bottom-6 right-6 z-[100] px-4 py-3 rounded-lg shadow-xl text-xs font-bold flex items-center gap-2 border bg-zinc-900 text-white border-zinc-800 animate-zoom-in">
              <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
              <span>{toast.msg}</span>
            </div>
          )}

          {/* SIDEBAR ULTRA MINIMALISTA */}
          <aside className="w-52 bg-white border-r border-zinc-100 flex flex-col justify-between shrink-0">
            <div>
              <div className="p-5 border-b border-zinc-100/85">
                <div className="flex items-center gap-2.5">
                  <div className="w-6 h-6 rounded-full bg-zinc-900 text-white flex items-center justify-center text-[10px] font-black tracking-tighter shrink-0">
                    R
                  </div>
                  <div className="flex flex-col">
                    <span className="text-[12px] font-black tracking-[0.12em] text-zinc-950 leading-none">ROBIN</span>
                    <span className="text-[7.5px] font-bold tracking-[0.08em] text-zinc-400 uppercase mt-0.5">Trade & Shopper</span>
                  </div>
                </div>
              </div>

              <div className="px-3 pt-3">
                <button 
                  onClick={() => setPaginaActiva("agregar")}
                  className="w-full bg-zinc-900 hover:bg-zinc-800 text-white font-medium py-1.5 px-3 rounded-md text-[10px] transition-all flex items-center justify-center gap-1"
                >
                  <i className="fa-solid fa-plus text-[8px]"></i>
                  <span>Añadir Entregable</span>
                </button>
              </div>

              <nav className="p-2 flex flex-col gap-0.5">
                <span className="px-2 text-[8px] font-bold text-zinc-400 tracking-wider uppercase mb-1">Filtro de Tiempo</span>
                
                <button
                  onClick={() => { setPaginaActiva("dashboard"); setFiltroTiempo("HOY"); }}
                  className={`flex items-center justify-between w-full px-2 py-1.5 rounded-md text-[11px] font-semibold transition-all ${
                    paginaActiva === "dashboard" && filtroTiempo === "HOY" 
                      ? "bg-zinc-50 text-zinc-950 font-bold" 
                      : "text-zinc-500 hover:bg-zinc-50/50 hover:text-zinc-850"
                  }`}
                >
                  <span>Hoy</span>
                  <span className="text-[9px] text-zinc-450 font-bold">{metricaCounters.activasHoy}</span>
                </button>

                <button
                  onClick={() => { setPaginaActiva("dashboard"); setFiltroTiempo("FUTURAS"); }}
                  className={`flex items-center justify-between w-full px-2 py-1.5 rounded-md text-[11px] font-semibold transition-all ${
                    paginaActiva === "dashboard" && filtroTiempo === "FUTURAS" 
                      ? "bg-zinc-50 text-zinc-950 font-bold" 
                      : "text-zinc-500 hover:bg-zinc-50/50 hover:text-zinc-850"
                  }`}
                >
                  <span>Futuras</span>
                  <span className="text-[9px] text-zinc-450 font-bold">{metricaCounters.futuras}</span>
                </button>

                <button
                  onClick={() => { setPaginaActiva("dashboard"); setFiltroTiempo("TODAS"); }}
                  className={`flex items-center justify-between w-full px-2 py-1.5 rounded-md text-[11px] font-semibold transition-all ${
                    paginaActiva === "dashboard" && filtroTiempo === "TODAS" 
                      ? "bg-zinc-50 text-zinc-950 font-bold" 
                      : "text-zinc-500 hover:bg-zinc-50/50 hover:text-zinc-850"
                  }`}
                >
                  <span>Todas</span>
                  <span className="text-[9px] text-zinc-450 font-bold">{tareas.length}</span>
                </button>
              </nav>

              <div className="p-2 border-t border-zinc-100 mt-1">
                <span className="px-2 text-[8px] font-bold text-zinc-400 tracking-wider uppercase">Marcas</span>
                <div className="flex flex-col gap-0.5 mt-1">
                  <button
                    onClick={() => { setPaginaActiva("dashboard"); setFiltroMarca("TODAS"); }}
                    className={`flex items-center gap-1.5 w-full px-2 py-1 rounded-md text-[11px] transition-all ${
                      filtroMarca === "TODAS" 
                        ? "bg-zinc-50 text-zinc-950 font-bold" 
                        : "text-zinc-500 hover:bg-zinc-50/55 hover:text-zinc-800"
                    }`}
                  >
                    <span className="w-1.5 h-1.5 rounded-full bg-zinc-400"></span>
                    <span>Todas</span>
                  </button>
                  {marcasDisponibles.map(m => {
                    const clean = m ? m.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim() : "";
                    return (
                      <button
                        key={m}
                        onClick={() => { setPaginaActiva("dashboard"); setFiltroMarca(m); }}
                        className={`flex items-center gap-1.5 w-full px-2 py-1 rounded-md text-[11px] transition-all ${
                          filtroMarca === m 
                            ? "bg-zinc-50 text-zinc-950 font-bold" 
                            : "text-zinc-500 hover:bg-zinc-50/55 hover:text-zinc-800"
                        }`}
                      >
                        <span className={`w-1.5 h-1.5 rounded-full ${
                          clean === "LA SANTE" || clean === "LA SANTE " ? "bg-emerald-400" :
                          clean === "DIAGEO" ? "bg-slate-400" :
                          clean === "GAMA" ? "bg-red-400" :
                          clean === "ROBIN" ? "bg-zinc-850" :
                          clean === "TMK" ? "bg-amber-400" : "bg-zinc-300"
                        }`}></span>
                        <span>{m}</span>
                      </button>
                    );
                  })}

                    <p className="font-extrabold text-[11px] uppercase tracking-wider text-amber-800">Conexión de respaldo activa (CORS / Failed to fetch)</p>

                      La petición ha fallado. Revisa que tu base de datos de Sheets tenga las columnas correctas. Hemos limpiado tu URL para mayor compatibilidad: <code className="bg-amber-100 px-1 py-0.5 rounded font-mono break-all">{getEffectiveApiUrl(AUTO_API_URL)}</code>.

                    <div className="flex items-center gap-2">
                      <div className="flex items-center gap-1 text-[11px] text-zinc-450 font-semibold">

                        <select

                          {ESTADOS_MAPA.map(e => (

                      <div className="bg-zinc-100 p-0.5 rounded-md flex border border-zinc-200/50">
                        <button 
                          onClick={() => setVistaModo("TABLE")}
                          className={`px-2 py-0.5 rounded text-[10px] font-semibold transition-all ${
                            vistaModo === "TABLE" ? "bg-white text-zinc-950 font-bold" : "text-zinc-455 hover:text-zinc-800"
                          }`}
                        >
                          Listado
                        </button>
                        <button 
                          onClick={() => setVistaModo("KANBAN")}
                          className={`px-2 py-0.5 rounded text-[10px] font-semibold transition-all ${
                            vistaModo === "KANBAN" ? "bg-white text-zinc-950 font-bold" : "text-zinc-455 hover:text-zinc-800"
                          }`}

                        </button>
                        <button

                          placeholder="Buscar..."

                          onChange={(e) => setSearchQuery(e.target.value)}

                            onUpdateField={handleUpdateField}
                            onSelectTask={(t) => { setActiveTask(t); setIsEditing(true); }}

                            onUpdateField={handleUpdateField}
                            onSelectTask={(t) => { setActiveTask(t); setIsEditing(true); }}

                /* AGREGAR NUEVA TAREA */

                  <div className="bg-white rounded-xl border border-zinc-200 p-5 mt-4 animate-zoom-in">

                      <div>

                          onChange={(e) => setNuevaTarea({ ...nuevaTarea, marca: e.target.value })}

                      <div>

                      </div>

                      <div>
                        <label className="block text-[8px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Título / Entregable</label>

                          type="text"

                          placeholder="Acción a realizar" 
                          value={nuevaTarea.info} 
                          onChange={(e) => setNuevaTarea({ ...nuevaTarea, info: e.target.value })}
                          className="w-full bg-zinc-50 border border-zinc-200 rounded-md p-1.5 text-xs font-semibold focus:outline-none focus:ring-1 focus:ring-zinc-950"

                      <div>

                      <div>
                        <label className="block text-[8px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Detalles o Notas</label>
                        <textarea 
                          rows="2" 
                          placeholder="Notas o avances..." 
                          value={nuevaTarea.detalles} 
                          onChange={(e) => setNuevaTarea({ ...nuevaTarea, detalles: e.target.value })}
                          className="w-full bg-zinc-50 border border-zinc-200 rounded-md p-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-zinc-950 resize-none"
                        ></textarea>
                      </div>

                      <div className="flex items-center justify-end gap-2 pt-3 border-t border-zinc-100">
                        <button 
                          type="button" 
                          onClick={() => setPaginaActiva("dashboard")}
                          className="bg-zinc-100 hover:bg-zinc-200/80 text-zinc-700 py-1 px-3 rounded-md text-[10px] font-semibold transition-all"
                        >
                          Cancelar
                        </button>
                        <button 
                          type="submit" 
                          className="bg-zinc-900 hover:bg-black text-white py-1 px-3.5 rounded-md text-[10px] font-bold transition-all shadow-sm"

                          Crear Tarea
                        </button>
                      </div>

                    </form>
                  </div>
                </div>
              )}

            </div>

            <footer className="bg-white border-t border-zinc-100 py-1.5 px-6 flex items-center justify-between text-[8px] text-zinc-400 shrink-0">
              <span>ROBIN AGENCY — Gestión Trade & Shopper</span>
              {syncing && (
                <span className="text-zinc-600 font-bold animate-pulse">
                  <i className="fa-solid fa-spinner animate-spin mr-1"></i>Sincronizando Sheets...
                </span>
              )}
            </footer>

          </div>

          {isEditing && activeTask && (
            <ModalEdicionTarea 
              task={activeTask} 
              onClose={() => { setIsEditing(false); setActiveTask(null); }}
              onSave={handleSaveTaskModal}
              marcasDisponibles={marcasDisponibles}
              listaPersonas={listaPersonas}
              registrarNuevaPersona={registrarNuevaPersonaGlobal}
            />
          )}
        </div>
      );
    }

    // =========================================================================
    // COMPONENTE: SELECTOR DE PERSONAS MEDIANTE CHIPS INTERACTIVOS
    // =========================================================================
    function SelectorPersonasChips({ personasSeleccionadas, onChange, listaGlobal, registrarNuevaPersona }) {
      const [isOpen, setIsOpen] = useState(false);
      const [busqueda, setBusqueda] = useState("");

      const seleccionadas = useMemo(() => {
        if (!personasSeleccionadas) return [];
        return personasSeleccionadas.split(" ").map(s => s.trim()).filter(s => s.startsWith("@"));
      }, [personasSeleccionadas]);

      const sugeridos = useMemo(() => {
        const q = busqueda.toLowerCase().trim();
        return listaGlobal.filter(p => {
          const coincideQuery = p.toLowerCase().includes(q);
          const yaSeleccionado = seleccionadas.includes(p);
          return coincideQuery && !yaSeleccionado;
        });
      }, [listaGlobal, seleccionadas, busqueda]);

      const togglePersona = (p) => {
        let nuevos;
        if (seleccionadas.includes(p)) {
          nuevos = seleccionadas.filter(item => item !== p);
        } else {
          nuevos = [...seleccionadas, p];
        }
        onChange(nuevos.join(" "));
      };

      const handleAddNuevo = (e) => {
        if (e.key === "Enter" || e.type === "click") {
          e.preventDefault();
          let limpio = busqueda.trim();
          if (limpio.length > 1) {
            const formateado = limpio.startsWith("@") ? limpio : "@" + limpio;
            registrarNuevaPersona(formateado);
            togglePersona(formateado);
            setBusqueda("");
          }
        }
      };

      return (
        <div className="relative w-full text-left">
          <div className="min-h-[32px] w-full bg-zinc-50 border border-zinc-200 rounded-md p-1 flex flex-wrap gap-1 items-center">
            {seleccionadas.map(p => (
              <span key={p} className="inline-flex items-center gap-1 bg-zinc-900 text-white text-[9px] font-semibold px-2 py-0.5 rounded">
                {p}
                <button type="button" onClick={() => togglePersona(p)} className="hover:text-red-300">
                  <i className="fa-solid fa-xmark text-[8px]"></i>
                </button>
              </span>
            ))}
            
            <input 
              type="text" 
              placeholder={seleccionadas.length === 0 ? "Asignar persona..." : ""}
              value={busqueda}
              onChange={(e) => { setBusqueda(e.target.value); setIsOpen(true); }}
              onFocus={() => setIsOpen(true)}
              onKeyDown={handleAddNuevo}
              className="flex-1 bg-transparent border-0 text-xs p-0.5 focus:outline-none focus:ring-0 min-w-[60px]"
            />
            
            <button 
              type="button" 
              onClick={() => setIsOpen(!isOpen)}
              className="text-zinc-400 hover:text-zinc-700 ml-auto px-1.5"
            >
              <i className="fa-solid fa-chevron-down text-[8px]"></i>
            </button>
          </div>

          {isOpen && (
            <div className="absolute z-50 w-full mt-1 bg-white border border-zinc-200 rounded-lg shadow-xl max-h-40 overflow-y-auto p-1 animate-zoom-in">
              <div className="px-2 py-1 text-[8px] font-black text-zinc-400 uppercase tracking-wider border-b border-zinc-50">Sugerencias</div>
              {sugeridos.map(p => (
                <button
                  key={p}
                  type="button"
                  onClick={() => { togglePersona(p); setBusqueda(""); }}
                  className="w-full text-left px-2.5 py-1 text-xs hover:bg-zinc-50 rounded font-medium text-zinc-700 flex items-center gap-1.5 transition-all"
                >
                  <i className="fa-regular fa-user-circle text-[10px] text-zinc-400"></i>
                  <span>{p}</span>
                </button>
              ))}
              
              {busqueda.trim().length > 0 && !listaGlobal.includes(busqueda.trim()) && (
                <button
                  type="button"
                  onClick={handleAddNuevo}
                  className="w-full text-left px-2.5 py-1 text-xs hover:bg-zinc-100 text-zinc-900 rounded font-bold border-t border-zinc-100/50 mt-1 flex items-center justify-between"
                >
                  <span>Añadir miembro "{busqueda.trim()}"</span>
                  <span className="text-[9px] bg-zinc-200 text-zinc-700 px-1 py-0.5 rounded">Enter</span>
                </button>
              )}
            </div>
          )}
          
          {isOpen && <div className="fixed inset-0 z-40 bg-transparent" onClick={() => setIsOpen(false)}></div>}
        </div>
      );
    }

    // =========================================================================
    // COMPONENTE: LAYOUT DE TABLA (ALTAMENTE MINIMALISTA)
    // =========================================================================
    function LayoutTabla({ tareas, onUpdateField, onSelectTask, getMarcaStyle, filtroTiempo }) {
      return (
        <div className="bg-white border border-zinc-100 rounded-xl shadow-none overflow-hidden animate-slide-in">
          <div className="overflow-x-auto">
            <table className="w-full text-left border-collapse min-w-[850px]">
              <thead>
                <tr className="bg-zinc-50/50 border-b border-zinc-100 text-[8px] font-bold text-zinc-400 uppercase tracking-wider">
                  <th className="py-2.5 px-4 text-center w-16">ID</th>
                  <th className="py-2.5 px-4 text-center w-20">Marca</th>
                  <th className="py-2.5 px-4 w-24">Categoría</th>
                  <th className="py-2.5 px-4">Entregable</th>
                  <th className="py-2.5 px-4 w-32 text-center">Estado</th>
                  <th className="py-2.5 px-4 w-28 text-center">Fecha Límite</th>
                  <th className="py-2.5 px-4 w-28">Asignado</th>
                </tr>
              </thead>
              <tbody className="text-[11px] divide-y divide-zinc-100">
                {tareas.length === 0 ? (
                  <tr>
                    <td colSpan="7" className="py-16 text-center text-zinc-400 bg-zinc-50/5">
                      <div className="flex flex-col items-center justify-center gap-1.5 py-4">
                        <i className="fa-regular fa-folder-open text-zinc-300 text-xl"></i>
                        <p className="font-extrabold text-zinc-750 text-xs">Sin compromisos programados</p>
                        <p className="text-[10px] text-zinc-400">
                          {filtroTiempo === "HOY" 
                            ? "No tienes tareas para hoy. Haz clic en 'Todas' o 'Futuras' en la barra lateral."
                            : "Prueba a cambiar los filtros o añadir un entregable."
                          }
                        </p>
                      </div>
                    </td>
                  </tr>
                ) : (
                  tareas.map(t => {
                    const cMarca = getMarcaStyle(t.marca);
                    const cEstado = ESTADOS_MAPA.find(e => cleanEstado(e.id) === cleanEstado(t.estado)) || { color: "text-zinc-700", dot: "bg-zinc-300" };
                    
                    return (
                      <tr 
                        key={t.idTarea + t.info} 
                        onClick={() => onSelectTask(t)}
                        className="hover:bg-zinc-50/40 transition-all cursor-pointer"
                      >
                        <td className="py-3 px-4 font-mono text-[8px] text-zinc-400 font-bold text-center">
                          {t.idTarea || "---"}
                        </td>
                        
                        <td className="py-3 px-4 text-center" onClick={(e) => e.stopPropagation()}>
                          <span className={`text-[8px] font-extrabold px-1.5 py-0.5 rounded border uppercase tracking-wider ${cMarca.bg} ${cMarca.text} ${cMarca.border}`}>
                            {t.marca || "Otros"}
                          </span>
                        </td>

                        <td className="py-3 px-4 text-zinc-400 font-medium">
                          {t.categoria || "---"}
                        </td>

                        <td className="py-3 px-4">
                          <div className="max-w-md">
                            <p className="font-semibold text-zinc-800 leading-tight">{t.info}</p>
                            {t.detalles && (
                              <p className="text-[9px] text-zinc-400 truncate mt-0.5 font-normal">
                                {t.detalles}
                              </p>
                            )}
                          </div>
                        </td>

                        <td className="py-3 px-4 text-center" onClick={(e) => e.stopPropagation()}>
                          <div className="flex items-center justify-center gap-1.5">
                            <span className={`w-1.5 h-1.5 rounded-full ${cEstado.dot}`}></span>
                            <select
                              value={t.estado}
                              onChange={(e) => onUpdateField(t, "estado", e.target.value)}
                              className="text-[9px] font-bold py-0.5 bg-transparent border-0 cursor-pointer focus:outline-none focus:ring-0 text-zinc-700 font-sans"
                            >
                              {LISTA_ESTADOS_VALIDOS.map(opt => (
                                <option key={opt} value={opt} className="bg-white text-zinc-850">
                                  {opt.substring(opt.indexOf(" ") + 1)}
                                </option>
                              ))}
                            </select>
                          </div>
                        </td>

                        <td className="py-3 px-4 text-center" onClick={(e) => e.stopPropagation()}>
                          <input
                            type="date"
                            value={t.deadline ? t.deadline.split('T')[0] : ""}
                            onChange={(e) => onUpdateField(t, "deadline", e.target.value)}
                            className="bg-transparent border-0 rounded py-0.5 text-[9px] font-semibold text-zinc-500 focus:outline-none w-20 text-center"
                          />
                        </td>

                        <td className="py-3 px-4 text-zinc-400 font-medium">
                          <span className="truncate max-w-[80px] block">{t.personas || "Sin asignar"}</span>
                        </td>

                      </tr>
                    );
                  })
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // =========================================================================
    // COMPONENTE: LAYOUT KANBAN (BOARD)
    // =========================================================================
    function LayoutKanban({ tareas, onUpdateField, onSelectTask, getMarcaStyle }) {
      return (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-3 items-start h-full animate-slide-in">
          {ESTADOS_MAPA.map(col => {
            const tareasColumna = tareas.filter(t => cleanEstado(t.estado) === cleanEstado(col.id));
            
            return (
              <div key={col.id} className="bg-zinc-50/40 border border-zinc-200/20 p-2.5 rounded-xl flex flex-col gap-2 min-h-[450px]">
                <div className="flex items-center justify-between pb-1.5 border-b border-zinc-200/20">
                  <span className="text-[9px] font-black text-zinc-500 uppercase tracking-wider flex items-center gap-1.5">
                    <span className={`w-1.5 h-1.5 rounded-full ${col.dot}`}></span>
                    {col.id.substring(col.id.indexOf(" ") + 1)}
                  </span>
                  <span className="text-[9px] font-bold text-zinc-300">{tareasColumna.length}</span>
                </div>

                <div className="flex flex-col gap-1.5 overflow-y-auto max-h-[480px]">
                  {tareasColumna.length === 0 ? (
                    <div className="text-center py-6 text-zinc-300 text-[9px] font-medium">
                      Sin entregables
                    </div>
                  ) : (
                    tareasColumna.map(t => {
                      const cMarca = getMarcaStyle(t.marca);
                      
                      const avanzarEstado = (e) => {
                        e.stopPropagation();
                        const index = ESTADOS_MAPA.findIndex(e => cleanEstado(e.id) === cleanEstado(t.estado));
                        const nextIndex = (index + 1) % ESTADOS_MAPA.length;
                        onUpdateField(t, "estado", ESTADOS_MAPA[nextIndex].id);
                      };

                      return (
                        <div 
                          key={t.idTarea + t.info}
                          onClick={() => onSelectTask(t)}
                          className="bg-white p-2.5 rounded-lg border border-zinc-200/50 flex flex-col gap-1.5 hover:border-zinc-400 cursor-pointer transition-all animate-zoom-in"
                        >
                          <div className="flex items-center justify-between">
                            <span className={`text-[8px] font-extrabold px-1 py-0.5 rounded uppercase tracking-wider ${cMarca.bg} ${cMarca.text} ${cMarca.border}`}>
                              {t.marca || "Otros"}
                            </span>
                            {t.idTarea && (
                              <span className="text-[8px] font-mono text-zinc-350 font-bold">{t.idTarea}</span>
                            )}
                          </div>

                          <h4 className="text-[10px] font-bold text-zinc-700 leading-tight line-clamp-2">{t.info}</h4>

                          <div className="border-t border-zinc-50 pt-1.5 flex items-center justify-between text-[8px] text-zinc-400">
                            <span className="truncate max-w-[60px]">{t.personas || "Sin asignar"}</span>
                            <span className="font-bold text-zinc-550">{t.deadline ? formatearFecha(t.deadline) : "--/--"}</span>
                          </div>

                          <button 
                            onClick={avanzarEstado}
                            className="w-full text-center py-0.5 mt-0.5 bg-zinc-50 hover:bg-zinc-100 text-zinc-400 font-bold text-[7px] rounded border border-zinc-200/30 uppercase tracking-wider transition-all"
                          >
                            Avanzar Estado
                          </button>
                        </div>
                      );
                    })
                  )}
                </div>

              </div>
            );
          })}
        </div>
      );
    }

    // =========================================================================
    // COMPONENTE: LAYOUT DE CALENDARIO (Premium Minimalista)
    // =========================================================================
    function LayoutCalendario({ tareas, onUpdateField, onSelectTask }) {
      const [currentDate, setCurrentDate] = useState(new Date(2026, 5, 11)); 

      const diasDelMes = useMemo(() => {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        
        let primerDiaSemana = new Date(year, month, 1).getDay();
        primerDiaSemana = primerDiaSemana === 0 ? 6 : primerDiaSemana - 1;
        
        const totalDias = new Date(year, month + 1, 0).getDate();
        const dias = [];
        
        for (let i = 0; i < primerDiaSemana; i++) {
          dias.push({ dia: null, fechaStr: null });
        }
        
        for (let d = 1; d <= totalDias; d++) {
          const m = String(month + 1).padStart(2, '0');
          const diaStr = String(d).padStart(2, '0');
          dias.push({
            dia: d,
            fechaStr: `${year}-${m}-${diaStr}`
          });
        }
        return dias;
      }, [currentDate]);

      const navegarMes = (offset) => {
        setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + offset, 1));
      };

      const nombresMeses = [
        "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
        "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
      ];

      return (
        <div className="bg-white border border-zinc-100 rounded-xl p-4 flex flex-col gap-3 h-full overflow-hidden animate-slide-in">
          <div className="flex items-center justify-between pb-1 border-b border-zinc-100 shrink-0">
            <h3 className="font-extrabold text-zinc-700 text-xs">
              {nombresMeses[currentDate.getMonth()]} {currentDate.getFullYear()}
            </h3>
            
            <div className="flex items-center gap-0.5 bg-zinc-50 p-0.5 rounded border border-zinc-150">
              <button onClick={() => navegarMes(-1)} className="hover:bg-white text-zinc-600 p-0.5 rounded text-[9px]">
                <i className="fa-solid fa-chevron-left px-1"></i>
              </button>
              <button onClick={() => setCurrentDate(new Date(2026, 5, 11))} className="hover:bg-white text-zinc-800 px-2 rounded text-[9px] font-bold">
                Hoy
              </button>
              <button onClick={() => navegarMes(1)} className="hover:bg-white text-zinc-600 p-0.5 rounded text-[9px]">
                <i className="fa-solid fa-chevron-right px-1"></i>
              </button>
            </div>
          </div>

          <div className="flex-1 overflow-y-auto pr-1">
            <div className="grid grid-cols-7 gap-1">
              {["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"].map(d => (
                <div key={d} className="text-center font-bold text-zinc-300 text-[8px] uppercase tracking-wider py-0.5">
                  {d}
                </div>
              ))}

              {diasDelMes.map((cell, index) => {
                const tareasDia = cell.fechaStr ? tareas.filter(t => t.deadline && t.deadline.split('T')[0] === cell.fechaStr) : [];
                const esHoy = cell.fechaStr === "2026-06-11";

                return (
                  <div 
                    key={index}
                    className={`min-h-[75px] border border-zinc-100 rounded-lg p-1.5 flex flex-col gap-1 transition-all ${
                      cell.dia 
                        ? esHoy 
                          ? 'bg-zinc-50/50 border-zinc-900' 
                          : 'bg-white hover:bg-zinc-50/10' 
                        : 'bg-zinc-50/10 opacity-20 pointer-events-none'
                    }`}
                  >
                    {cell.dia && (
                      <div className="flex items-center justify-between">
                        <span className={`text-[8px] font-extrabold w-4 h-4 flex items-center justify-center rounded-full ${
                          esHoy ? 'bg-zinc-900 text-white font-bold' : 'text-zinc-400'
                        }`}>
                          {cell.dia}
                        </span>
                      </div>
                    )}

                    <div className="flex flex-col gap-0.5 overflow-y-auto max-h-[45px]">
                      {tareasDia.map(t => {
                        const esAlerta = cleanEstado(t.estado) === "en revision" || cleanEstado(t.estado) === "en pausa";
                        return (
                          <div
                            key={t.idTarea + t.info}
                            onClick={() => onSelectTask(t)}
                            className={`p-0.5 rounded text-[7px] font-bold border truncate cursor-pointer ${
                              esAlerta 
                                ? 'bg-orange-50 border-orange-100 text-orange-600' 
                                : 'bg-white border-zinc-200 text-zinc-600'
                            }`}
                            title={`${t.marca}: ${t.info}`}
                          >
                            {t.info}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // COMPONENTE: MODAL CLIC A FONDO & STATUS LOG (DRAWER LATERAL PREMIUM)
    // =========================================================================
    function ModalEdicionTarea({ task, onClose, onSave, marcasDisponibles, listaPersonas, registrarNuevaPersona }) {
      const [categoria, setCategoria] = useState(task.categoria || "");
      const [info, setInfo] = useState(task.info || "");
      const [personas, setPersonas] = useState(task.personas || "");
      const [detalles, setDetalles] = useState(task.detalles || "");
      const [estado, setEstado] = useState(task.estado || "⚪ Pendiente");
      const [deadline, setDeadline] = useState(task.deadline || "");
      
      const [nuevoStatus, setNuevoStatus] = useState("");

      const handleAgregarStatus = () => {
        if (!nuevoStatus.trim()) return;
        const hoy = new Date();
        const fechaStr = `${hoy.getDate()}/${hoy.getMonth() + 1}`;
        const actualizacion = `• ${fechaStr}: ${nuevoStatus.trim()}`;
        const nuevosDetalles = detalles ? `${detalles}\n${actualizacion}` : actualizacion;
        
        setDetalles(nuevosDetalles);
        setNuevoStatus("");
        
        onSave({
          ...task,
          categoria,
          info,
          personas,
          detalles: nuevosDetalles,
          estado,
          deadline
        });
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        onSave({
          ...task,
          categoria,
          info,
          personas,
          detalles,
          estado,
          deadline
        });
      };

      return (
        <div className="fixed inset-0 bg-zinc-950/10 backdrop-blur-[1px] z-50 flex items-center justify-end">
          <div className="absolute inset-0" onClick={onClose}></div>
          
          <div className="relative bg-white h-full border-l border-zinc-150 shadow-2xl max-w-sm w-full flex flex-col overflow-hidden animate-slide-in">
            <div className="bg-zinc-50/50 px-5 py-3 border-b border-zinc-100 flex items-center justify-between">
              <span className="text-[9px] font-black text-zinc-400 uppercase tracking-wider">Ficha de Seguimiento</span>
              <button onClick={onClose} className="text-zinc-400 hover:text-zinc-800 text-xs">
                <i className="fa-solid fa-xmark"></i>
              </button>
            </div>

            <form onSubmit={handleFormSubmit} className="p-5 flex flex-col gap-3.5 flex-1 overflow-y-auto">
              <div>
                <label className="block text-[8px] font-bold text-zinc-400 uppercase tracking-wider mb-0.5">Marca</label>
                <select 
                  value={task.marca} 
                  disabled
                  className="w-full bg-zinc-100 p-1.5 text-xs rounded border-0 font-bold text-zinc-500 focus:outline-none"
                >
                  {marcasDisponibles.map(m => (
                    <option key={m} value={m}>{m}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-[8px] font-bold text-zinc-400 uppercase tracking-wider mb-0.5">Categoría</label>
                <input type="text" value={categoria} onChange={(e) => setCategoria(e.target.value)} className="w-full bg-zinc-50 border border-zinc-200 p-1.5 text-xs rounded focus:outline-none focus:ring-1 focus:ring-zinc-950" />
              </div>

              <div>
                <label className="block text-[8px] font-bold text-zinc-400 uppercase tracking-wider mb-0.5">Título / Entregable</label>
                <input type="text" required value={info} onChange={(e) => setInfo(e.target.value)} className="w-full bg-zinc-50 border border-zinc-200 p-1.5 text-xs rounded font-semibold focus:outline-none focus:ring-1 focus:ring-zinc-950" />
              </div>

              <div>
                <label className="block text-[8px] font-bold text-zinc-400 uppercase tracking-wider mb-0.5">Asignados</label>
                <SelectorPersonasChips 
                  personasSeleccionadas={personas} 
                  onChange={(nuevas) => setPersonas(nuevas)}
                  listaGlobal={listaPersonas}
                  registrarNuevaPersona={registrarNuevaPersona}
                />
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-[8px] font-bold text-zinc-400 uppercase tracking-wider mb-0.5">Estado</label>
                  <select value={estado} onChange={(e) => setEstado(e.target.value)} className="w-full bg-zinc-50 border border-zinc-200 p-1.5 text-xs rounded focus:outline-none focus:ring-1 focus:ring-zinc-950 bg-white font-medium">
                    {LISTA_ESTADOS_VALIDOS.map(opt => (
                      <option key={opt} value={opt}>{opt}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-[8px] font-bold text-zinc-400 uppercase tracking-wider mb-0.5">Fecha límite</label>
                  <input type="date" value={deadline ? deadline.split('T')[0] : ""} onChange={(e) => setDeadline(e.target.value)} className="w-full bg-zinc-50 border border-zinc-200 p-1.5 text-xs rounded focus:outline-none focus:ring-1 focus:ring-zinc-950" />
                </div>
              </div>

              <div>
                <label className="block text-[8px] font-bold text-zinc-400 uppercase tracking-wider mb-0.5">Historial o Detalles</label>
                <textarea 
                  value={detalles} 
                  onChange={(e) => setDetalles(e.target.value)} 
                  rows="5"
                  className="w-full bg-zinc-50 border border-zinc-200 p-2 text-[10px] rounded focus:outline-none focus:ring-1 focus:ring-zinc-950 resize-none font-mono"
                ></textarea>
              </div>

              <div className="bg-zinc-50 p-2.5 rounded border border-zinc-150">
                <label className="block text-[8px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Añadir Avance Rápido</label>
                <div className="flex gap-1.5">
                  <input 
                    type="text" 
                    placeholder="Registrar estatus..." 
                    value={nuevoStatus} 
                    onChange={(e) => setNuevoStatus(e.target.value)} 
                    className="flex-1 bg-white border border-zinc-200 rounded p-1 text-[11px] focus:outline-none"
                    onKeyDown={(e) => {
                      if (e.key === 'Enter') {
                        e.preventDefault();
                        handleAgregarStatus();
                      }
                    }}
                  />
                  <button 
                    type="button" 
                    onClick={handleAgregarStatus} 
                    className="bg-zinc-900 hover:bg-black text-white px-2.5 py-1 rounded text-[10px] font-bold transition-all"
                  >
                    Añadir
                  </button>
                </div>
              </div>

              <div className="flex items-center justify-end gap-1.5 pt-3 border-t border-zinc-100 mt-auto">
                <button type="button" onClick={onClose} className="px-3 py-1 bg-zinc-100 hover:bg-zinc-200/80 text-zinc-700 font-semibold text-[10px] rounded transition-all">
                  Cerrar
                </button>
                <button type="submit" className="px-3.5 py-1 bg-zinc-900 hover:bg-black text-white font-bold text-[10px] rounded transition-all shadow-sm">
                  Guardar Cambios
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Utilidades
    function cleanEstado(val) {
      if (!val) return "";
      return String(val)
        .replace(/[\u2600-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF]/g, '')
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }

    function formatearFecha(fechaStr) {
      if (!fechaStr) return "";
      const partes = fechaStr.split("-");
      if (partes.length === 3) {
        return `${partes[2]}/${partes[1]}`;
      }
      return fechaStr.split("T")[0];
    }

    function obtenerTiempoFecha(val) {
      if (!val) return Infinity;
      if (val instanceof Date) {
        return new Date(val.getFullYear(), val.getMonth(), val.getDate()).getTime();
      }
      var str = String(val).trim();
      var partes = str.split(/[-/]/);
      if (partes.length === 3) {
        var dia, mes, anio;
        if (partes[0].length === 4) {
          anio = parseInt(partes[0], 10); mes = parseInt(partes[1], 10) - 1; dia = parseInt(partes[2], 10);
        } else {
          dia = parseInt(partes[0], 10); mes = parseInt(partes[1], 10) - 1; anio = parseInt(partes[2], 10);
          if (anio < 100) anio += 2000;
        }
        var d = new Date(anio, mes, dia);
        return isNaN(d.getTime()) ? Infinity : d.getTime();
      }
      var timestamp = Date.parse(str);
      if (!isNaN(timestamp)) {
        var dp = new Date(timestamp);
        return new Date(dp.getFullYear(), dp.getMonth(), dp.getDate()).getTime();
      }
      return Infinity;
    }

    // Inicializar
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>

  <style>
    @keyframes slide-in {
      from { transform: translateX(50px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes zoom-in {
      from { transform: scale(0.98); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .animate-slide-in {
      animation: slide-in 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-zoom-in {
      animation: zoom-in 0.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
