  <!-- Bloqueo de zoom: debe ejecutarse antes que el resto -->
  <script>
    (function () {
      var opts = { passive: false };
      var stop = function (e) { e.preventDefault(); };
      document.addEventListener("gesturestart", stop, opts);
      document.addEventListener("gesturechange", stop, opts);
      document.addEventListener("gestureend", stop, opts);
      document.addEventListener("touchstart", function (e) {
        if (e.touches.length > 1) stop(e);
      }, opts);
      document.addEventListener("touchmove", function (e) {
        if (e.touches.length > 1) stop(e);
      }, opts);
      var lockViewport = "width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover";
      var applyViewport = function () {
        var meta = document.querySelector('meta[name="viewport"]');
        if (meta) meta.setAttribute("content", lockViewport);
      };
      applyViewport();
      window.addEventListener("orientationchange", function () {
        setTimeout(applyViewport, 200);
      });
    })();
  </script>

  <div id="root" class="h-screen w-screen overflow-hidden flex items-center justify-center bg-white">
    <p id="robin-boot-placeholder" style="font-family:Inter,sans-serif;font-size:13px;color:#71717a;">Cargando ROBIN…</p>
  </div>

  <script>
    (function robinEarlyBootGuard() {
      var root = document.getElementById("root");
      if (!root) return;

      var showBootError = function (message) {
        root.innerHTML =
          '<div style="font-family:Inter,sans-serif;padding:24px;max-width:420px;margin:40px auto;color:#37352F;">' +
          '<p style="font-weight:700;margin-bottom:8px;">No se pudo cargar ROBIN</p>' +
          '<p style="font-size:13px;color:#71717a;line-height:1.5;margin-bottom:12px;">' + message + '</p>' +
          '<button type="button" onclick="location.reload()" style="padding:8px 12px;border:1px solid #e4e4e7;border-radius:6px;background:#fff;font-size:12px;font-weight:600;cursor:pointer;">Recargar</button>' +
          '</div>';
      };

      if (window.location.protocol === "file:") {
        showBootError(
          "No abras index.html directamente desde el disco. Usa un servidor local (Live Server, python -m http.server) o la URL publicada de la PWA."
        );
        return;
      }

      window.setTimeout(function () {
        var placeholder = document.getElementById("robin-boot-placeholder");
        if (placeholder) {
          showBootError(
            "La aplicación no compiló. Revisa tu conexión, recarga la página o borra la caché de la PWA."
          );
        }
      }, 12000);
    })();
  </script>
