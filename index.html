    // 🟢 DECLARACIÓN INMEDIATA DE HOOKS (Previene Temporal Dead Zone / ReferenceError en Babel)
    const useState = React.useState;

    // 🟢 CONFIGURACIÓN DIRECTA DE LA BASE DE DATOS (Google Sheets)
    const AUTO_API_URL = "https://script.google.com/macros/s/AKfycbz1-GZ86-7lXQp-pWREuClyD6V0P1v6e-f1K-tS-S6tY7_hP-90/exec";
    
    // Funciones auxiliares globales saneadas para garantizar el hoisting en Babel y prevenir errores en sandbox
    function getLocalStorageItemSafe(key, fallback = null) {
      try {
        const val = localStorage.getItem(key);
        if (val === null || val === undefined || val === "null" || val === "undefined" || val === "") {
          return fallback;
        }
        return val;
      } catch (e) {
        return fallback;
      }
    }

    function setLocalStorageItemSafe(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (e) {
        console.warn("Acceso a almacenamiento local restringido por el navegador.", e);
      }
    }

    function removeLocalStorageItemSafe(key) {
      try {
        localStorage.removeItem(key);
      } catch (e) {
        console.warn("Acceso a almacenamiento local restringido por el navegador.", e);
      }
    }

    function clearLocalStorageSafe() {
      try {
        localStorage.clear();
      } catch (e) {
        console.warn("Acceso a almacenamiento local restringido por el navegador.", e);
      }
    }

    function getEffectiveApiUrl(url) {
      if (!url) return "";
      let clean = url.trim();
      if (clean.includes("/a/macros/")) {
        clean = clean.replace(/\/a\/macros\/[^\/]+\/s\//, "/macros/s/");
      }
      return clean;
    }

    function getInicialUsuario() {
      const u = getLocalStorageItemSafe("robin_usuario_actual", null);
      if (u === "null" || u === "undefined" || u === "") return null;
      return u;
    }

    function cleanIdTarea(id) {
      if (!id) return "";
      const idStr = String(id).trim();
      if (idStr.includes("GMT") || (idStr.includes("2026") && idStr.length > 15) || idStr.includes("Venezuela") || idStr.startsWith("STB-")) {
        return "";
      }
      return idStr;
    }

    function stripEmoji(str) {
      if (!str) return "";
      return String(str)
        .replace(/[\u2600-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF]/g, '')
        .trim();
    }

    function cleanEstado(val) {
      if (!val) return "";
      return String(val)
        .replace(/[\u2600-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF]/g, '')
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }

    function cleanPrioridad(val) {
      if (!val) return "media";
      return String(val)
        .replace(/[\u2600-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF]/g, '')
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }

    function formatearFecha(fechaStr) {
      if (!fechaStr) return "";
      const partes = fechaStr.split("-");
      if (partes.length === 3) {
        return `${partes[2]}/${partes[1]}`;
      }
      return fechaStr.split("T")[0];
    }

    function obtenerTiempoFecha(val) {
      if (!val) return Infinity;
      if (val instanceof Date) {
        return new Date(val.getFullYear(), val.getMonth(), val.getDate()).getTime();
      }
      var str = String(val).trim();
      if (str.includes("GMT") || str.includes("Venezuela") || str.includes(":") || (isNaN(str[0]) && isNaN(parseInt(str, 10)))) {
        var parsedDate = new Date(str);
        if (!isNaN(parsedDate.getTime())) {
          return new Date(parsedDate.getFullYear(), parsedDate.getMonth(), parsedDate.getDate()).getTime();
        }
      }
      str = str.split(/[ T]/)[0].trim();
      var partes = str.split(/[-/]/);
      if (partes.length === 3) {
        var dia, mes, anio;
        if (partes[0].length === 4) {
          anio = parseInt(partes[0], 10); 
          mes = parseInt(partes[1], 10) - 1; 
          dia = parseInt(partes[2], 10);
        } else {
          dia = parseInt(partes[0], 10); 
          mes = parseInt(partes[1], 10) - 1; 
          anio = parseInt(partes[2], 10);
          if (anio < 100) anio += 2000;
        }
        var d = new Date(anio, mes, dia);
        return isNaN(d.getTime()) ? Infinity : d.getTime();
      }
      return Infinity;
    }

    function sonMismasFechas(d1, d2) {
      if (!d1 || !d2) return false;
      const t1 = obtenerTiempoFecha(d1);
      const t2 = obtenerTiempoFecha(d2);
      return t1 !== Infinity && t2 !== Infinity && t1 === t2;
    }

    function isValidIdTarea(id) {
      if (!id) return false;
      const idStr = String(id).trim().toUpperCase();
      if (idStr.length === 0) return false;
      if (idStr.includes("GMT") || idStr.includes("VENEZUELA") || idStr.includes(":")) return false;
      if (idStr === "PENDIENTE" || idStr === "EN PROGRESO" || idStr === "SEGUIMIENTO" || idStr === "EN REVISION" || idStr === "EN PAUSA" || idStr === "COMPLETADA") return false;

    }

    // =========================================================================
    // 📅 COMPONENTE: CALENDARIO MENSUAL INTEGRADO (NOTION CALENDAR VIEW - FULL WIDTH)
    // =========================================================================
    function CalendarioNotion({ tareas, onSelectTask, getMarcaStyle }) {
      const [currentMonth, setCurrentMonth] = useState(() => new Date().getMonth());
      const [currentYear, setCurrentYear] = useState(() => new Date().getFullYear());

      const monthNames = [
        "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", 
        "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
      ];
      
      const dayNames = ["Lun", "Mar", "Mie", "Jue", "Vie", "Sab", "Dom"];

      const handlePrevMonth = () => {
        if (currentMonth === 0) {
          setCurrentMonth(11);
          setCurrentYear(prev => prev - 1);
        } else {
          setCurrentMonth(prev => prev - 1);
        }
      };

      const handleNextMonth = () => {
        if (currentMonth === 11) {
          setCurrentMonth(0);
          setCurrentYear(prev => prev + 1);
        } else {
          setCurrentMonth(prev => prev + 1);
        }
      };

      const gridCells = useMemo(() => {
        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const offset = firstDay === 0 ? 6 : firstDay - 1; 
        const daysCount = new Date(currentYear, currentMonth + 1, 0).getDate();

        const cells = [];
        const prevMonthDays = new Date(currentYear, currentMonth, 0).getDate();

        for (let i = offset - 1; i >= 0; i--) {
          cells.push({
            day: prevMonthDays - i,
            isCurrentMonth: false,
            month: currentMonth === 0 ? 11 : currentMonth - 1,
            year: currentMonth === 0 ? currentYear - 1 : currentYear
          });
        }

        for (let i = 1; i <= daysCount; i++) {
          cells.push({
            day: i,
            isCurrentMonth: true,
            month: currentMonth,
            year: currentYear
          });
        }

        const remaining = 42 - cells.length;
        for (let i = 1; i <= remaining; i++) {
          cells.push({
            day: i,
            isCurrentMonth: false,
            month: currentMonth === 11 ? 0 : currentMonth + 1,
            year: currentMonth === 11 ? currentYear + 1 : currentYear
          });
        }

        return cells;
      }, [currentMonth, currentYear]);

      const isSameDayTask = (task, y, m, d) => {
        if (!task.deadline) return false;
        const taskTime = obtenerTiempoFecha(task.deadline);
        const cellTime = new Date(y, m, d).getTime();
        return taskTime !== Infinity && taskTime === cellTime;
      };

      const getMarcaStyleCalendar = (marcaName) => {
        if (!marcaName) return { bg: "bg-zinc-50 text-zinc-700 border-l-2 border-l-zinc-400" };
        const clean = marcaName.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
        if (clean === "LA SANTE") return { bg: "bg-blue-50/50 text-blue-700 border-l-2 border-l-blue-400 border-zinc-100" };
        if (clean === "DIAGEO") return { bg: "bg-purple-50/50 text-purple-700 border-l-2 border-l-purple-400 border-zinc-100" };
        if (clean === "GAMA") return { bg: "bg-orange-50/50 text-orange-700 border-l-2 border-l-orange-400 border-zinc-100" };
        if (clean === "ROBIN") return { bg: "bg-zinc-900 text-white border-l-2 border-l-zinc-800 border-zinc-950" };
        if (clean === "TMK") return { bg: "bg-emerald-50/50 text-emerald-700 border-l-2 border-l-emerald-400 border-zinc-100" };
        return { bg: "bg-zinc-50 text-zinc-700 border-l-2 border-l-zinc-400 border-zinc-100" };
      };

      return (
        <div className="border border-zinc-200 rounded-md bg-white p-5 w-full">
          <div className="flex items-center justify-between pb-3.5 mb-4 border-b border-zinc-150">
            <span className="text-xs font-bold uppercase tracking-wider text-zinc-400">Cronograma Mensual</span>
            <div className="flex items-center gap-3">

    // =========================================================================
    // 📋 COMPONENTE: LAYOUT DE TABLA AGRUPADA (ESTILO BASE DE DATOS NOTION)
    // =========================================================================
    function LayoutTablaAgrupada({ tareas, onUpdateField, onSelectTask, onDeleteTask, getMarcaStyle, currentTheme }) {
      
      const tareasAgrupadasPorMarca = useMemo(() => {
        const agrupamiento = {};
        tareas.forEach(t => {
          const marcaKey = t.marca || "Otros";
          if (!agrupamiento[marcaKey]) agrupamiento[marcaKey] = [];
          agrupamiento[marcaKey].push(t);
        });

        const PRIORIDADES_ESTADOS = {
          "pendiente": 1, "en progreso": 2, "seguimiento": 3, "en revision": 4, "en pausa": 5, "completada": 99
        };

        Object.keys(agrupamiento).forEach(marca => {
          agrupamiento[marca].sort((a, b) => {
            const pesoA = getPriorityWeight(a.prioridad);
            const pesoB = getPriorityWeight(b.prioridad);
            if (pesoA !== pesoB) return pesoB - pesoA;
            const estA = cleanEstado(a.estado);
            const estB = cleanEstado(b.estado);
            return (PRIORIDADES_ESTADOS[estA] || 50) - (PRIORIDADES_ESTADOS[estB] || 50);
          });
        });

        return agrupamiento;
      }, [tareas]);

      return (
        <div className={`border ${currentTheme.border} rounded-md overflow-hidden ${currentTheme.cardBg} w-full`}>
          <div className="overflow-x-auto w-full">
            <table className="w-full text-left border-collapse text-xs">
              <thead>
                <tr className="bg-[#FAF9F6]/80 border-b border-zinc-200 text-zinc-500 font-medium">
                  <th className="py-2.5 px-4 text-center w-24">ID</th>
                  <th className="py-2.5 px-4 w-24 text-center">Prioridad</th>
                  <th className="py-2.5 px-4 w-28">Categoría</th>
                  <th className="py-2.5 px-4">Entregable</th>
                  <th className="py-2.5 px-4 w-32 text-center">Estado</th>
                  <th className="py-2.5 px-4 w-28 text-center">Fecha Límite</th>
                  <th className="py-2.5 px-4 w-32">Asignado</th>
                  <th className="py-2.5 px-4 text-center w-16">Acciones</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-zinc-100">
                {tareas.length === 0 ? (
                  <tr>
                    <td colSpan="8" className="py-12 text-center text-zinc-400 font-normal">
                      No hay entregables registrados en esta pestaña.
                    </td>
                  </tr>
                ) : (
                  Object.keys(tareasAgrupadasPorMarca).map(marca => {
                    const tareasDeMarca = tareasAgrupadasPorMarca[marca];
                    const badgeStyle = getMarcaStyle(marca);

                    return (
                      <React.Fragment key={marca}>
                        <tr className="bg-[#FAF9F6]/40 border-y border-zinc-200/50">
                          <td colSpan="8" className="py-1.5 px-4">
                            <div className="flex items-center gap-2">
                              <span className={`text-[10px] font-semibold px-2 py-0.5 rounded uppercase tracking-tight border ${badgeStyle.bg} ${badgeStyle.text} ${badgeStyle.border}`}>
                                {marca}
                              </span>
                              <span className="text-[11px] text-zinc-400 font-medium">
                                ({tareasDeMarca.length})
                              </span>
                            </div>
                          </td>
                        </tr>

                        {tareasDeMarca.map(t => {
                          const cEstado = ESTADOS_MAPA.find(e => cleanEstado(e.id) === cleanEstado(t.estado)) || { color: "text-zinc-600", dot: "bg-[#7c7c7c]", bg: "bg-zinc-50" };
                          const cPrioridad = PRIORIDADES_MAPA.find(p => cleanPrioridad(p.id) === cleanPrioridad(t.prioridad)) || PRIORIDADES_MAPA[1];
                          const displayId = cleanIdTarea(t.idTarea);
                          
                          return (
                            <tr 
                              key={t.idTarea + t.info} 
                              onClick={() => onSelectTask(t)}
                              className="hover:bg-zinc-50/60 transition-colors cursor-pointer"
                            >
                              <td className="py-2.5 px-4 font-mono text-[11px] text-zinc-400 text-center font-medium">
                                {displayId || "---"}
                              </td>

                              <td className="py-2.5 px-4 text-center" onClick={(e) => e.stopPropagation()}>
                                <select
                                  value={t.prioridad || "Media"}
                                  onChange={(e) => onUpdateField(t, "prioridad", e.target.value)}
                                  className={`text-[11px] font-medium px-2 py-0.5 rounded border focus:outline-none focus:ring-0 ${cPrioridad.color} cursor-pointer`}
                                >
                                  {PRIORIDADES_MAPA.map(p => (
                                    <option key={p.id} value={p.id} className="bg-white text-[#37352F]">
                                      {p.label}
                                    </option>
                                  ))}
                                </select>
                              </td>
                              
                              <td className="py-2.5 px-4 text-zinc-500 font-normal truncate max-w-[120px]">
                                {t.categoria || "---"}
                              </td>

                              <td className="py-2.5 px-4 font-medium text-[#37352F]">
                                <div className="max-w-md">
                                  <p className="truncate leading-relaxed">{t.info}</p>
                                  {t.detalles && (
                                    <p className="text-[10px] text-zinc-400 font-normal truncate mt-0.5">
                                      {t.detalles.split('\n')[0]}

                                  )}

                              </td>

                              <td className="py-2.5 px-4 text-center" onClick={(e) => e.stopPropagation()}>

                                    <select
                                      value={t.estado}
                                      onChange={(e) => onUpdateField(t, "estado", e.target.value)}
                                      className="text-[10px] font-medium bg-transparent border-0 cursor-pointer focus:outline-none focus:ring-0 text-zinc-700"
                                    >
                                      {LISTA_ESTADOS_VALIDOS.map(opt => (

                                          {opt}
                                        </option>
                                      ))}
                                    </select>
                                  </div>
                                </div>
                              </td>

                              <td className="py-2.5 px-4 text-center" onClick={(e) => e.stopPropagation()}>
                                <input
                                  type="date"
                                  value={convertirFechaAInput(t.deadline)}
                                  onChange={(e) => {
                                    const val = e.target.value;
                                    if (val && val.length === 10) {
                                      onUpdateField(t, "deadline", val);
                                    }
                                  }}
                                  className="bg-transparent border-0 py-0.5 px-1 text-zinc-500 font-medium focus:outline-none w-28 text-center"
                                />
                              </td>

                              <td className="py-2.5 px-4 text-zinc-500 font-medium truncate max-w-[100px]">
                                {t.personas || "Sin asignar"}
                              </td>

                              <td className="py-2.5 px-4 text-center" onClick={(e) => e.stopPropagation()}>
                                <button
                                  onClick={() => onDeleteTask(t)}
                                  className="p-1 text-zinc-400 hover:text-red-500 rounded transition-colors"
                                >
                                  <i className="fa-regular fa-trash-can"></i>
                                </button>
                              </td>

                            </tr>
                          );
                        })}
                      </React.Fragment>
                    );
                  })
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 🗂️ COMPONENTE: LAYOUT KANBAN (BOARD KANBAN ESTILO NOTION)
    // =========================================================================
    function LayoutKanban({ tareas, onUpdateField, onSelectTask, onDeleteTask, getMarcaStyle, currentTheme }) {
      const [dragOverCol, setDragOverColumn] = useState(null);

      const handleDragStart = (e, task) => {
        e.dataTransfer.setData("taskId", task.idTarea || "");
        e.dataTransfer.setData("taskInfo", task.info || "");
        e.dataTransfer.effectAllowed = "move";
      };

      const handleDrop = (e, targetEstado) => {
        e.preventDefault();
        setDragOverColumn(null);
        const taskId = e.dataTransfer.getData("taskId");
        const taskInfo = e.dataTransfer.getData("taskInfo");

        const taskMatched = tareas.find(t => (t.idTarea === taskId && taskId) || t.info === taskInfo);
        if (taskMatched && cleanEstado(taskMatched.estado) !== cleanEstado(targetEstado)) {
          onUpdateField(taskMatched, "estado", targetEstado);
        }
      };

      return (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-3 items-start h-full animate-fade-in">
          {ESTADOS_MAPA.map(col => {
            const tareasColumna = tareas.filter(t => cleanEstado(t.estado) === cleanEstado(col.id));
            const isOverThis = dragOverCol === col.id;
            
            return (
              <div 
                key={col.id} 
                onDragOver={(e) => { e.preventDefault(); setDragOverColumn(col.id); }}
                onDragLeave={() => setDragOverColumn(null)}
                onDrop={(e) => handleDrop(e, col.id)}
                className={`p-2 rounded-md flex flex-col gap-2 min-h-[400px] transition-all ${
                  isOverThis ? 'bg-zinc-100/60' : 'bg-transparent'
                }`}
              >
                <div className="flex items-center justify-between pb-1 px-1 text-[11px] font-semibold text-zinc-500 uppercase tracking-tight">
                  <div className="flex items-center gap-1.5">
                    <span className={`w-2 h-2 rounded-full ${col.dot}`}></span>
                    <span>{col.id}</span>
                  </div>
                  <span className="text-zinc-400 font-normal">{tareasColumna.length}</span>
                </div>

                <div className="flex flex-col gap-2 overflow-y-auto max-h-[500px] pr-1">
                  {tareasColumna.map(t => {
                    const cMarca = getMarcaStyle(t.marca);
                    const cPrioridad = PRIORIDADES_MAPA.find(p => cleanPrioridad(p.id) === cleanPrioridad(t.prioridad)) || PRIORIDADES_MAPA[1];
                    
                    const avanzarEstado = (e) => {
                      e.stopPropagation();
                      const index = ESTADOS_MAPA.findIndex(e => cleanEstado(e.id) === cleanEstado(t.estado));
                      const nextIndex = (index + 1) % ESTADOS_MAPA.length;
                      onUpdateField(t, "estado", ESTADOS_MAPA[nextIndex].id);
                    };

                    return (
                      <div 
                        key={t.idTarea + t.info}
                        draggable={true}
                        onDragStart={(e) => handleDragStart(e, t)}
                        onClick={() => onSelectTask(t)}
                        className={`bg-white p-3 rounded border ${currentTheme.border} shadow-[0_1px_2px_rgba(0,0,0,0.03)] hover:shadow-sm cursor-grab active:cursor-grabbing transition-all flex flex-col gap-2 animate-fade-in`}
                      >
                        <div className="flex items-center justify-between">
                          <span className={`text-[9px] font-medium px-1.5 py-0.5 rounded border uppercase tracking-tight ${cMarca.bg} ${cMarca.text} ${cMarca.border}`}>
                            {t.marca || "Otros"}
                          </span>
                          <span className="text-[9px] text-zinc-400 font-normal">
                            {t.deadline ? formatearFecha(t.deadline) : ""}
                          </span>
                        </div>

                        <h4 className="text-[12px] font-medium leading-snug text-[#37352F] line-clamp-3">{t.info}</h4>

                        <div className="flex items-center justify-between text-[10px] text-zinc-400 pt-1 border-t border-zinc-100">
                          <span className="truncate max-w-[80px] font-medium">{t.personas || "Sin asignar"}</span>
                          <span className={`px-1.5 py-0.25 rounded border text-[9px] font-medium ${cPrioridad.color}`}>
                            {cPrioridad.label}
                          </span>
                        </div>

                        <div className="flex gap-1.5 mt-1">
                          <button 
                            onClick={avanzarEstado}
                            className="flex-1 py-1 text-center bg-zinc-50 hover:bg-zinc-100 text-zinc-600 text-[10px] font-medium rounded border border-zinc-200 transition-colors"
                          >
                            Avanzar
                          </button>
                          <button
                            onClick={(e) => { e.stopPropagation(); onDeleteTask(t); }}
                            className="p-1 text-zinc-300 hover:text-red-500 rounded transition-colors"
                          >
                            <i className="fa-regular fa-trash-can text-[11px]"></i>
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    // =========================================================================
    // 👤 COMPONENTE: SELECTOR DE PERSONAS CHIPS (NOTION STYLE)
    // =========================================================================
    function SelectorPersonasChips({ personasSeleccionadas, onChange, listaGlobal, registrarNuevaPersona }) {
      const [buscar, setBuscar] = useState("");
      const [dropdownOpen, setDropdownOpen] = useState(false);
      const containerRef = useRef(null);

      const seleccionadasArray = useMemo(() => {
        if (!personasSeleccionadas) return [];
        return personasSeleccionadas.split(",").map(p => p.trim()).filter(Boolean);
      }, [personasSeleccionadas]);

      const handleTogglePersona = (p) => {
        let nuevas = seleccionadasArray.includes(p)
          ? seleccionadasArray.filter(item => item !== p)
          : [...seleccionadasArray, p];
        onChange(nuevas.join(", "));
      };

      const handleAddCustom = (e) => {
        if (e.key === 'Enter' || e.type === 'click') {
          e.preventDefault();
          let val = buscar.trim();
          if (!val) return;
          if (!val.startsWith("@")) val = "@" + val;
          registrarNuevaPersona(val);
          if (!seleccionadasArray.includes(val)) {
            onChange([...seleccionadasArray, val].join(", "));
          }
          setBuscar("");
        }
      };

      useEffect(() => {
        const handleClickOutside = (event) => {
          if (containerRef.current && !containerRef.current.contains(event.target)) {
            setDropdownOpen(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      return (
        <div ref={containerRef} className="relative w-full">
          <div 
            onClick={() => setDropdownOpen(true)}
            className="min-h-[36px] w-full bg-white border border-zinc-200 rounded p-1.5 flex flex-wrap gap-1 items-center cursor-pointer hover:border-zinc-300 transition-colors"
          >
            {seleccionadasArray.length === 0 ? (
              <span className="text-xs text-zinc-400 font-normal px-1">Seleccionar miembros...</span>
            ) : (
              seleccionadasArray.map(p => (
                <span key={p} className="inline-flex items-center gap-1 bg-zinc-100 text-[#37352F] text-[11px] font-medium px-2 py-0.5 rounded border border-zinc-200">
                  {p}
                  <button 
                    type="button"
                    onClick={(e) => { e.stopPropagation(); handleTogglePersona(p); }}
                    className="text-zinc-400 hover:text-red-500 ml-0.5 font-bold"
                  >
                    &times;
                  </button>
                </span>
              ))
            )}
          </div>

          {dropdownOpen && (
            <div className="absolute z-50 left-0 right-0 mt-1 bg-white border border-zinc-200 rounded shadow-md p-2 flex flex-col gap-2 max-h-48 overflow-y-auto animate-zoom-in">
              <div className="flex gap-1">
                <input 
                  type="text"
                  placeholder="Escribir o buscar..."
                  value={buscar}
                  onChange={(e) => setBuscar(e.target.value)}
                  onKeyDown={handleAddCustom}
                  className="flex-1 bg-zinc-50 border border-zinc-200 text-xs rounded px-2 py-1 focus:outline-none font-medium text-[#37352F]"
                />
                <button 
                  type="button"
                  onClick={handleAddCustom}
                  className="bg-zinc-800 text-white text-[11px] font-medium px-2.5 py-1 rounded"
                >
                  Añadir
                </button>
              </div>
              <div className="flex flex-col gap-0.5">
                {listaGlobal
                  .filter(p => p.toLowerCase().includes(buscar.toLowerCase()))
                  .map(p => {
                    const isSel = seleccionadasArray.includes(p);
                    return (
                      <div 
                        key={p}
                        onClick={() => handleTogglePersona(p)}
                        className={`flex items-center justify-between px-2 py-1 rounded text-xs font-medium cursor-pointer ${
                          isSel ? 'bg-zinc-100 text-zinc-900 font-bold' : 'hover:bg-zinc-50 text-zinc-600'
                        }`}
                      >
                        <span>{p}</span>
                        {isSel && <i className="fa-solid fa-check text-zinc-600 text-[10px]"></i>}
                      </div>
                    );
                  })}
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 🏠 COMPONENTE: LAYOUT DE HOME (WORKSPACE MINIMALISTA DE NOTION)

    function LayoutHome({ tareas, nombreUsuario, username, onSelectTask, onUpdateField, widgets, onAddWidget, onDeleteWidget, currentTheme, getMarcaStyle, cleanIdTarea }) {

        const total = tareas.length;
        const completadas = tareas.filter(t => cleanEstado(t.estado) === "completada").length;
        const enProgreso = tareas.filter(t => cleanEstado(t.estado) === "en progreso").length;
        
        const hoy = new Date();
        const tHoy = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()).getTime();

          const tDeadline = obtenerTiempoFecha(t.deadline);
          return tDeadline !== Infinity && tDeadline < tHoy && cleanEstado(t.estado) !== "completada";

        return { total, completadas, enProgreso, atrasadas };

        const nuevo = {
          id: "WID-" + Date.now(),
          titulo: widgetTitulo.trim(),
          link: widgetLink.trim(),
          icon: widgetIcon,
          color: widgetColor
        };
        onAddWidget(nuevo);
        setWidgetTitulo("");
        setWidgetLink("");
        setShowAddWidgetModal(false);
      };

      const handleAddWidgetColorClass = (val) => {
        setWidgetColor(val);
      };

      return (
        <div className="flex flex-col gap-5 animate-fade-in">
          {/* Bienvenida limpia */}
          <div className="border-b border-zinc-150 pb-2.5 flex items-center justify-between">

                Home
              </h2>
              <p className="text-[11px] text-zinc-400 font-medium">
                Workspace unificado de Trade & Shopper Marketing.
              </p>
            </div>
          </div>

          {/* BARRA HORIZONTAL DE ACCESOS DIRECTOS (WIDGETS) */}
          <div className="flex flex-col gap-2">
            <div className="flex items-center justify-between border-b border-zinc-100 pb-1.5">

              <button 
                onClick={() => setShowAddWidgetModal(true)}
                className="text-[11px] font-semibold text-zinc-500 hover:text-zinc-800 transition-colors"
              >
                + Añadir enlace
              </button>
            </div>
            <div className="flex items-center gap-3 overflow-x-auto py-1 pr-1 no-scrollbar">
              {widgets.length === 0 ? (
                <div className="text-xs text-zinc-400 italic py-1">No hay enlaces rápidos registrados.</div>
              ) : (
                widgets.map(w => (
                  <div 
                    key={w.id} 
                    className="flex items-center gap-2 px-3 py-1.5 rounded border border-zinc-200 bg-white hover:bg-zinc-50/50 transition-colors group shrink-0 shadow-sm"

                    <a 
                      href={w.link}

      const [selectedBrand, setSelectedBrand] = useState(marcas[0] || "La Santé");

        return marcasMetadata[selectedBrand] || { logoUrl: "", ejecutivo: "", disenador: "", content: "" };

        if (currentMeta) {
          setLogoUrl(currentMeta.logoUrl || "");

          setContent(currentMeta.content || "");

          nuevaMarca: nuevaMarcaNombre.trim(),

                  />

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

                  <div className="flex gap-2 justify-end mt-2">
                    <button 
                      type="button"
                      onClick={() => setShowAddBrandModal(false)}

                    <button

                    >
                      Crear Cliente
                    </button>
                  </div>
                </form>
              </div>

          )}
        </div>
      );

    // =========================================================================
    // 📝 COMPONENTE: MODAL DE EDICIÓN DE ENTREGABLE (MODAL ESTILO NOTION)
    // =========================================================================
    function ModalEdicionTarea({ tarea, onClose, onSave, listaPersonas, registrarNuevaPersona, marcasDisponibles, isSubmitting }) {
      const [info, setInfo] = useState(tarea.info || "");
      const [categoria, setCategoria] = useState(tarea.categoria || "");
      const [marca, setMarca] = useState(tarea.marca || "");
      const [prioridad, setPrioridad] = useState(tarea.prioridad || "Media");
      const [estado, setEstado] = useState(tarea.estado || "Pendiente");
      const [deadline, setDeadline] = useState(tarea.deadline || "");
      const [personas, setPersonas] = useState(tarea.personas || "");
      const [rawDetalles, setRawDetalles] = useState(tarea.detalles || "");

      const parsed = useMemo(() => parseDetalles(rawDetalles), [rawDetalles]);
      
      const [notes, setNotes] = useState(parsed.notes || parsed.notas);
      const [subtareas, setSubtareas] = useState(parsed.subtareas);
      const [nuevoSubtareaText, setNuevoSubtareaText] = useState("");

      const handleAddSubtarea = (e) => {
        e.preventDefault();
        if (!nuevoSubtareaText.trim()) return;
        const nuevas = [...subtareas, { text: nuevoSubtareaText.trim(), completed: false }];
        setSubtareas(nuevas);
        setNuevoSubtareaText("");
        setRawDetalles(serializeDetalles(notes, nuevas, parsed.historial));
      };

      const handleToggleSubtarea = (index) => {
        const nuevas = [...subtareas];
        nuevas[index].completed = !nuevas[index].completed;
        setSubtareas(nuevas);
        setRawDetalles(serializeDetalles(notes, nuevas, parsed.historial));
      };

      const handleDeleteSubtarea = (index) => {
        const nuevas = subtareas.filter((_, i) => i !== index);
        setSubtareas(nuevas);
        setRawDetalles(serializeDetalles(notes, nuevas, parsed.historial));
      };

      const handleNotasChange = (newNotas) => {
        setNotes(newNotas);
        setRawDetalles(serializeDetalles(newNotas, subtareas, parsed.historial));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const tFinal = serializeDetalles(notes, subtareas, parsed.historial);
        onSave({
          ...tarea,
          info: info.trim(),
          categoria: categoria.trim(),
          marca, prioridad, estado, deadline, personas,
          detalles: tFinal
        });
      };

      return (
        <div className="fixed inset-0 bg-black/10 backdrop-blur-sm z-[150] flex items-center justify-center p-4">
          <div className="bg-white p-6 rounded-md border border-zinc-300 shadow-lg w-full max-w-xl max-h-[90vh] overflow-y-auto animate-zoom-in">
            <div className="flex items-center justify-between border-b pb-2.5 mb-4">
              <div className="flex items-center gap-2">
                <span className="text-[10px] font-mono text-zinc-400 bg-zinc-100 px-2 py-0.5 rounded border">
                  {cleanIdTarea(tarea.idTarea) || "ID AUTOMÁTICO"}
                </span>
                <span className="text-xs font-bold uppercase text-zinc-500 tracking-wider">Entregable</span>
              </div>
              <button 
                onClick={onClose}
                className="text-zinc-400 hover:text-zinc-800 text-lg font-bold"
              >
                &times;
              </button>
            </div>

            <form onSubmit={handleSubmit} className="flex flex-col gap-3.5">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                <div>
                  <label className="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Título del entregable</label>
                  <input 
                    type="text" 
                    required
                    value={info}
                    onChange={(e) => setInfo(e.target.value)}
                    className="w-full bg-zinc-50 border border-zinc-200 px-2.5 py-1.5 text-xs rounded focus:outline-none font-semibold text-[#37352F]"
                  />
                </div>

                <div>
                  <label className="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Categoría</label>
                  <input 
                    type="text" 
                    value={categoria}
                    onChange={(e) => setCategoria(e.target.value)}
                    className="w-full bg-zinc-50 border border-zinc-200 px-2.5 py-1.5 text-xs rounded focus:outline-none font-semibold text-[#37352F]"
                  />
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
                <div>
                  <label className="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Cliente</label>
                  <select 
                    value={marca}
                    onChange={(e) => setMarca(e.target.value)}
                    className="w-full bg-zinc-50 border border-zinc-200 px-2.5 py-1.5 text-xs rounded focus:outline-none font-semibold text-[#37352F] bg-white"
                  >
                    {marcasDisponibles.map(m => (
                      <option key={m} value={m}>{m}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Prioridad</label>
                  <select 
                    value={prioridad}
                    onChange={(e) => setPrioridad(e.target.value)}
                    className="w-full bg-zinc-50 border border-zinc-200 px-2.5 py-1.5 text-xs rounded focus:outline-none font-semibold text-[#37352F] bg-white"
                  >
                    {PRIORIDADES_MAPA.map(p => (
                      <option key={p.id} value={p.id}>{p.label}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Estado</label>
                  <select 
                    value={estado}
                    onChange={(e) => setEstado(e.target.value)}
                    className="w-full bg-zinc-50 border border-zinc-200 px-2.5 py-1.5 text-xs rounded focus:outline-none font-semibold text-[#37352F] bg-white"
                  >
                    {LISTA_ESTADOS_VALIDOS.map(opt => (
                      <option key={opt} value={opt}>{opt}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                <div>
                  <label className="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Fecha de Entrega</label>
                  <input 
                    type="date" 
                    required
                    value={convertirFechaAInput(deadline)}
                    onChange={(e) => setDeadline(e.target.value)}
                    className="w-full bg-zinc-50 border border-zinc-200 px-2.5 py-1.5 text-xs rounded focus:outline-none font-semibold text-[#37352F]"
                  />
                </div>

                <div>
                  <label className="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Miembros Asignados</label>
                  <SelectorPersonasChips 
                    personasSeleccionadas={personas}
                    onChange={setPersonas}
                    listaGlobal={listaPersonas}
                    registrarNuevaPersona={registrarNuevaPersona}
                  />
                </div>
              </div>

              <div className="border-t pt-3">
                <label className="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Notas generales</label>
                <textarea 
                  rows="3"
                  value={notes}
                  onChange={(e) => handleNotasChange(e.target.value)}
                  className="w-full bg-zinc-50 border border-zinc-200 p-2.5 text-xs rounded focus:outline-none font-medium text-[#37352F]"
                  placeholder="Especificaciones o comentarios de apoyo..."
                />

              {/* Checklist de Subtareas */}
              <div className="border-t pt-3 flex flex-col gap-2">
                <span className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Subtareas / Checklist</span>
                <div className="flex flex-col gap-1.5 max-h-36 overflow-y-auto pr-1">
                  {subtareas.length === 0 ? (
                    <span className="text-xs text-zinc-400 italic">Ninguna subtarea registrada</span>
                  ) : (
                    subtareas.map((s, idx) => (
                      <div key={idx} className="flex items-center justify-between p-1.5 rounded bg-[#FAF9F6]/40 border border-zinc-150">

                          <input 
                            type="checkbox" 
                            checked={s.completed} 
                            onChange={() => handleToggleSubtarea(idx)}
                            className="rounded border-zinc-300 text-zinc-900 focus:ring-0"
                          />
                          <span className={s.completed ? "line-through text-zinc-400 font-normal" : "font-semibold text-zinc-700"}>{s.text}</span>
                        </label>
                        <button 
                          type="button"
                          onClick={() => handleDeleteSubtarea(idx)}
                          className="text-zinc-400 hover:text-red-500 transition-colors px-1"
                        >
                          <i className="fa-regular fa-trash-can text-[11px]"></i>
                        </button>
                      </div>
                    ))
                  )}
                </div>
                <div className="flex gap-2">
                  <input 
                    type="text" 
                    placeholder="Nueva subtarea..."
                    value={nuevoSubtareaText}
                    onChange={(e) => setNuevoSubtareaText(e.target.value)}
                    onKeyDown={(e) => { if (e.key === 'Enter') handleAddSubtarea(e); }}
                    className="flex-1 bg-zinc-50 border border-zinc-200 px-3 py-1.5 text-xs rounded focus:outline-none font-medium text-[#37352F]"
                  />
                  <button 
                    type="button"
                    onClick={handleAddSubtarea}
                    className="bg-[#37352F] hover:bg-[#2c2a26] text-white text-xs font-semibold px-4 py-1.5 rounded transition-colors"
                  >
                    Añadir
                  </button>
                </div>
              </div>

              {parsed.historial && parsed.historial.length > 0 && (
                <div className="border-t pt-3">
                  <span className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider block mb-1.5">Bitácora de Cambios</span>
                  <div className="bg-zinc-50 p-2 rounded border border-zinc-200 max-h-24 overflow-y-auto flex flex-col gap-1">
                    {parsed.historial.map((line, idx) => (
                      <p key={idx} className="text-[10px] text-zinc-500 font-medium leading-relaxed">
                        {line}
                      </p>
                    ))}
                  </div>
                </div>
              )}

              <div className="flex justify-end gap-2 pt-3 border-t mt-1">
                <button 
                  type="button" 
                  onClick={onClose}
                  className="px-3 py-1.5 text-xs font-semibold text-zinc-500 hover:text-zinc-800"
                >
                  Cancelar
                </button>
                <button 
                  type="submit" 
                  disabled={isSubmitting}
                  className="px-4 py-1.5 bg-[#37352F] text-white text-xs font-semibold rounded hover:bg-[#2c2a26] disabled:opacity-50"
                >
                  Guardar
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // COMPONENTE PRINCIPAL: APP

    function App() {
      const [usuario, setUsuario] = useState(() => getInicialUsuario());

      const currentTheme = useMemo(() => TEMAS[theme] || TEMAS.notion, [theme]);

      const [tareas, setTareas] = useState([]);
      const [loading, setLoading] = useState(false);
      const [syncing, setSyncing] = useState(false);
      const [toast, setToast] = useState(null);
      const [apiError, setApiError] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);
      
      const [filtroTiempo, setFiltroTiempo] = useState("TODAS"); 
      const [filtroMarca, setFiltroMarca] = useState("TODAS");
      const [filtroEstado, setFiltroEstado] = useState("TODOS");
      const [filtroPrioridad, setFiltroPrioridad] = useState("TODAS"); 
      const [searchQuery, setSearchQuery] = useState("");
      
      const [paginaActiva, setPaginaActiva] = useState(() => {
        const u = getInicialUsuario();
        return u === "admin" ? "configuracion" : "home";
      }); 
      const [vistaModo, setVistaModo] = useState("TABLE"); 

      const [activeTask, setActiveTask] = useState(null);
      const [isEditing, setIsEditing] = useState(false);
      const [taskToDelete, setTaskToDelete] = useState(null);
      const [nuevoUsuarioInput, setNuevoUsuarioInput] = useState("");

      const [nombreCompleto, setNombreCompleto] = useState(() => {
        return getLocalStorageItemSafe("robin_nombre_completo", "");
      });

      const [marcasMetadata, setMarcasMetadata] = useState({});
      const [widgets, setWidgets] = useState([]);

      const [firebaseLib, setFirebaseLib] = useState(null);
      const [usuariosConectados, setUsuariosConectados] = useState([]);

      const [listaPersonas, setListaPersonas] = useState(() => {
        try {
          const guardadas = getLocalStorageItemSafe("robin_personas_v2", null);
          if (guardadas) return JSON.parse(guardadas);
        } catch(e) {}
        return ["@fcolmenares", "@ralvarez", "@dsalavarria", "@mbonilla", "@gnebrus", "@sgiucastro"];
      });

      const [nuevaTarea, setNuevaTarea] = useState({
        marca: "La Santé", categoria: "", info: "", personas: "", detalles: "", estado: "Pendiente", deadline: "", prioridad: "Media"
      });

      // 🚨 UBICACIÓN CORRECTA DE VARIABLES COMPUTADAS Y useMemo (Evita ReferenceError y TDZ)
      const marcasDisponibles = useMemo(() => {
        const marcasUnicas = new Set(tareas.map(t => t.marca).filter(Boolean));
        const marcasEnMetadata = Object.keys(marcasMetadata);
        const defaults = ["La Santé", "DIAGEO", "GAMA", "ROBIN", "TMK"];
        return Array.from(new Set([...defaults, ...marcasEnMetadata, ...marcasUnicas]));
      }, [tareas, marcasMetadata]);

      const tareasFiltradas = useMemo(() => {
        const hoy = new Date();
        const tHoy = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()).getTime();
        
        return tareas.filter(t => {
          const tDeadline = obtenerTiempoFecha(t.deadline);
          
          if (filtroTiempo === "HOY") {
            const tieneFechaReal = tDeadline !== Infinity;
            const esHoy = tieneFechaReal && tDeadline === tHoy;
            const esCompletada = cleanEstado(t.estado) === "completada";
            if (!esHoy || esCompletada) return false;
          } else if (filtroTiempo === "ATRASADAS") {
            const tieneFechaReal = tDeadline !== Infinity;
            const esAtrasada = tieneFechaReal && tDeadline < tHoy;
            const esCompletada = cleanEstado(t.estado) === "completada";
            if (!esAtrasada || esCompletada) return false;
          } else if (filtroTiempo === "FUTURAS") {
            const esFutura = tDeadline !== Infinity && tDeadline > tHoy;
            if (!esFutura) return false;
          }

          if (filtroMarca !== "TODAS" && (t.marca || "").toUpperCase() !== filtroMarca.toUpperCase()) return false;
          if (filtroEstado !== "TODOS" && cleanEstado(t.estado) !== cleanEstado(filtroEstado)) return false;
          if (filtroPrioridad !== "TODAS" && cleanPrioridad(t.prioridad) !== cleanPrioridad(filtroPrioridad)) return false;

          if (searchQuery.trim() !== "") {
            const q = searchQuery.toLowerCase();
            return (
              (t.info || "").toLowerCase().includes(q) ||
              (t.detalles && (t.detalles || "").toLowerCase().includes(q)) ||
              (t.personas && (t.personas || "").toLowerCase().includes(q)) ||
              (t.categoria && (t.categoria || "").toLowerCase().includes(q))
            );
          }

          return true;
        });
      }, [tareas, filtroTiempo, filtroMarca, filtroEstado, filtroPrioridad, searchQuery]);

      const metricaCounters = useMemo(() => {
        const hoy = new Date();
        const tHoy = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()).getTime();
        const activasHoy = tareas.filter(t => {
          const tDeadline = obtenerTiempoFecha(t.deadline);
          return tDeadline !== Infinity && tDeadline === tHoy && cleanEstado(t.estado) !== "completada";
        }).length;

        const atrasadas = tareas.filter(t => {
          const tDeadline = obtenerTiempoFecha(t.deadline);
          return tDeadline !== Infinity && tDeadline < tHoy && cleanEstado(t.estado) !== "completada";
        }).length;
        
        return { activasHoy, atrasadas };
      }, [tareas]);

      const getMarcaStyle = (marcaName) => {
        if (!marcaName) return { bg: "bg-zinc-150", text: "text-zinc-800", border: "border-zinc-200" };
        const clean = marcaName.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
        return MARCAS_COLORES[clean] || { bg: "bg-zinc-100", text: "text-zinc-700", border: "border-zinc-200" };
      };

      // Fin de la zona segura de inicialización
      // =========================================================================

      useEffect(() => {
        if (window.FirebaseLib) {
          setFirebaseLib(window.FirebaseLib);
          return;
        }
        const interval = setInterval(() => {
          if (window.FirebaseLib) {
            setFirebaseLib(window.FirebaseLib);
            clearInterval(interval);
          }
        }, 100);
        return () => clearInterval(interval);
      }, []);

      // Redireccionar al admin restrictivo a configuracion
      useEffect(() => {
        if (usuario === "admin" && paginaActiva !== "configuracion") {
          setPaginaActiva("configuracion");
        }
      }, [usuario, paginaActiva]);

      useEffect(() => {
        if (!usuario || !firebaseLib) return;
        const FirebaseLib = firebaseLib;

        let firebaseConfig = null;
        try {
          if (typeof __firebase_config !== 'undefined' && __firebase_config) {
            firebaseConfig = JSON.parse(__firebase_config);
          }
        } catch (e) {
          console.error("Firebase config parsing error", e);
        }

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'robin-trade-shopper-mkt';
        if (!firebaseConfig) return;

        let heartbeatInterval = null;
        let unsubscribe = null;

        const initPresence = async () => {
          try {
            const app = FirebaseLib.getApps().length === 0 
              ? FirebaseLib.initializeApp(firebaseConfig) 
              : FirebaseLib.getApp();
              
            const auth = FirebaseLib.getAuth(app);
            const db = FirebaseLib.getFirestore(app);

            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await FirebaseLib.signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await FirebaseLib.signInAnonymously(auth);
            }

            const currentUser = auth.currentUser;
            if (!currentUser) return;

            const presenceRef = FirebaseLib.doc(db, 'artifacts', appId, 'public', 'data', 'presencia', currentUser.uid);
            
            const writeHeartbeat = async () => {
              try {
                await FirebaseLib.setDoc(presenceRef, {
                  uid: currentUser.uid,
                  username: usuario,
                  nombre: nombreCompleto || `@${usuario}`,
                  lastSeen: new Date().getTime()
                }, { merge: true });
              } catch (e) {
                console.warn("Heartbeat error", e);
              }
            };

            await writeHeartbeat();
            heartbeatInterval = setInterval(writeHeartbeat, 20000);

            const presenceCollection = FirebaseLib.collection(db, 'artifacts', appId, 'public', 'data', 'presencia');
            unsubscribe = FirebaseLib.onSnapshot(presenceCollection, (snapshot) => {
              const activeUsers = [];
              const now = new Date().getTime();
              snapshot.forEach((doc) => {
                const data = doc.data();
                if (data.lastSeen && (now - data.lastSeen) < 60000) {
                  activeUsers.push(data);
                }
              });
              setUsuariosConectados(activeUsers);
            }, (err) => {
              console.warn("Presence listener warning: ", err);
            });

          } catch (e) {
            console.warn("Firebase Auth / Connection failed", e);
          }
        };

        initPresence();

        return () => {
          if (heartbeatInterval) clearInterval(heartbeatInterval);
          if (unsubscribe) unsubscribe();
        };
      }, [usuario, nombreCompleto, firebaseLib]);

      useEffect(() => {
        const u = getLocalStorageItemSafe("robin_usuario_actual", null);
        if (!u) {
          removeLocalStorageItemSafe("robin_usuario_actual");
          setUsuario(null);
        }
        const n = getLocalStorageItemSafe("robin_nombre_completo", null);
        if (!n) {
          removeLocalStorageItemSafe("robin_nombre_completo");
          setNombreCompleto("");
        }
      }, []);

      useEffect(() => {
        if (usuario) {
          fetchData(false);
        }
      }, [usuario]);

      useEffect(() => {
        if (!usuario) return;
        const autoRefreshInterval = setInterval(() => {
          if (!syncing && !loading && !isSubmitting) {
            fetchData(true); 
          }
        }, 35 * 1000); 
        return () => clearInterval(autoRefreshInterval);
      }, [usuario, syncing, loading, isSubmitting]);

      useEffect(() => {
        if (tareas.length > 0) {
          const detectadas = new Set();
          tareas.forEach(t => {
            if (t.personas) {
              const nombres = t.personas.split(/[\s,]+/);
              nombres.forEach(n => {
                const limpio = n.trim();
                if (limpio.length > 1) {
                  const conArroba = limpio.startsWith("@") ? limpio : "@" + limpio;
                  detectadas.add(conArroba);
                }
              });
            }
          });
          if (detectadas.size > 0) {
            const combinadas = Array.from(new Set([...listaPersonas, ...detectadas]));
            setLocalStorageItemSafe("robin_personas_v2", JSON.stringify(combinadas));
            setListaPersonas(combinadas);
          }
        }
      }, [tareas]);

      const showToast = (msg, type = "success") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      };

      const navegarA = (pagina, extraFn = null) => {
        // Impedir navegación si es un admin puramente de configuración
        if (isConfigOnlyAdmin && pagina !== "configuracion") {
          setPaginaActiva("configuracion");
          showToast("Función restringida para el administrador de ajustes", "info");
          return;
        }
        setPaginaActiva(pagina);
        if (extraFn) extraFn();
        setSidebarOpen(false);
      };

      const handleAddWidget = async (nuevoWidget) => {
        setWidgets([...widgets, nuevoWidget]);
        showToast("Registrando enlace...", "info");

        const effectiveUrl = getEffectiveApiUrl(AUTO_API_URL);
        if (!effectiveUrl || effectiveUrl.includes("your_actual_url_here") || apiError) {
          showToast("Enlace de área añadido localmente", "success");
          return;
        }

        setSyncing(true);
        try {
          await fetch(effectiveUrl, {
            method: "POST", mode: "cors", redirect: "follow",
            headers: { "Content-Type": "text/plain; charset=utf-8" },
            body: JSON.stringify({
              marca: "Config_Marcas",
              idTarea: nuevoWidget.id,
              info: nuevoWidget.titulo,
              detalles: nuevoWidget.link,
              categoria: nuevoWidget.icon,
              personas: nuevoWidget.color,
              campo: "todo"
            })
          });
          showToast("Sincronizado", "success");
          fetchData(true);
        } catch (e) {
          showToast("Error al guardar enlace", "error");
        } finally {
          setSyncing(false);
        }
      };

      const handleDeleteWidget = async (id, titulo) => {
        setWidgets(prev => prev.filter(w => w.id !== id));
        showToast("Eliminando enlace...", "info");

        const effectiveUrl = getEffectiveApiUrl(AUTO_API_URL);
        if (!effectiveUrl || effectiveUrl.includes("your_actual_url_here") || apiError) {
          showToast("Enlace eliminado", "info");
          return;
        }

        setSyncing(true);
        try {
          await fetch(effectiveUrl, {
            method: "POST", mode: "cors", redirect: "follow",
            headers: { "Content-Type": "text/plain; charset=utf-8" },
            body: JSON.stringify({
              marca: "Config_Marcas", idTarea: id, info: titulo, campo: "eliminar"
            })
          });
          showToast("Eliminado", "success");
          fetchData(true);
        } catch (e) {
          showToast("Error al eliminar enlace", "error");
        } finally {
          setSyncing(false);
        }
      };

      const handleSaveNombreCompleto = (e) => {
        e.preventDefault();
        setLocalStorageItemSafe("robin_nombre_completo", nombreCompleto);
        showToast("Nombre guardado", "success");
      };

      const handleThemeChange = (newTheme) => {
        setTheme(newTheme);
        setLocalStorageItemSafe("robin_theme", newTheme);
        showToast(`Tema cambiado`, "success");
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const userClean = e.target.username.value.trim().toLowerCase();
        if (!listaUsuarios.includes(userClean)) {
          setLoginError("Usuario no autorizado.");
          return;
        }
        if (claveInput.toLowerCase() !== "tmk2026") {
          setLoginError("Contraseña incorrecta.");
          return;
        }
        setUsuario(userClean);
        setLocalStorageItemSafe("robin_usuario_actual", userClean);
        setLoginError("");
        if (userClean === "admin") {
          setPaginaActiva("configuracion");
        } else {
          setPaginaActiva("home");
        }
        showToast(`Sesión iniciada: @${userClean}`, "success");
      };

      const handleLogout = () => {
        try {
          removeLocalStorageItemSafe("robin_usuario_actual");
          removeLocalStorageItemSafe("robin_nombre_completo");
          clearLocalStorageSafe(); 
        } catch (e) {
          console.error("Error al limpiar sesión local:", e);
        }
        setUsuario(null);
        setNombreCompleto("");
        setClaveInput("");
        setPaginaActiva("home");
        showToast("Sesión cerrada", "info");
      };

      const handleAddUser = (e) => {
        e.preventDefault();
        const nuevo = nuevoUsuarioInput.trim().toLowerCase();
        if (!nuevo) return;
        if (listaUsuarios.includes(nuevo)) {
          showToast("El usuario ya está registrado", "error");
          return;
        }
        const comb = Array.from(new Set([...listaUsuarios, nuevo]));
        setListaUsuarios(comb);
        setLocalStorageItemSafe("robin_lista_usuarios", JSON.stringify(comb));
        registrarNuevaPersonaGlobal("@" + nuevo);
        setNuevoUsuarioInput("");
        showToast("Usuario autorizado", "success");
      };

      const registrarNuevaPersonaGlobal = (nombreCompleto) => {
        const formateado = pointerString => pointerString.startsWith("@") ? pointerString.trim() : "@" + pointerString.trim();
        const finalName = formateado(nombreCompleto);
        if (finalName.length > 1 && !listaPersonas.includes(finalName)) {
          const actualizadas = [...listaPersonas, finalName];
          setListaPersonas(actualizadas);
          setLocalStorageItemSafe("robin_personas_v2", JSON.stringify(actualizadas));
        }
      };

      const fetchData = async (isBackground = false) => {
        if (!isBackground) setLoading(true);
        setSyncing(true);
        setApiError(null);
        
        const effectiveUrl = getEffectiveApiUrl(AUTO_API_URL);
        if (!effectiveUrl || effectiveUrl.includes("your_actual_url_here")) {
          setTareas([]); 
          if (!isBackground) showToast("Base de datos no configurada", "info");
          setLoading(false);
          setSyncing(false);
          return;
        }

        try {
          const res = await fetch(effectiveUrl, { method: "GET", mode: "cors", redirect: "follow" });
          const json = await res.json();
          if (json.success && json.data) {
            if (json.widgets) {
              setWidgets(json.widgets);
            }

            const tareasValidas = json.data.filter(t => {
              if (!t.info || t.info.toString().trim() === "") return false;
              if (!t.marca || t.marca.toString().trim() === "") return false;
              const cleanM = t.marca.toString().trim().toLowerCase();
              if (cleanM === "pendiente" || cleanM.includes("progreso") || cleanM.includes("seguimiento") || cleanM.includes("revision") || cleanM.includes("pausa") || cleanM.includes("completada") || cleanM === "config_marcas") {
                return false;
              }
              return true;
            });
            
            const deduplicadas = [];
            const seenKeys = new Set();

            tareasValidas.forEach(t => {
              const cleanId = t.idTarea ? String(t.idTarea).trim() : "";
              const hasRealId = isValidIdTarea(cleanId);
              const realId = hasRealId ? cleanId : generarIdDeterminista(t);
              const key = `${t.marca || ""}|${t.info || ""}|${t.deadline || ""}`.toLowerCase().replace(/\s+/g, " ").trim();
              if (!seenKeys.has(key)) {
                seenKeys.add(key);
                deduplicadas.push({ ...t, idTarea: realId, prioridad: t.prioridad || "Media" });
              }
            });

            setTareas(deduplicadas);
            if (json.marcasMetadata) {
              setMarcasMetadata(json.marcasMetadata);
            }
            if (!isBackground) showToast("Sincronizado", "success");
          } else {
            throw new Error(json.error || "Formato de datos erróneo");
          }
        } catch (e) {
          console.error("Sheets sync error", e);
          setApiError("Error de Conexión.");
          setTareas([]); 
          if (!isBackground) showToast("Error de conexión", "error");
        } finally {
          setLoading(false);
          setSyncing(false);
        }
      };

      const handleUpdateField = async (tarea, campo, nuevoValor) => {
        if (!nuevoValor && nuevoValor !== "") return;
        if (isSubmitting || syncing) return;

        const taskTargetId = tarea.idTarea || generateBrandId(tarea.marca);

        let detallesConHistorial = tarea.detalles || "";
        if (campo === "estado") {
          const hoy = new Date();
          const timestamp = `${hoy.getDate()}/${hoy.getMonth() + 1} ${hoy.getHours()}:${String(hoy.getMinutes()).padStart(2, '0')}`;
          const registro = `\n• [${timestamp}] Estado cambiado a "${nuevoValor}" por @${usuario}`;
          detallesConHistorial = detallesConHistorial + registro;
        }

        const temp = tareas.map(t => {
          if ((t.idTarea === tarea.idTarea && t.idTarea) || t.info === tarea.info) {
            return { 
              ...t, 
              idTarea: taskTargetId,
              [campo]: nuevoValor,
              detalles: campo === "estado" ? detallesConHistorial : t.detalles
            };
          }
          return t;
        });
        setTareas(temp);

        const effectiveUrl = getEffectiveApiUrl(AUTO_API_URL);
        if (!effectiveUrl || apiError) {
          showToast("Cambio guardado localmente", "success");
          return;
        }

        setSyncing(true);
        try {
          await fetch(effectiveUrl, {
            method: "POST", mode: "cors", redirect: "follow",
            headers: { "Content-Type": "text/plain; charset=utf-8" },
            body: JSON.stringify({
              marca: tarea.marca, idTarea: taskTargetId, info: tarea.info, categoria: tarea.categoria,
              campo: "todo", valor: nuevoValor, personas: tarea.personas, detalles: detallesConHistorial, 
              estado: campo === "estado" ? nuevoValor : tarea.estado,
              deadline: campo === "deadline" ? nuevoValor : tarea.deadline,
              prioridad: campo === "prioridad" ? nuevoValor : (tarea.prioridad || "Media")
            })
          });
          showToast("Cambios guardados", "success");
          await fetchData(true);
        } catch (e) {
          showToast("Error al sincronizar cambio", "error");
        } finally {
          setSyncing(false);
        }
      };

      const handleSaveTaskModal = async (editedTask) => {
        if (isSubmitting || syncing) return;
        setIsSubmitting(true);

        const index = tareas.findIndex(t => (t.idTarea === editedTask.idTarea && t.idTarea) || t.info === editedTask.info);
        if (index === -1) {
          setIsSubmitting(false);
          return;
        }

        const hoy = new Date();
        const timestamp = `${hoy.getDate()}/${hoy.getMonth() + 1} ${hoy.getHours()}:${String(hoy.getMinutes()).padStart(2, '0')}`;
        let detallesAudoria = editedTask.detalles || "";
        
        const original = tareas[index];
        const cambios = [];
        if (original.info !== editedTask.info) cambios.push("título");
        if (original.categoria !== editedTask.categoria) cambios.push("categoría");
        if (original.personas !== editedTask.personas) cambios.push("asignados");
        if (original.estado !== editedTask.estado) cambios.push(`estado a "${editedTask.estado}"`);
        if (original.deadline !== editedTask.deadline) cambios.push("fecha límite");
        if (original.prioridad !== editedTask.prioridad) cambios.push("prioridad");

        if (cambios.length > 0) {
          detallesAudoria += `\n• [${timestamp}] Editado (${cambios.join(", ")}) por @${usuario}`;
        }

        const taskConHistorial = { ...editedTask, detalles: detallesAudoria };
        const copiaTareas = [...tareas];
        copiaTareas[index] = taskConHistorial;
        setTareas(copiaTareas);
        setIsEditing(false);
        setActiveTask(null);

        const effectiveUrl = getEffectiveApiUrl(AUTO_API_URL);
        if (!effectiveUrl || apiError) {
          showToast("Guardado localmente", "success");
          setIsSubmitting(false);
          return;
        }

        setSyncing(true);
        try {
          await fetch(effectiveUrl, {
            method: "POST", mode: "cors", redirect: "follow",
            headers: { "Content-Type": "text/plain; charset=utf-8" },
            body: JSON.stringify({
              marca: taskConHistorial.marca, idTarea: taskConHistorial.idTarea, info: taskConHistorial.info,
              originalInfo: original.info, categoria: taskConHistorial.categoria, personas: taskConHistorial.personas, 
              detalles: taskConHistorial.detalles, estado: taskConHistorial.estado, deadline: taskConHistorial.deadline, 
              prioridad: taskConHistorial.prioridad || "Media", campo: "todo"
            })
          });
          showToast("Sincronizado", "success");
          await fetchData(true);
        } catch (e) {
          showToast("Guardado local temporal", "error");
        } finally {
          setSyncing(false);
          setIsSubmitting(false);
        }
      };

      const handleDeleteTask = async (tarea) => {
        if (isSubmitting || syncing) return;
        setIsSubmitting(true);

        setTareas(prev => prev.filter(t => !(t.idTarea === tarea.idTarea && t.info === tarea.info)));
        setTaskToDelete(null);
        setIsEditing(false);
        setActiveTask(null);
        showToast("Eliminando...", "info");

        const effectiveUrl = getEffectiveApiUrl(AUTO_API_URL);

          return;
