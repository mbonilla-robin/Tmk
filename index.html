    // Formateador unificado para datepicker input (YYYY-MM-DD) resistente a formatos mixtos
    function convertirFechaAInput(fechaStr) {
      if (!fechaStr) return "";
      let limpia = String(fechaStr).split("T")[0].trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(limpia)) {
        return limpia;
      }
      // Formato DD/MM/YYYY o DD-MM-YYYY
      const match = limpia.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);
      if (match) {
        const [_, dia, mes, anio] = match;
        return `${anio}-${String(mes).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
      }
      // Formato YYYY/MM/DD
      const matchReverse = limpia.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
      if (matchReverse) {
        const [_, anio, mes, dia] = matchReverse;
        return `${anio}-${String(mes).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
      }
      return limpia;
    }

    function cleanEstado(val) {
      if (!val) return "";
      return String(val)
        .replace(/[\u2600-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF]/g, '')
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^\w\s]/gi, '')
        .toLowerCase()
        .trim();
    }

    function isStatusCompleted(estado) {
      if (!estado) return false;
      const clean = cleanEstado(estado);
      return clean === "completada" || clean === "completado";
    }

    function formatearFecha(fechaStr) {
      if (!fechaStr) return "";
      const partes = fechaStr.split("-");
      if (partes.length === 3) {
        return `${partes[2]}/${partes[1]}`;
      }
      return fechaStr.split("T")[0];
    }

    function obtenerTiempoFecha(val) {
      if (!val) return Infinity;
      if (val instanceof Date) {
        return new Date(val.getFullYear(), val.getMonth(), val.getDate()).getTime();
      }
      var str = String(val).trim();
      
      // Controlar fechas con GMT, formato extendido o timezone offset
      if (str.includes("GMT") || str.includes("Venezuela") || str.includes(":") || (isNaN(str[0]) && isNaN(parseInt(str, 10)))) {
        var parsedDate = new Date(str);
        if (!isNaN(parsedDate.getTime())) {
          return new Date(parsedDate.getFullYear(), parsedDate.getMonth(), parsedDate.getDate()).getTime();
        }
      }

      // Remover cualquier componente de tiempo (T00:00:00 o similar)
      str = str.split(/[ T]/)[0].trim();
      var partes = str.split(/[-/]/);
      if (partes.length === 3) {
        var dia, mes, anio;
        if (partes[0].length === 4) {
          anio = parseInt(partes[0], 10); 
          mes = parseInt(partes[1], 10) - 1; 
          dia = parseInt(partes[2], 10);
        } else {
          dia = parseInt(partes[0], 10); 
          mes = parseInt(partes[1], 10) - 1; 
          anio = parseInt(partes[2], 10);
          if (anio < 100) anio += 2000;
        }
        var d = new Date(anio, mes, dia);
        return isNaN(d.getTime()) ? Infinity : d.getTime();
      }
      return Infinity;
    }

    // Comparador unificado de fechas resistente a formatos mixtos (slash vs dash, ISO)
    function sonMismasFechas(d1, d2) {
      if (!d1 || !d2) return false;
      const t1 = obtenerTiempoFecha(d1);
      const t2 = obtenerTiempoFecha(d2);
      return t1 !== Infinity && t2 !== Infinity && t1 === t2;
    }

    // Validador estricto de IDs de tareas reales de la base de datos (Ej: SAN-123, DIA-104)
    function isValidIdTarea(id) {
      if (!id) return false;
      const idStr = String(id).trim().toUpperCase();
      if (idStr.length === 0) return false;
      if (idStr.includes("GMT") || idStr.includes("VENEZUELA") || idStr.includes(":") || idStr.includes(" ")) return false;
      if (idStr === "PENDIENTE" || idStr === "EN PROGRESO" || idStr === "SEGUIMIENTO" || idStr === "EN REVISION" || idStr === "EN PAUSA" || idStr === "COMPLETADA") return false;
      if (/^\d{2}[/-]\d{2}[/-]\d{4}$/.test(idStr) || /^\d{4}[/-]\d{2}[/-]\d{2}$/.test(idStr)) return false;
      return /^[A-Z]{2,4}-\d+$/i.test(idStr);
    }

    // =========================================================================
    // 👥 COMPONENTE: SELECTOR DE PERSONAS MEDIANTE CHIPS INTERACTIVOS
    // =========================================================================
    function SelectorPersonasChips({ personasSeleccionadas, onChange, listaGlobal, registrarNuevaPersona }) {
      const [isOpen, setIsOpen] = useState(false);
      const [busqueda, setBusqueda] = useState("");

      const seleccionadas = useMemo(() => {
        if (!personasSeleccionadas) return [];
        return personasSeleccionadas.split(" ").map(s => s.trim()).filter(s => s.startsWith("@"));
      }, [personasSeleccionadas]);

      const sugeridos = useMemo(() => {
        const q = busqueda.toLowerCase().trim();
        return listaGlobal.filter(p => {
          const coincideQuery = p.toLowerCase().includes(q);
          const yaSeleccionado = seleccionadas.includes(p);
          return coincideQuery && !yaSeleccionado;
        });
      }, [listaGlobal, seleccionadas, busqueda]);

      const togglePersona = (p) => {
        let nuevos;
        if (seleccionadas.includes(p)) {
          nuevos = seleccionadas.filter(item => item !== p);
        } else {
          nuevos = [...seleccionadas, p];
        }
        onChange(nuevos.join(" "));
      };

      const handleAddNuevo = (e) => {
        if (e.key === "Enter" || e.type === "click") {
          e.preventDefault();
          let limpio = busqueda.trim();
          if (limpio.length > 1) {
            const formateado = limpio.startsWith("@") ? limpio : "@" + limpio;
            registrarNuevaPersona(formateado);
            togglePersona(formateado);
            setBusqueda("");
          }
        }
      };

      return (
        <div className="relative w-full text-left">
          <div className="min-h-[38px] w-full bg-zinc-50 border border-zinc-200 rounded-lg p-1.5 flex flex-wrap gap-1 items-center">

              <span key={p} className="inline-flex items-center gap-1 bg-zinc-950 text-white text-xs font-semibold px-2 py-0.5 rounded-md">
                {p}
                <button type="button" onClick={() => togglePersona(p)} className="hover:text-red-300">
                  <i className="fa-solid fa-xmark text-[10px]"></i>
                </button>
              </span>
            ))}
            
            <input 
              type="text" 
              placeholder={seleccionadas.length === 0 ? "Asignar persona..." : ""}
              value={busqueda}
              onChange={(e) => { setBusqueda(e.target.value); setIsOpen(true); }}
              onFocus={() => setIsOpen(true)}
              onKeyDown={handleAddNuevo}
              className="flex-1 bg-transparent border-0 text-xs p-0.5 focus:outline-none focus:ring-0 min-w-[80px]"
            />
            
            <button 
              type="button" 
              onClick={() => setIsOpen(!isOpen)}
              className="text-zinc-400 hover:text-zinc-700 ml-auto px-1.5"
            >
              <i className="fa-solid fa-chevron-down text-[10px]"></i>
            </button>
          </div>

          {isOpen && (
            <div className="absolute z-50 w-full mt-1 bg-white border border-zinc-200 rounded-lg shadow-xl max-h-40 overflow-y-auto p-1.5 animate-zoom-in">
              <div className="px-2 py-1 text-[10px] font-black text-zinc-400 uppercase tracking-wider border-b border-zinc-50">Sugerencias</div>
              {sugeridos.map(p => (
                <button
                  key={p}
                  type="button"
                  onClick={() => { togglePersona(p); setBusqueda(""); }}
                  className="w-full text-left px-2.5 py-1.5 text-xs hover:bg-zinc-50 rounded font-medium text-zinc-700 flex items-center gap-1.5 transition-all"
                >
                  <i className="fa-regular fa-user-circle text-xs text-zinc-400"></i>
                  <span>{p}</span>
                </button>
              ))}
              
              {busqueda.trim().length > 0 && !listaGlobal.includes(busqueda.trim()) && (

                  type="button"

                  className="w-full text-left px-2.5 py-1.5 text-xs hover:bg-zinc-100 text-zinc-900 rounded font-bold border-t border-zinc-100/50 mt-1 flex items-center justify-between"

    }

    // =========================================================================
    // 📋 COMPONENTE: LAYOUT DE TABLA AGRUPADA (Agrupado por Marca, Ordenado por Estado)
    // =========================================================================
    function LayoutTablaAgrupada({ tareas, onUpdateField, onSelectTask, onDeleteTask, getMarcaStyle, filtroTiempo, cleanIdTarea, currentTheme }) {
      
      const tareasAgrupadasPorMarca = useMemo(() => {
        const agrupamiento = {};
        
        tareas.forEach(t => {
          const marcaKey = t.marca || "Otros";
          if (!agrupamiento[marcaKey]) {
            agrupamiento[marcaKey] = [];
          }
          agrupamiento[marcaKey].push(t);
        });

        const PRIORIDADES = {
          "pendiente": 1,
          "en progreso": 2,
          "seguimiento": 3,
          "en revision": 4,
          "en pausa": 5,
          "completada": 99
        };

        Object.keys(agrupamiento).forEach(marca => {
          agrupamiento[marca].sort((a, b) => {
            const estA = cleanEstado(a.estado);
            const estB = cleanEstado(b.estado);
            return (PRIORIDADES[estA] || 50) - (PRIORIDADES[estB] || 50);
          });
        });

        return agrupamiento;
      }, [tareas]);

      const totalTareas = tareas.length;

      return (
        <div className={`border ${currentTheme.border} rounded-xl shadow-sm overflow-hidden animate-slide-in ${currentTheme.cardBg} w-full max-w-full`}>
          <div className="overflow-x-auto w-full block">
            <table className="w-full text-left border-collapse min-w-[800px]">
              <thead>
                <tr className="bg-zinc-50/50 border-b border-zinc-200/65 text-xs font-bold text-zinc-400 uppercase tracking-wider">
                  <th className="py-3.5 px-5 text-center w-24">ID</th>
                  <th className="py-3.5 px-5 w-28">Categoría</th>
                  <th className="py-3.5 px-5">Entregable</th>
                  <th className="py-3.5 px-5 w-36 text-center">Estado</th>
                  <th className="py-3.5 px-5 w-32 text-center">Fecha Límite</th>
                  <th className="py-3.5 px-5 w-32">Asignado</th>
                  <th className="py-3.5 px-5 text-center w-16">Acciones</th>
                </tr>
              </thead>
              <tbody className="text-sm divide-y divide-zinc-150/40">
                {totalTareas === 0 ? (
                  <tr>
                    <td colSpan="7" className="py-20 text-center text-zinc-455 bg-zinc-50/5">
                      <div className="flex flex-col items-center justify-center gap-2 py-6">
                        <i className="fa-regular fa-folder-open text-zinc-300 text-3xl"></i>
                        <p className="font-extrabold text-sm">Sin entregables en esta pestaña</p>
                        <p className="text-xs text-zinc-400 leading-relaxed px-4">
                          {filtroTiempo === "HOY" 
                            ? "No tienes entregables agendados para el día de hoy. Haz clic en 'Todas las Tareas' o 'Atrasadas' en los filtros."
                            : filtroTiempo === "ATRASADAS"
                            ? "¡Excelente! No se registran tareas pendientes con fecha límite vencida."
                            : "Cambia tus filtros o crea un nuevo entregable."
                          }
                        </p>
                      </div>
                    </td>
                  </tr>
                ) : (
                  Object.keys(tareasAgrupadasPorMarca).map(marca => {
                    const tareasDeMarca = tareasAgrupadasPorMarca[marca];
                    const badgeMarcaStyle = getMarcaStyle(marca);

                    return (
                      <React.Fragment key={marca}>
                        <tr className="bg-zinc-100/50 border-y border-zinc-200/30">
                          <td colSpan="7" className="py-3 px-5">
                            <div className="flex items-center gap-3">
                              <span className={`text-[10px] font-black px-2.5 py-1 rounded-md border uppercase tracking-wider ${badgeMarcaStyle.bg} ${badgeMarcaStyle.text} ${badgeMarcaStyle.border}`}>
                                {marca}
                              </span>
                              <span className="text-xs text-zinc-400 font-extrabold uppercase tracking-wider">
                                — {tareasDeMarca.length} {tareasDeMarca.length === 1 ? 'Entregable' : 'Entregables'}
                              </span>
                            </div>
                          </td>
                        </tr>

                        {tareasDeMarca.map(t => {
                          const cEstado = ESTADOS_MAPA.find(e => cleanEstado(e.id) === cleanEstado(t.estado)) || { color: "text-zinc-700", dot: "bg-zinc-300" };
                          const displayId = cleanIdTarea(t.idTarea);
                          
                          return (
                            <tr 
                              key={t.idTarea + t.info} 
                              onClick={() => onSelectTask(t)}
                              className="hover:bg-zinc-50/40 transition-all cursor-pointer border-b border-zinc-100"
                            >
                              <td className="py-4 px-5 font-mono text-xs text-zinc-455 font-bold text-center">
                                {displayId || "---"}
                              </td>
                              
                              <td className="py-4 px-5 text-zinc-500 font-bold text-xs truncate max-w-[110px]">
                                {t.categoria || "---"}
                              </td>

                              <td className="py-4 px-5">
                                <div className="max-w-md">
                                  <p className="font-bold leading-snug">{t.info}</p>
                                  {t.detalles && (
                                    <p className="text-xs text-zinc-400 truncate mt-1 font-semibold leading-normal">
                                      {t.detalles.split('\n')[0]}
                                    </p>
                                  )}
                                </div>
                              </td>

                              <td className="py-4 px-5 text-center" onClick={(e) => e.stopPropagation()}>
                                <div className="flex items-center justify-center gap-2">
                                  <span className={`w-2 h-2 rounded-full ${cEstado.dot}`}></span>
                                  <select
                                    value={t.estado}
                                    onChange={(e) => onUpdateField(t, "estado", e.target.value)}
                                    className="text-xs font-bold py-1 bg-transparent border-0 cursor-pointer focus:outline-none focus:ring-0 text-zinc-655 font-sans"
                                  >
                                    {LISTA_ESTADOS_VALIDOS.map(opt => (
                                      <option key={opt} value={opt} className="bg-white text-zinc-855">
                                        {opt.substring(opt.indexOf(" ") + 1)}
                                      </option>
                                    ))}
                                  </select>
                                </div>
                              </td>

                              <td className="py-4 px-5 text-center" onClick={(e) => e.stopPropagation()}>
                                <input
                                  type="date"
                                  value={convertirFechaAInput(t.deadline)}
                                  onChange={(e) => {
                                    const val = e.target.value;
                                    if (val && val.length === 10) {
                                      onUpdateField(t, "deadline", val);
                                    }
                                  }}
                                  className="bg-transparent border-0 rounded-lg py-1 px-1 text-xs font-bold text-zinc-500 focus:outline-none w-28 text-center"
                                />
                              </td>

                              <td className="py-4 px-5 text-zinc-555 font-bold text-xs">
                                <span className="truncate max-w-[90px] block">{t.personas || "Sin asignar"}</span>
                              </td>

                              <td className="py-4 px-5 text-center" onClick={(e) => e.stopPropagation()}>
                                <button
                                  onClick={() => onDeleteTask(t)}
                                  title="Eliminar entregable"
                                  className="p-2 text-zinc-400 hover:text-red-500 rounded-lg hover:bg-red-50/40 transition-all text-xs"
                                >
                                  <i className="fa-regular fa-trash-can"></i>
                                </button>
                              </td>

                            </tr>
                          );
                        })}
                      </React.Fragment>
                    );
                  })
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 🗂️ COMPONENTE: LAYOUT KANBAN (CON SOPORTE DRAG & DROP INTERACTIVO REAL)
    // =========================================================================
    function LayoutKanban({ tareas, onUpdateField, onSelectTask, onDeleteTask, getMarcaStyle, cleanIdTarea, currentTheme }) {
      const [dragOverCol, setDragOverColumn] = useState(null);

      const handleDragStart = (e, task) => {
        e.dataTransfer.setData("taskId", task.idTarea || "");
        e.dataTransfer.setData("taskInfo", task.info || "");
        e.dataTransfer.effectAllowed = "move";
      };

      const handleDrop = (e, targetEstado) => {
        e.preventDefault();
        setDragOverColumn(null);
        const taskId = e.dataTransfer.getData("taskId");
        const taskInfo = e.dataTransfer.getData("taskInfo");

        const taskMatched = tareas.find(t => (t.idTarea === taskId && taskId) || t.info === taskInfo);
        if (taskMatched && cleanEstado(taskMatched.estado) !== cleanEstado(targetEstado)) {
          onUpdateField(taskMatched, "estado", targetEstado);
        }
      };

      return (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4 items-start h-full animate-slide-in">
          {ESTADOS_MAPA.map(col => {
            const tareasColumna = tareas.filter(t => cleanEstado(t.estado) === cleanEstado(col.id));
            const isOverThis = dragOverCol === col.id;
            
            return (
              <div 
                key={col.id} 
                onDragOver={(e) => { e.preventDefault(); setDragOverColumn(col.id); }}
                onDragLeave={() => setDragOverColumn(null)}
                onDrop={(e) => handleDrop(e, col.id)}
                className={`border p-3 rounded-xl flex flex-col gap-3 min-h-[300px] md:min-h-[500px] transition-all ${
                  isOverThis ? 'border-dashed border-zinc-400 bg-zinc-100/30' : currentTheme.border
                } ${currentTheme.cardBg}`}
              >
                <div className="flex items-center justify-between pb-2 border-b border-zinc-200/60">
                  <span className="text-xs font-black text-zinc-400 uppercase tracking-wider flex items-center gap-2">
                    <span className={`w-2.5 h-2.5 rounded-full ${col.dot}`}></span>
                    {col.id.substring(col.id.indexOf(" ") + 1)}
                  </span>
                  <span className="text-xs px-2 py-0.5 rounded-full bg-zinc-200/60 text-zinc-655 font-bold">{tareasColumna.length}</span>
                </div>

                <div className="flex flex-col gap-2.5 overflow-y-auto max-h-[520px]">
                  {tareasColumna.length === 0 ? (
                    <div className="text-center py-8 text-zinc-400 text-xs font-semibold">
                      Sin entregables
                    </div>
                  ) : (
                    tareasColumna.map(t => {
                      const cMarca = getMarcaStyle(t.marca);
                      const displayId = cleanIdTarea(t.idTarea);
                      
                      const avanzarEstado = (e) => {
                        e.stopPropagation();
                        const index = ESTADOS_MAPA.findIndex(e => cleanEstado(e.id) === cleanEstado(t.estado));
                        const nextIndex = (index + 1) % ESTADOS_MAPA.length;
                        onUpdateField(t, "estado", ESTADOS_MAPA[nextIndex].id);
                      };

                      return (
                        <div 
                          key={t.idTarea + t.info}
                          draggable={true}
                          onDragStart={(e) => handleDragStart(e, t)}
                          onClick={() => onSelectTask(t)}
                          className={`${currentTheme.bg} p-4 rounded-xl border ${currentTheme.border} shadow-sm hover:shadow-md hover:border-zinc-400 cursor-grab active:cursor-grabbing transition-all flex flex-col gap-2 animate-zoom-in`}
                        >
                          <div className="flex items-center justify-between">
                            <span className={`text-[9px] font-black px-1.5 py-0.5 rounded uppercase tracking-wider border ${cMarca.bg} ${cMarca.text} ${cMarca.border}`}>
                              {t.marca || "Otros"}
                            </span>
                            {displayId && (
                              <span className="text-[10px] font-mono text-zinc-400 font-bold">{displayId}</span>
                            )}
                          </div>

                          <h4 className="text-sm font-bold leading-snug line-clamp-3">{t.info}</h4>

                          <div className="border-t border-zinc-200/50 pt-2 flex items-center justify-between text-xs font-bold text-zinc-400">
                            <span className="truncate max-w-[100px]">{t.personas || "Sin asignar"}</span>
                            <span className="font-semibold">{t.deadline ? formatearFecha(t.deadline) : "--/--"}</span>
                          </div>

                          <div className="flex items-center gap-1.5 mt-1 pt-1.5 border-t border-zinc-200/50">
                            <button 
                              onClick={avanzarEstado}
                              className="flex-1 text-center py-1 bg-zinc-100 hover:bg-zinc-200/80 text-zinc-655 font-bold text-[9px] rounded-lg border border-zinc-200/50 uppercase tracking-wider transition-all"
                            >
                              Siguiente
                            </button>
                            <button
                              onClick={(e) => { e.stopPropagation(); onDeleteTask(t); }}
                              title="Eliminar entregable"
                              className="p-1 text-zinc-400 hover:text-red-500 rounded-lg hover:bg-red-50/40 transition-all text-xs"
                            >
                              <i className="fa-regular fa-trash-can"></i>
                            </button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>

              </div>
            );
          })}
        </div>
      );
    }

    // =========================================================================
    // 📅 COMPONENTE: LAYOUT DE CALENDARIO
    // =========================================================================
    function LayoutCalendario({ tareas, onUpdateField, onSelectTask, currentTheme }) {
      const [currentDate, setCurrentDate] = useState(new Date()); 

      const diasDelMes = useMemo(() => {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        
        let primerDiaSemana = new Date(year, month, 1).getDay();
        primerDiaSemana = primerDiaSemana === 0 ? 6 : primerDiaSemana - 1;
        
        const totalDias = new Date(year, month + 1, 0).getDate();
        const dias = [];
        
        for (let i = 0; i < primerDiaSemana; i++) {
          dias.push({ dia: null, fechaStr: null });
        }
        
        for (let d = 1; d <= totalDias; d++) {
          const m = String(month + 1).padStart(2, '0');
          const diaStr = String(d).padStart(2, '0');
          dias.push({
            dia: d,
            fechaStr: `${year}-${m}-${diaStr}`
          });
        }
        return dias;
      }, [currentDate]);

      const navegarMes = (offset) => {
        setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + offset, 1));
      };

      const nombresMeses = [
        "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
        "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
      ];

      return (
        <div className={`border ${currentTheme.border} rounded-xl p-3 md:p-5 flex flex-col gap-4 h-full overflow-hidden animate-slide-in ${currentTheme.cardBg}`}>
          <div className="flex items-center justify-between pb-2 border-b border-zinc-200/50 shrink-0">
            <h3 className="font-extrabold text-xs md:text-sm">
              {nombresMeses[currentDate.getMonth()]} {currentDate.getFullYear()}
            </h3>
            
            <div className="flex items-center gap-1 bg-zinc-50 p-1 rounded-lg border border-zinc-200">
              <button onClick={() => navegarMes(-1)} className="hover:bg-white text-zinc-655 p-1 rounded-md text-[10px] md:text-xs">
                <i className="fa-solid fa-chevron-left px-1"></i>
              </button>
              <button onClick={() => setCurrentDate(new Date())} className="hover:bg-white text-zinc-800 px-2 md:px-3 py-0.5 rounded-md text-[10px] md:text-xs font-bold">
                Hoy
              </button>
              <button onClick={() => navegarMes(1)} className="hover:bg-white text-zinc-655 p-1 rounded-md text-[10px] md:text-xs">
                <i className="fa-solid fa-chevron-right px-1"></i>
              </button>
            </div>
          </div>

          <div className="flex-1 overflow-y-auto pr-1">
            <div className="grid grid-cols-7 gap-1.5">
              {["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"].map(d => (
                <div key={d} className="text-center font-black text-zinc-400 text-[10px] md:text-xs uppercase tracking-wider py-1 border-b border-zinc-200/30">
                  {d}
                </div>
              ))}

              {diasDelMes.map((cell, index) => {
                const tareasDia = cell.fechaStr ? tareas.filter(t => sonMismasFechas(t.deadline, cell.fechaStr)) : [];
                const esHoy = cell.fechaStr === new Date().toISOString().split('T')[0];

                return (
                  <div 
                    key={index}
                    className={`min-h-[65px] md:min-h-[120px] border border-zinc-150/40 rounded-xl p-1 md:p-2 flex flex-col gap-1.5 transition-all ${
                      cell.dia 
                        ? esHoy 
                          ? 'bg-zinc-50/50 border-zinc-900 shadow-sm' 
                          : `${currentTheme.bg} hover:bg-zinc-100/50` 
                        : 'bg-zinc-50/10 opacity-20 pointer-events-none'
                    }`}
                  >
                    {cell.dia && (
                      <div className="flex items-center justify-between">
                        <span className={`text-[10px] md:text-[11px] font-extrabold w-4 h-4 md:w-5 md:h-5 flex items-center justify-center rounded-full ${
                          esHoy ? 'bg-zinc-900 text-white font-black' : 'text-zinc-400'
                        }`}>
                          {cell.dia}
                        </span>
                      </div>
                    )}

                    <div className="flex flex-col gap-1 overflow-y-auto max-h-[35px] md:max-h-[80px]">
                      {tareasDia.map(t => {
                        const esAlerta = cleanEstado(t.estado) === "en revision" || cleanEstado(t.estado) === "en pausa";
                        return (
                          <div
                            key={t.idTarea + t.info}
                            onClick={() => onSelectTask(t)}
                            className={`p-1 rounded-md text-[8px] md:text-[10px] font-extrabold border truncate cursor-pointer transition-colors block w-full text-left shrink-0 ${
                              esAlerta 
                                ? 'bg-orange-50 border-orange-200 text-orange-850 hover:bg-orange-100' 
                                : 'bg-zinc-100/70 border-zinc-200 text-zinc-800 hover:bg-zinc-200'
                            }`}
                            title={`${t.marca}: ${t.info}`}
                          >
                            <span className="text-[7px] md:text-[8px] uppercase tracking-wider block opacity-60 font-black">{t.marca}</span>
                            <span className="block truncate mt-0.5">{t.info}</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // COMPONENTE: MODAL FICHA DE SEGUIMIENTO (DRAWER LATERAL)
    // =========================================================================
    function ModalEdicionTarea({ task, onClose, onSave, onDeleteClick, marcasDisponibles, listaPersonas, registrarNuevaPersona, cleanIdTarea }) {
      const [categoria, setCategoria] = useState(task.categoria || "");
      const [info, setInfo] = useState(task.info || "");
      const [personas, setPersonas] = useState(task.personas || "");
      const [detalles, setDetalles] = useState(task.detalles || "");
      const [estado, setEstado] = useState(task.estado || "⚪ Pendiente");
      const [deadline, setDeadline] = useState(task.deadline || "");
      
      const [nuevoStatus, setNuevoStatus] = useState("");
      const [isSubmittingLocal, setIsSubmittingLocal] = useState(false);

      const valorDeadline = useMemo(() => convertirFechaAInput(deadline), [deadline]);

      const parseDetallesYHistorial = useMemo(() => {
        const lineas = detalles.split('\n');
        const notasLimpias = [];
        const logs = [];

        lineas.forEach(line => {
          if (line.trim().startsWith("•") || line.trim().startsWith("• [")) {
            logs.push(line.trim());
          } else if (line.trim() !== "") {
            notes: notasLimpias.push(line);
          }
        });

        return {
          notas: notasLimpias.join('\n'),
          historial: logs
        };
      }, [detalles]);

      const handleAgregarStatus = () => {
        if (!nuevoStatus.trim() || isSubmittingLocal) return;
        const hoy = new Date();
        const timestamp = `${hoy.getDate()}/${hoy.getMonth() + 1} ${hoy.getHours()}:${String(hoy.getMinutes()).padStart(2, '0')}`;
        const actualizacion = `• [${timestamp}] ${nuevoStatus.trim()} por @${localStorage.getItem("robin_usuario_actual")}`;
        const nuevosDetalles = detalles ? `${detalles.trim()}\n${actualizacion}` : actualizacion;
        
        setDetalles(nuevosDetalles);
        setNuevoStatus("");
        
        onSave({
          ...task,
          categoria,
          info,
          personas,
          detalles: nuevosDetalles,
          estado,
          deadline
        });
      };

      const handleFormSubmit = async (e) => {
        e.preventDefault();
        if (isSubmittingLocal) return;
        setIsSubmittingLocal(true);
        try {
          await onSave({
            ...task,
            categoria,
            info,
            personas,
            detalles,
            estado,
            deadline
          });
        } finally {
          setIsSubmittingLocal(false);
        }
      };

      const cleanedId = cleanIdTarea(task.idTarea);

      return (
        <div className="fixed inset-0 bg-zinc-950/20 backdrop-blur-[1px] z-[120] flex items-center justify-end">
          <div className="absolute inset-0" onClick={onClose}></div>
          
          <div className="relative bg-white h-full border-l border-zinc-200 shadow-2xl max-w-md w-full flex flex-col overflow-hidden animate-slide-in">
            <div className="bg-zinc-50/55 px-5 py-4 border-b border-zinc-200 flex items-center justify-between">
              <div className="flex flex-col">
                <span className="text-[10px] font-black text-zinc-400 uppercase tracking-widest">Ficha de Seguimiento</span>
                {cleanedId && <span className="text-[11px] font-mono text-zinc-500 font-bold mt-0.5">{cleanedId}</span>}
              </div>
              <button type="button" onClick={onClose} className="text-zinc-400 hover:text-zinc-800 text-sm p-1">
                <i className="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            <form onSubmit={handleFormSubmit} className="p-6 flex flex-col gap-4 flex-1 overflow-y-auto text-zinc-800 font-sans">
              <div>
                <label className="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-1">Marca</label>
                <select 
                  value={task.marca} 
                  disabled
                  className="w-full bg-zinc-100 p-2 text-xs rounded-lg border-0 font-bold text-zinc-500 focus:outline-none bg-white"
                >
                  {marcasDisponibles.map(m => (
                    <option key={m} value={m}>{m}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-1">Categoría</label>
                <input type="text" value={categoria} onChange={(e) => setCategoria(e.target.value)} className="w-full bg-zinc-50 border border-zinc-200 p-2 text-sm rounded-lg focus:outline-none focus:ring-1 focus:ring-zinc-950 font-bold text-zinc-700" />
              </div>

              <div>
                <label className="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-1">Título / Entregable</label>
                <input type="text" required value={info} onChange={(e) => setInfo(e.target.value)} className="w-full bg-zinc-50 border border-zinc-200 p-2 text-sm rounded-lg font-bold text-zinc-855 focus:outline-none focus:ring-1 focus:ring-zinc-950" />
              </div>

              <div>
                <label className="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-1">Asignados</label>
                <SelectorPersonasChips 
                  personasSeleccionadas={personas} 
                  onChange={(nuevas) => setPersonas(nuevas)}
                  listaGlobal={listaPersonas}
                  registrarNuevaPersona={registrarNuevaPersona}
                />
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-1">Estado</label>
                  <select value={estado} onChange={(e) => setEstado(e.target.value)} className="w-full bg-zinc-50 border border-zinc-200 p-2 text-xs rounded-lg focus:outline-none focus:ring-1 focus:ring-zinc-950 bg-white font-black text-zinc-755">
                    {LISTA_ESTADOS_VALIDOS.map(opt => (
                      <option key={opt} value={opt}>{opt}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-1">Fecha límite</label>
                  <input type="date" value={valorDeadline} onChange={(e) => setDeadline(e.target.value)} className="w-full bg-zinc-50 border border-zinc-200 p-2 text-xs rounded-lg focus:outline-none focus:ring-1 focus:ring-zinc-950 font-bold" />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-1">Descripción y Notas</label>
                <textarea 
                  value={parseDetallesYHistorial.notas} 
                  onChange={(e) => {
                    const nuevoContenido = e.target.value;
                    const logs = parseDetallesYHistorial.historial.join('\n');
                    setDetalles(logs ? `${nuevoContenido.trim()}\n\n${logs}` : nuevoContenido);
                  }} 
                  rows="3"
                  placeholder="Instrucciones del entregable..."
                  className="w-full bg-zinc-50 border border-zinc-200 p-2 text-xs rounded-lg focus:outline-none focus:ring-1 focus:ring-zinc-950 resize-none font-semibold text-zinc-700"
                ></textarea>
              </div>

              {parseDetallesYHistorial.historial.length > 0 && (
                <div className="border-t border-zinc-100 pt-3">
                  <label className="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-2">Historial de Registros</label>
                  <div className="bg-zinc-50 border border-zinc-155 p-2.5 rounded-lg max-h-36 overflow-y-auto flex flex-col gap-1.5">
                    {parseDetallesYHistorial.historial.map((log, lIdx) => (
                      <div key={lIdx} className="text-[10px] text-zinc-500 font-mono font-bold leading-normal border-b border-zinc-100/50 pb-1 last:border-0 last:pb-0">
                        {log}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div className="bg-zinc-50 p-3 rounded-xl border border-zinc-200">
                <label className="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Añadir Registro Rápido</label>
                <div className="flex gap-1.5">
                  <input 
                    type="text" 
                    placeholder="Avance o comentario nuevo..." 
                    value={nuevoStatus} 
                    onChange={(e) => setNuevoStatus(e.target.value)} 
                    className="flex-1 bg-white border border-zinc-200 rounded-lg px-2.5 py-1.5 text-xs focus:outline-none"
                    onKeyDown={(e) => {
                      if (e.key === 'Enter') {
                        e.preventDefault();
                        handleAgregarStatus();
                      }
                    }}
                  />
                  <button 
                    type="button" 
                    onClick={handleAgregarStatus} 
                    disabled={!nuevoStatus.trim()}
                    className="bg-zinc-900 hover:bg-black text-white px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all shrink-0 disabled:opacity-50"
                  >
                    Registrar
                  </button>
                </div>
              </div>

              <div className="flex items-center justify-between gap-1.5 pt-4 border-t border-zinc-150 mt-auto">
                <button 
                  type="button" 
                  onClick={() => onDeleteClick(task)}
                  className="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-655 font-bold text-xs rounded-lg transition-all border border-red-200/50"
                >
                  <i className="fa-regular fa-trash-can mr-1.5"></i>Eliminar
                </button>
                <div className="flex items-center gap-1.5">
                  <button type="button" onClick={onClose} className="px-3.5 py-1.5 bg-zinc-100 hover:bg-zinc-200 text-zinc-700 font-bold text-xs rounded-lg transition-all">
                    Cerrar
                  </button>
                  <button type="submit" className="px-4 py-1.5 bg-zinc-900 hover:bg-black text-white font-bold text-xs rounded-lg transition-all shadow-sm">
                    Guardar
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 🏠 COMPONENTE: LAYOUT HOME DASHBOARD EN VIVO
    // =========================================================================
    function LayoutHome({ tareas, nombreUsuario, username, onSelectTask, onUpdateField, widgets, onAddWidget, onDeleteWidget, currentTheme, getMarcaStyle }) {
      const [nuevoTitulo, setNuevoTitulo] = useState("");
      const [nuevoLink, setNuevoLink] = useState("");
      const [nuevoIcon, setNuevoIcon] = useState("fa-link");
      const [nuevoColor, setNuevoColor] = useState("bg-indigo-500");
      const [showAddForm, setShowAddForm] = useState(false);

      const [plannerSelectedDay, setPlannerSelectedDay] = useState(() => {
        return new Date().toISOString().split('T')[0];
      });

      const isAdmin = username === "admin";
      const saludoNombre = nombreUsuario && nombreUsuario !== "null" ? nombreUsuario : `@${username}`;

      const tareasDeHoy = useMemo(() => {
        const hoy = new Date();
        const tHoy = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()).getTime();

        return tareas.filter(t => {
          const tDeadline = obtenerTiempoFecha(t.deadline);
          const esHoy = tDeadline === tHoy;
          const noCompletada = !isStatusCompleted(t.estado);
          return esHoy && noCompletada;
        })
        .sort((a, b) => {
          const PRIORIDADES = { "pendiente": 1, "en progreso": 2, "seguimiento": 3, "en revision": 4, "en pausa": 5 };
          return (PRIORIDADES[cleanEstado(a.estado)] || 50) - (PRIORIDADES[cleanEstado(b.estado)] || 50);
        })
        .slice(0, 5);
      }, [tareas]);

      const handleSubmitWidget = (e) => {
        e.preventDefault();
        if (!nuevoTitulo.trim() || !nuevoLink.trim()) return;
        
        onAddWidget({
          id: `WID-${Date.now()}`,
          titulo: nuevoTitulo.trim(),
          link: nuevoLink.trim(),
          icon: nuevoIcon,
          color: nuevoColor
        });

        setNuevoTitulo("");
        setNuevoLink("");
        setShowAddForm(false);
      };

      const hoy = new Date();
      const diasMes = useMemo(() => {
        const year = hoy.getFullYear();
        const month = hoy.getMonth();
        let primerDia = new Date(year, month, 1).getDay();
        primerDia = primerDia === 0 ? 6 : primerDia - 1;
        const total = new Date(year, month + 1, 0).getDate();
        
        const cDias = [];
        for (let i = 0; i < primerDia; i++) cDias.push(null);
        for (let d = 1; d <= total; d++) {
          const m = String(month + 1).padStart(2, '0');
          const diaStr = String(d).padStart(2, '0');
          cDias.push({ dia: d, fechaStr: `${year}-${m}-${diaStr}` });
        }
        return cDias;
      }, []);

      const tareasDelDiaSeleccionadoInPlanner = useMemo(() => {
        if (!plannerSelectedDay) return [];
        return tareas.filter(t => sonMismasFechas(t.deadline, plannerSelectedDay));
      }, [tareas, plannerSelectedDay]);

      const nombresMeses = [
        "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
        "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
      ];

      return (
        <div className="flex flex-col gap-5 md:gap-6 animate-slide-in pb-12 w-full max-w-full overflow-hidden">
          
          <div className={`p-4 md:p-6 rounded-2xl border ${currentTheme.border} ${currentTheme.cardBg} flex justify-between items-center shadow-sm`}>
            <div>
              <h2 className="text-lg md:text-xl font-black tracking-tight text-zinc-900">¡Hola, {saludoNombre}! 👋</h2>
              <p className="text-[11px] md:text-xs text-zinc-455 font-semibold mt-1">Este es el resumen general de actividades del área de Trade & Shopper Marketing.</p>
            </div>
            <div className="hidden md:block">
              <span className="text-[10px] font-black uppercase tracking-widest text-zinc-400 bg-zinc-100 px-3 py-1 rounded-full">
                {new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })}
              </span>
            </div>
          </div>

          <div className="flex flex-col gap-3">
            <div className="flex justify-between items-center">
              <span className="text-[10px] md:text-xs font-black uppercase tracking-widest text-zinc-400">Accesos y Herramientas del Área</span>
              {isAdmin && (
                <button 
                  onClick={() => setShowAddForm(!showAddForm)}
                  className="text-xs font-black text-indigo-600 hover:text-indigo-800 flex items-center gap-1 transition-all"
                >
                  <i className="fa-solid fa-plus-circle"></i> Administrar Accesos
                </button>
              )}
            </div>

            {showAddForm && isAdmin && (
              <form onSubmit={handleSubmitWidget} className={`p-4 rounded-xl border ${currentTheme.border} ${currentTheme.cardBg} flex flex-wrap gap-3 items-end animate-zoom-in`}>
                <div className="flex-1 min-w-[150px]">
                  <label className="block text-[9px] font-bold text-zinc-455 uppercase mb-1">Título</label>
                  <input type="text" required value={nuevoTitulo} onChange={e => setNuevoTitulo(e.target.value)} className="w-full bg-zinc-50 border p-1.5 text-xs rounded-lg" placeholder="AnyDesk, Solicitudes, etc..." />
                </div>
                <div className="flex-1 min-w-[200px]">
                  <label className="block text-[9px] font-bold text-zinc-455 uppercase mb-1">Link URL</label>
                  <input type="url" required value={nuevoLink} onChange={e => setNewLink(e.target.value)} className="w-full bg-zinc-50 border p-1.5 text-xs rounded-lg" placeholder="https://..." />
                </div>
                <div>
                  <label className="block text-[9px] font-bold text-zinc-455 uppercase mb-1">Color</label>
                  <select value={nuevoColor} onChange={e => setNewColor(e.target.value)} className="bg-zinc-50 border p-1.5 text-xs rounded-lg font-bold">
                    <option value="bg-indigo-500">Azul Indigo</option>
                    <option value="bg-emerald-500">Verde Esmeralda</option>
                    <option value="bg-rose-500">Rojo Carmesí</option>
                    <option value="bg-amber-500">Ámbar</option>
                    <option value="bg-stone-850">Negro Charcoal</option>
                  </select>
                </div>
                <div className="flex gap-1.5">
                  <button type="submit" className="bg-zinc-900 text-white font-bold text-xs py-2 px-3 rounded-lg hover:bg-black">Agregar</button>
                  <button type="button" onClick={() => setShowAddForm(false)} className="bg-zinc-100 text-zinc-700 font-bold text-xs py-2 px-3 rounded-lg">Cerrar</button>
                </div>
              </form>
            )}

            {widgets.length === 0 ? (
              <div className="text-center py-8 border border-dashed border-zinc-200 rounded-xl text-zinc-400 text-xs font-semibold">
                No hay accesos online configurados. {isAdmin && "Usa el botón de arriba para registrar accesos importantes."}
              </div>
            ) : (
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
                {widgets.map(w => (
                  <div key={w.id} className="relative group">
                    <a 
                      href={w.link} 
                      target="_blank" 
                      rel="noopener noreferrer"
                      className={`flex items-center gap-3 p-3 rounded-xl border ${currentTheme.border} ${currentTheme.cardBg} hover:shadow-md transition-all h-full`}
                    >
                      <div className={`w-8 h-8 rounded-lg ${w.color} text-white flex items-center justify-center text-xs shrink-0 shadow-sm`}>
                        <i className={`fa-solid ${w.icon || "fa-link"}`}></i>
                      </div>
                      <span className="text-[11px] md:text-xs font-bold truncate pr-3">{w.titulo}</span>
                    </a>
                    {isAdmin && (
                      <button 
                        onClick={() => onDeleteWidget(w.id, w.titulo)}
                        className="absolute -top-1.5 -right-1.5 bg-red-500 hover:bg-red-700 text-white w-4 h-4 rounded-full flex items-center justify-center text-[8px] opacity-0 group-hover:opacity-100 transition-all shadow shadow-black/25"
                      >
                        <i className="fa-solid fa-xmark"></i>
                      </button>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <div className="lg:col-span-7 flex flex-col gap-3">
              <span className="text-[10px] md:text-xs font-black uppercase tracking-widest text-zinc-400">5 Tareas Clave de Hoy</span>
              <div className={`border ${currentTheme.border} rounded-2xl p-4 md:p-5 flex flex-col gap-3 ${currentTheme.cardBg}`}>
                {tareasDeHoy.length === 0 ? (
                  <div className="py-12 text-center text-zinc-455 flex flex-col items-center gap-2">
                    <i className="fa-regular fa-calendar-check text-2xl text-emerald-500"></i>
                    <p className="text-xs font-bold">¡Estás al día por hoy!</p>
                    <p className="text-[10px] text-zinc-400">No hay entregables prioritarios pendientes para hoy.</p>
                  </div>
                ) : (
                  tareasDeHoy.map(t => {
                    const cMarca = getMarcaStyle(t.marca);
                    const cEstado = ESTADOS_MAPA.find(e => cleanEstado(e.id) === cleanEstado(t.estado)) || { color: "text-zinc-655", dot: "bg-zinc-455" };

                    return (
                      <div 
                        key={t.idTarea + t.info}
                        onClick={() => onSelectTask(t)}
                        className={`p-3 rounded-xl border ${currentTheme.border} ${currentTheme.bg} hover:border-zinc-400 transition-all cursor-pointer flex items-center justify-between gap-3`}
                      >
                        <div className="flex flex-col gap-1 overflow-hidden">
                          <div className="flex items-center gap-2">
                            <span className={`text-[8px] font-black px-1.5 py-0.5 rounded border uppercase tracking-wider ${cMarca.bg} ${cMarca.text} ${cMarca.border}`}>
                              {t.marca}
                            </span>
                            {t.idTarea && <span className="text-[9px] font-mono text-zinc-400 font-bold">{t.idTarea}</span>}
                          </div>
                          <span className="text-xs font-extrabold truncate text-zinc-800">{t.info}</span>
                        </div>
                        <div className="flex items-center gap-3 shrink-0" onClick={e => e.stopPropagation()}>
                          <div className="flex items-center gap-1.5 bg-white border px-2 py-0.5 rounded-lg text-[10px] font-bold">
                            <span className={`w-1.5 h-1.5 rounded-full ${cEstado.dot}`}></span>
                            <select
                              value={t.estado}
                              onChange={(e) => onUpdateField(t, "estado", e.target.value)}
                              className="text-[10px] font-bold py-0.5 bg-transparent border-0 cursor-pointer focus:outline-none focus:ring-0 text-zinc-600 font-sans"
                            >
                              {LISTA_ESTADOS_VALIDOS.map(opt => (
                                <option key={opt} value={opt} className="bg-white text-zinc-800">
                                  {opt.substring(opt.indexOf(" ") + 1)}
                                </option>
                              ))}
                            </select>
                          </div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            </div>

            <div className="lg:col-span-5 flex flex-col gap-3">
              <span className="text-[10px] md:text-xs font-black uppercase tracking-widest text-zinc-400">Planificador Mensual</span>
              <div className={`border ${currentTheme.border} rounded-2xl p-4 md:p-5 flex flex-col gap-4 ${currentTheme.cardBg}`}>
                <div className="flex justify-between items-center border-b pb-2">
                  <span className="text-xs font-bold text-zinc-855">{nombresMeses[hoy.getMonth()]} {hoy.getFullYear()}</span>
                </div>
                
                <div className="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-zinc-400 border-b pb-1.5">
                  <span>Lu</span><span>Ma</span><span>Mi</span><span>Ju</span><span>Vi</span><span>Sá</span><span>Do</span>
                </div>
                <div className="grid grid-cols-7 gap-1">
                  {diasMes.map((cell, idx) => {
                    if (!cell) return <div key={idx} className="aspect-square opacity-0"></div>;
                    
                    const tareasDia = cell.fechaStr ? tareas.filter(t => sonMismasFechas(t.deadline, cell.fechaStr)) : [];
                    const esHoy = cell.fechaStr === new Date().toISOString().split('T')[0];
                    const esSeleccionado = cell.fechaStr === plannerSelectedDay;

                    return (
                      <button 
                        key={idx} 
                        onClick={() => setPlannerSelectedDay(cell.fechaStr)}
                        className={`aspect-square rounded-lg flex flex-col items-center justify-center relative text-xs font-black transition-all ${
                          esHoy 
                            ? 'bg-zinc-900 text-white shadow-sm' 
                            : esSeleccionado
                              ? 'bg-indigo-600 text-white shadow-sm scale-105'
                              : 'hover:bg-zinc-100 text-zinc-700'
                        }`}
                      >
                        <span>{cell.dia}</span>
                        {tareasDia.length > 0 && (
                          <span className={`w-1.5 h-1.5 rounded-full absolute bottom-1 ${esHoy || esSeleccionado ? 'bg-white' : 'bg-indigo-600'}`}></span>
                        )}
                      </button>
                    );
                  })}
                </div>

                <div className="border-t border-zinc-100 pt-3 mt-1">
                  <span className="text-[10px] font-black uppercase tracking-wider text-zinc-400 block mb-2">
                    Detalles para el {plannerSelectedDay ? plannerSelectedDay.split('-')[2] + '/' + plannerSelectedDay.split('-')[1] : "---"}
                  </span>
                  <div className="flex flex-col gap-1.5 max-h-40 overflow-y-auto pr-1">
                    {tareasDelDiaSeleccionadoInPlanner.length === 0 ? (
                      <p className="text-xs text-zinc-400 font-semibold italic py-2">Sin entregables agendados para este día.</p>
                    ) : (
                      tareasDelDiaSeleccionadoInPlanner.map(t => {
                        const styleM = getMarcaStyle(t.marca);
                        return (
                          <div 
                            key={t.idTarea + t.info}
                            onClick={() => onSelectTask(t)}
                            className="bg-zinc-50 border p-2 rounded-lg hover:border-zinc-400 transition-all cursor-pointer flex flex-col gap-0.5 text-left"
                          >
                            <span className={`text-[8px] font-black px-1.5 py-0.5 rounded border uppercase tracking-wider self-start ${styleM.bg} ${styleM.text} ${styleM.border}`}>
                              {styleM.label || t.marca}
                            </span>
                            <span className="text-xs font-bold truncate text-zinc-800 mt-1">{t.info}</span>
                            {t.personas && <span className="text-[10px] text-zinc-400 font-semibold">Asignado: {t.personas}</span>}
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>

              </div>
            </div>

          </div>
        </div>
      );
    }

    // =========================================================================
    // 📂 COMPONENTE: LAYOUT DE DIRECTORIO DE CLIENTES (Vista de Clientes)
    // =========================================================================
    function LayoutClientes({ marcasMetadata, onSelectBrand, currentTheme, adminMode, onSaveMetadata, onCreateBrand, marcasDisponibles }) {
      const [showAddBrandModal, setShowAddBrandModal] = useState(false);
      const [showEditBrandModal, setShowEditBrandModal] = useState(null);

      // Estado formulario para nueva marca
      const [newBrandName, setNewBrandName] = useState("");
      const [newLogoUrl, setNewLogoUrl] = useState("");
      const [newEjecutivo, setNewEjecutivo] = useState("");
      const [newDisenador, setNewDisenador] = useState("");
      const [newContent, setNewContent] = useState("");

      // Estado para edición de marca
      const [editLogoUrl, setEditLogoUrl] = useState("");
      const [editEjecutivo, setEditEjecutivo] = useState("");
      const [editDisenador, setEditDisenador] = useState("");
      const [editContent, setEditContent] = useState("");

      const handleOpenEdit = (brand) => {
        const metadata = marcasMetadata[brand] || {};
        setEditLogoUrl(metadata.logoUrl || "");
        setEditEjecutivo(metadata.ejecutivo || "");
        setEditDisenador(metadata.disenador || "");
        setEditContent(metadata.content || "");
        setShowEditBrandModal(brand);
      };

      const handleSaveEditSubmit = (e) => {
        e.preventDefault();
        onSaveMetadata(showEditBrandModal, {
          logoUrl: editLogoUrl,
          ejecutivo: editEjecutivo,
          disenador: editDisenador,
          content: editContent
        });
        setShowEditBrandModal(null);
      };

      const handleCreateBrandSubmit = (e) => {
        e.preventDefault();
        if (!newBrandName.trim()) return;
        onCreateBrand({
          nuevaMarca: newBrandName.trim(),
          logoUrl: newLogoUrl.trim(),
          ejecutivo: newEjecutivo.trim(),
          disenador: newDisenador.trim(),
          content: newContent.trim()
        });
        setNewBrandName("");
        setNewLogoUrl("");
        setNewEjecutivo("");
        setNewDisenador("");
        setNewContent("");
        setShowAddBrandModal(false);
      };

      return (
        <div className="flex flex-col gap-6 animate-slide-in pb-12">
          <div className="flex justify-between items-center">
            <div>
              <h2 className="text-lg font-black tracking-tight text-zinc-900">Directorio de Clientes de la Agencia</h2>
              <p className="text-xs text-zinc-400 font-semibold mt-1">Gestión interna, roles del área y enlaces de marcas autorizadas.</p>
            </div>
            {adminMode && (
              <button 
                onClick={() => setShowAddBrandModal(true)}
                className={`${currentTheme.primary} px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-sm flex items-center gap-1.5`}
              >
                <i className="fa-solid fa-folder-plus text-xs"></i> Crear Nuevo Cliente
              </button>
            )}
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            {marcasDisponibles.map(brand => {
              const metadata = marcasMetadata[brand] || {};
              const logo = metadata.logoUrl || `https://placehold.co/120x60/f4f4f5/52525b?text=${brand}`;
              
              return (
                <div 
                  key={brand}
                  className={`border ${currentTheme.border} rounded-2xl p-5 flex flex-col gap-4 shadow-sm hover:shadow-md transition-all ${currentTheme.cardBg}`}
                >
                  <div className="flex justify-between items-start">
                    <div className="h-12 w-28 bg-zinc-50/50 rounded-xl border border-zinc-200/50 p-1 flex items-center justify-center overflow-hidden">
                      <img 
                        src={logo} 
                        alt={brand} 
                        className="max-h-full max-w-full object-contain"
                        onError={(e) => {
                          e.target.src = `https://placehold.co/120x60/f4f4f5/52525b?text=${brand}`;
                        }}
                      />
                    </div>
                    {adminMode && (
                      <button 
                        onClick={() => handleOpenEdit(brand)}
                        className="text-zinc-400 hover:text-zinc-800 p-1 text-xs"
                        title="Editar ficha"
                      >
                        <i className="fa-solid fa-pen-to-square"></i> Editar
                      </button>
                    )}
                  </div>

                  <div>
                    <h3 className="text-sm font-black text-zinc-855 uppercase tracking-wider">{brand}</h3>
                    <span className="text-[10px] text-zinc-400 font-black uppercase tracking-widest block mt-0.5">Cliente de Agencia</span>

      useEffect(() => {
        const u = localStorage.getItem("robin_usuario_actual");
        if (u === "null" || u === "undefined") {
          localStorage.removeItem("robin_usuario_actual");
          setUsuario(null);
        }

        if (n === "null" || n === "undefined") {
          localStorage.removeItem("robin_nombre_completo");
          setNombreCompleto("");
        }
      }, []);

      useEffect(() => {
        if (usuario) {
          fetchData(false);
        }
      }, [usuario]);

      useEffect(() => {
        if (!usuario) return;

        // Auto-refresco silencioso cada 30 segundos
        const autoRefreshInterval = setInterval(() => {
          if (!syncing && !loading) {
            fetchData(true); 
          }
        }, 30 * 1000); 
        
        return () => clearInterval(autoRefreshInterval);
      }, [usuario, syncing, loading]);

      useEffect(() => {
        if (tareas.length > 0) {
          const detectadas = new Set();
          tareas.forEach(t => {
            if (t.personas) {
              const nombres = t.personas.split(/[\s,]+/);

                const limpio = n.trim();

                  detectadas.add(conArroba);
                }
              });

          });
          if (detectadas.size > 0) {

            localStorage.setItem("robin_personas_v2", JSON.stringify(combinadas));
            setListaPersonas(combinadas);

      const showToast = (msg, type = "success") => {

      const handleAddWidget = async (nuevoWidget) => {

          await fetch(effectiveUrl, {

            body: JSON.stringify({
              marca: "Config_Marcas",

              info: nuevoWidget.titulo,

      };

      const handleDeleteWidget = async (id, titulo) => {
        setWidgets(prev => prev.filter(w => w.id !== id));

        const effectiveUrl = getEffectiveApiUrl(AUTO_API_URL);

          showToast("Widget de área eliminado localmente", "info");

        setSyncing(true);
        try {
          await fetch(effectiveUrl, {
            method: "POST", mode: "cors", redirect: "follow",

            body: JSON.stringify({
              marca: "Config_Marcas",
              idTarea: id,

          });
          showToast("Accesos actualizados en la nube", "success");

          showToast("Error al eliminar widget online", "error");
        } finally {
          setSyncing(false);
        }
      };

      const handleSaveNombreCompleto = (e) => {
        e.preventDefault();
        localStorage.setItem("robin_nombre_completo", nombreCompleto);
        showToast("Nombre completo configurado", "success");
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const userClean = e.target.username.value.trim().toLowerCase();
        if (!listaUsuarios.includes(userClean)) {
          setLoginError("Usuario no autorizado. Contacta al administrador.");

        if (claveInput.toLowerCase() !== "tmk2026") {
          setLoginError("Contraseña incorrecta. Inténtalo de nuevo.");

        }

        localStorage.setItem("robin_usuario_actual", userClean);

      const handleLogout = () => {
        try {
          localStorage.removeItem("robin_usuario_actual");
          localStorage.removeItem("robin_nombre_completo");
          localStorage.clear(); 
        } catch (e) {
          console.error("Error al limpiar almacenamiento local:", e);
        }
        setUsuario(null);
        setNombreCompleto("");
        setClaveInput("");
        setPaginaActiva("home");
        showToast("Sesión cerrada correctamente", "info");
      };

      const handleAddUser = (e) => {
        e.preventDefault();
        const nuevo = nuevoUsuarioInput.trim().toLowerCase();
        if (!nuevo) return;
        if (listaUsuarios.includes(nuevo)) {
          showToast("El usuario ya está registrado", "error");
          return;
        }
        const actualizados = [...listaUsuarios, nuevo];
        setListaUsuarios(actualizados);
        localStorage.setItem("robin_lista_usuarios", JSON.stringify(actualizados));
        
        registrarNuevaPersonaGlobal("@" + nuevo);

        setNuevoUsuarioInput("");
        showToast("Usuario autorizado correctamente", "success");
      };

      const handleThemeChange = (newTheme) => {
        setTheme(newTheme);
        localStorage.setItem("robin_theme", newTheme);
        showToast(`Estilo cambiado a ${newTheme.toUpperCase()}`, "success");
      };

      // FETCH DE DATOS: Agrupamiento, deduplicación e inyección de seguridad
      const fetchData = async (isBackground = false) => {
        if (!isBackground) setLoading(true);
        setApiError(null);
        
        const effectiveUrl = getEffectiveApiUrl(AUTO_API_URL);
        if (!effectiveUrl || effectiveUrl.includes("your_actual_url_here")) {
          setTareas([]); 
          if (!isBackground) showToast("Base de datos no configurada o vacía", "info");
          setLoading(false);
          return;
        }

        try {
          const res = await fetch(effectiveUrl, { 
            method: "GET", mode: "cors", redirect: "follow"
          });
          const json = await res.json();
          if (json.success && json.data) {
            
            // 🌐 1. Cargar Widgets Globales desde Google Sheets
            if (json.widgets) {
              setWidgets(json.widgets);
            }

            // 📋 2. Filtrar tareas y aplicar VALIDACIÓN ESTRICTA contra desalineaciones corruptas
            const tareasValidas = json.data.filter(t => {
              if (!t.info || t.info.toString().trim() === "") return false;
              if (!t.marca || t.marca.toString().trim() === "") return false;
              
              // Si la marca es un estado debido a desalineación, es corrupto
              const cleanM = t.marca.toString().trim().toLowerCase();
              if (cleanM === "pendiente" || cleanM.includes("progreso") || cleanM.includes("seguimiento") || cleanM.includes("revision") || cleanM.includes("pausa") || cleanM.includes("completada") || cleanM === "config_marcas") {
                return false;
              }
              return true;
            });
            
            // 🧼 3. Deduplicación inteligente utilizando únicamente IDs reales o vacíos (STB- preventivos)
            const deduplicadas = [];
            const seenKeys = new Set();

            tareasValidas.forEach(t => {
              const cleanId = t.idTarea ? String(t.idTarea).trim() : "";
              const hasRealId = isValidIdTarea(cleanId);
              
              const realId = hasRealId ? cleanId : "";
              const key = `${t.marca || ""}|${t.info || ""}|${t.deadline || ""}`.toLowerCase().replace(/\s+/g, " ").trim();
                
              if (!seenKeys.has(key)) {
                seenKeys.add(key);
                deduplicadas.push({
                  ...t,
                  idTarea: realId
                });
              }
            });

            setTareas(deduplicadas);
            
            if (json.marcasMetadata) {
              setMarcasMetadata(json.marcasMetadata);
            }
            if (!isBackground) {
              showToast("Sincronizado con Google Sheets", "success");
            }

          } else {
            throw new Error(json.error || "No se recibieron datos.");
          }
        } catch (e) {
          console.error("Error cargando Google Sheets: ", e);
          setApiError("Error de Conexión.");
          setTareas([]); 
          if (!isBackground) showToast("Error al conectar con Google Sheets", "error");
        } finally {
          setLoading(false);
        }
      };

      const handleUpdateField = async (tarea, campo, nuevoValor) => {
        if (!nuevoValor && nuevoValor !== "") return;

        const taskTargetId = cleanIdTarea(tarea.idTarea);

        let detallesConHistorial = tarea.detalles || "";
        if (campo === "estado") {
          const hoy = new Date();
          const timestamp = `${hoy.getDate()}/${hoy.getMonth() + 1} ${hoy.getHours()}:${String(hoy.getMinutes()).padStart(2, '0')}`;
          const registro = `\n• [${timestamp}] Estado cambiado a "${nuevoValor}" por @${usuario}`;
          detallesConHistorial = detallesConHistorial + registro;
        }

        // ⚡ PASO OPTIMISTA: Actualiza el estado local en pantalla de inmediato
        const temp = tareas.map(t => {
          if ((t.idTarea === tarea.idTarea && t.idTarea) || t.info === tarea.info) {
            return { 
              ...t, 
              idTarea: taskTargetId,
              [campo]: nuevoValor,
              detalles: campo === "estado" ? detallesConHistorial : t.detalles
            };
          }
          return t;
        });
        setTareas(temp);

        const effectiveUrl = getEffectiveApiUrl(AUTO_API_URL);
        if (!effectiveUrl || effectiveUrl.includes("your_actual_url_here") || apiError) {
          showToast("Cambio guardado localmente", "success");
          return;
        }

        // Sincroniza silenciosamente en background sin bloquear la interfaz
        setSyncing(true);
        try {
          await fetch(effectiveUrl, {
            method: "POST", mode: "cors", redirect: "follow",
            headers: { "Content-Type": "text/plain; charset=utf-8" },
            body: JSON.stringify({
              marca: tarea.marca, 
              idTarea: taskTargetId, 
              info: tarea.info, 
              categoria: tarea.categoria,
              campo: "todo", 
              valor: nuevoValor, 
              personas: tarea.personas,
              detalles: detallesConHistorial, 
              estado: campo === "estado" ? nuevoValor : tarea.estado,
              deadline: campo === "deadline" ? nuevoValor : tarea.deadline
            })
          });
        } catch (e) {
          showToast("Error de red al actualizar en la nube", "error");
        } finally {
          setSyncing(false);
        }
      };

      const handleSaveTaskModal = async (editedTask) => {
        const index = tareas.findIndex(t => (t.idTarea === editedTask.idTarea && t.idTarea) || t.info === editedTask.info);
        if (index === -1) return;

        const hoy = new Date();
        const timestamp = `${hoy.getDate()}/${hoy.getMonth() + 1} ${hoy.getHours()}:${String(hoy.getMinutes()).padStart(2, '0')}`;
        let detallesAudoria = editedTask.detalles || "";
        
        const original = tareas[index];
        const cambios = [];
        if (original.info !== editedTask.info) cambios.push("título");
        if (original.categoria !== editedTask.categoria) cambios.push("categoría");
        if (original.personas !== editedTask.personas) cambios.push("asignados");
        if (original.estado !== editedTask.estado) cambios.push(`estado a "${editedTask.estado}"`);
        if (original.deadline !== editedTask.deadline) cambios.push("fecha límite");

        if (cambios.length > 0) {
          detallesAudoria += `\n• [${timestamp}] Editado (${cambios.join(", ")}) por @${usuario}`;
        }

        const taskConHistorial = { ...editedTask, detalles: detallesAudoria };

        // ⚡ PASO OPTIMISTA: Guardamos en pantalla localmente y cerramos la ficha lateral al instante
        const copiaTareas = [...tareas];
        copiaTareas[index] = taskConHistorial;
        setTareas(copiaTareas);
        setIsEditing(false);
        setActiveTask(null);

        const effectiveUrl = getEffectiveApiUrl(AUTO_API_URL);
        if (!effectiveUrl || effectiveUrl.includes("your_actual_url_here") || apiError) {
          showToast("Cambios guardados de forma local", "success");
          return;
        }

        // Envío asíncrono pasivo a Google Sheets
        setSyncing(true);
        try {
          await fetch(effectiveUrl, {
            method: "POST", mode: "cors", redirect: "follow",
            headers: { "Content-Type": "text/plain; charset=utf-8" },
            body: JSON.stringify({
              marca: taskConHistorial.marca, 
              idTarea: cleanIdTarea(taskConHistorial.idTarea), 
              info: taskConHistorial.info,
              originalInfo: original.info, 
              categoria: taskConHistorial.categoria, 
              personas: taskConHistorial.personas, 
              detalles: taskConHistorial.detalles,
              estado: taskConHistorial.estado, 
              deadline: taskConHistorial.deadline, 
              campo: "todo"
            })
          });
          showToast("Ficha sincronizada con Sheets", "success");
        } catch (e) {
          showToast("Error de conexión. Se guardó localmente.", "error");
        } finally {
          setSyncing(false);
        }
      };

      const handleDeleteTask = async (tarea) => {
        // ⚡ PASO OPTIMISTA: Borrado de pantalla instantáneo
        setTareas(prev => prev.filter(t => !(t.idTarea === tarea.idTarea && t.info === tarea.info)));
        setTaskToDelete(null);
        setIsEditing(false);
        setActiveTask(null);

        const effectiveUrl = getEffectiveApiUrl(AUTO_API_URL);
        if (!effectiveUrl || effectiveUrl.includes("your_actual_url_here") || apiError) {
          showToast("Eliminado localmente", "success");
          return;
        }
