  <!-- Bloqueo de zoom: debe ejecutarse antes que el resto -->
  <script>
    (function () {
      var opts = { passive: false };
      var stop = function (e) { e.preventDefault(); };
      document.addEventListener("gesturestart", stop, opts);
      document.addEventListener("gesturechange", stop, opts);
      document.addEventListener("gestureend", stop, opts);
      document.addEventListener("touchstart", function (e) {
        if (e.touches.length > 1) stop(e);
      }, opts);
      document.addEventListener("touchmove", function (e) {
        if (e.touches.length > 1) stop(e);
      }, opts);
      var lockViewport = "width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover";
      var applyViewport = function () {
        var meta = document.querySelector('meta[name="viewport"]');
        if (meta) meta.setAttribute("content", lockViewport);
      };
      applyViewport();
      window.addEventListener("orientationchange", function () {
        setTimeout(applyViewport, 200);
      });
    })();
  </script>

  <script>
    window.__robinBootStartedAt = Date.now();
    (function robinBootPersonalize() {
      function safeGet(key) {
        try { return localStorage.getItem(key); } catch (e) { return null; }
      }

      function primerNombreBoot() {
        var user = safeGet("robin_usuario_actual");
        if (!user || user === "null" || user === "undefined") return null;
        user = String(user).replace(/^@/, "").toLowerCase().trim();
        if (!user) return null;

        var nombresEquipo = {
          mbonilla: "Miguel",
          ralvarez: "Ricardo",
          dsalavarria: "Daniela",
          fcolmenares: "Francisco",
          gnebrus: "Genesis",
          sgiucastro: "Sofia",
          dsanchez: "Douglas",
          jalfiero: "Jesús",
          arusso: "Alejandro",
          arodriguez: "Angelo",
          agraterol: "Aaron",
          dmatheus: "David",
          cmujica: "Carlos",
          admin: "Admin"
        };

        try {
          var raw = safeGet("robin_user_data_" + user);
          if (raw) {
            var prefs = JSON.parse(raw);
            var nombre = String(prefs.perfilNombre || "").trim();
            if (!nombre && prefs.nombreCompleto) {
              nombre = String(prefs.nombreCompleto).trim().split(/\s+/)[0];
            }
            if (nombre) return nombre;
          }
        } catch (e) { /* ignore */ }

        if (nombresEquipo[user]) return nombresEquipo[user];
        return user.charAt(0).toUpperCase() + user.slice(1);
      }

      var greeting = document.getElementById("robin-boot-greeting");
      if (!greeting) return;

      var nombre = primerNombreBoot();
      if (nombre) {
        greeting.innerHTML = 'Hola, <span class="robin-boot-splash__name">' + nombre + "</span>";
      } else {
        greeting.textContent = "Bienvenido";
      }
    })();
  </script>

  <script>
    (function robinEarlyBootGuard() {
      var root = document.getElementById("root");
      if (!root) return;

      var showBootError = function (message) {
        root.innerHTML =
          '<div style="font-family:Inter,sans-serif;padding:24px;max-width:420px;margin:40px auto;color:#37352F;">' +
          '<p style="font-weight:700;margin-bottom:8px;">No se pudo cargar ROBIN</p>' +
          '<p style="font-size:13px;color:#71717a;line-height:1.5;margin-bottom:12px;">' + message + '</p>' +
          '<button type="button" onclick="location.reload()" style="padding:8px 12px;border:1px solid #e4e4e7;border-radius:6px;background:#fff;font-size:12px;font-weight:600;cursor:pointer;">Recargar</button>' +
          '</div>';
      };

      if (window.location.protocol === "file:") {
        showBootError(
          "No abras index.html directamente desde el disco. Usa un servidor local (Live Server, python -m http.server) o la URL publicada de la PWA."
        );
        return;
      }

      window.setTimeout(function () {
        var splash = document.querySelector("[data-robin-boot]");
        if (splash) {
          showBootError(
            "La aplicación no compiló. Revisa tu conexión, recarga la página o borra la caché de la PWA."
          );
        }
      }, 12000);
    })();
  </script>

  <!-- Boot crítico inline -->
  <script>
    (function () {
      var ROBIN_BUILD = "129";
      try {
        localStorage.setItem("robin_build", ROBIN_BUILD);
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
        }
        if (typeof caches !== "undefined" && caches.keys) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k); });
          });
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
